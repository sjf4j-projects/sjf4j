name: SpotBugs

# Temporary verification of merged correctness fixes; do not merge this PR.

on:
  workflow_dispatch:
  # Validate changes to the analysis configuration; ordinary code PRs do not run it.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/spotbugs.yml'
      - 'build.gradle.kts'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Analyze production and generated classes
        run: ./gradlew spotbugsAll --continue --max-workers=2
      - name: Show SpotBugs summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/reports/spotbugs/summary.txt ]]; then
            {
              echo '### SpotBugs summary'
              echo
              echo '~~~text'
              cat build/reports/spotbugs/summary.txt
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SpotBugs aggregate summary was not produced; check the analysis logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: |
            build/reports/spotbugs/
            **/build/reports/spotbugs/
          if-no-files-found: error
