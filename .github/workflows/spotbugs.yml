name: SpotBugs

on:
  workflow_dispatch:
  # Temporary stacked verification for PR #419; do not merge.
  pull_request:
    branches: [fix/generated-member-reachability]
    paths:
      - '.github/workflows/spotbugs.yml'
      - 'build.gradle.kts'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: before
            sha: 39ce8c63a4f869eff4462ce51cfa2a5b929a4c1d
          - revision: after
            sha: cc25445f02157a577bf7406ad9cf010b005f4e83
    name: SpotBugs / ${{ matrix.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Analyze production and generated classes
        run: ./gradlew spotbugsAll --continue --max-workers=2
      - name: Show SpotBugs summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/reports/spotbugs/summary.txt ]]; then
            {
              echo '### SpotBugs summary'
              echo
              echo '~~~text'
              cat build/reports/spotbugs/summary.txt
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SpotBugs aggregate summary was not produced; check the analysis logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports-${{ matrix.revision }}
          path: |
            build/reports/spotbugs/
            **/build/reports/spotbugs/
          if-no-files-found: error
