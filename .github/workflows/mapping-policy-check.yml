name: Mapping policy validation

on:
  push:
    branches:
      - test/mapstruct-mapping-cases-batch1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core numeric tests
        id: core
        continue-on-error: true
        run: ./gradlew :sjf4j-core:test --tests org.sjf4j.util.NumbersTest --stacktrace
      - name: Processor diagnostics tests
        id: processor
        continue-on-error: true
        run: ./gradlew :sjf4j-processor:test --tests 'org.sjf4j.processor.CompiledMapper*' --stacktrace
      - name: Mapping regression suites
        id: mapping
        continue-on-error: true
        run: ./gradlew :sjf4j-testbench:test --tests 'org.sjf4j.testbench.processor.mapper.Mapper*' --stacktrace
      - name: Summarize JUnit XML
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for module in ('sjf4j-core','sjf4j-processor','sjf4j-testbench'):
              total = failed = errors = 0
              for path in glob.glob(module+'/build/test-results/test/TEST-*.xml'):
                  root = ET.parse(path).getroot()
                  total += int(root.attrib.get('tests','0'))
                  failed += int(root.attrib.get('failures','0'))
                  errors += int(root.attrib.get('errors','0'))
                  for case in root.findall('.//testcase'):
                      for bad in list(case.findall('failure')) + list(case.findall('error')):
                          print(path, case.attrib.get('name'), (bad.attrib.get('message') or '')[:1200])
              print(module, 'TOTAL', total, 'FAILED', failed, 'ERRORS', errors)
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-policy-junit
          path: |
            sjf4j-core/build/test-results/test/
            sjf4j-processor/build/test-results/test/
            sjf4j-testbench/build/test-results/test/
      - name: Enforce all suites
        if: always()
        env:
          CORE: ${{ steps.core.outcome }}
          PROCESSOR: ${{ steps.processor.outcome }}
          MAPPING: ${{ steps.mapping.outcome }}
        run: |
          echo "core=$CORE processor=$PROCESSOR mapping=$MAPPING"
          test "$CORE" = success && test "$PROCESSOR" = success && test "$MAPPING" = success
