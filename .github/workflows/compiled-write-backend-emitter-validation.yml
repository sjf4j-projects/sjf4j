name: Compiled Write Backend Emitter Validation
on:
  push:
    branches: [perf/compiled-write-emitter-refactor-ci]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: All binder regressions
        run: |
          ./gradlew \
            :sjf4j-processor:test \
            :sjf4j-backend-fastjson2:test \
            :sjf4j-backend-jackson2:test \
            :sjf4j-backend-jackson3:test \
            :sjf4j-backend-gson:test \
            :sjf4j-backend-jsonp:test \
            :sjf4j-backend-snake:test \
            :sjf4j-testbench:test \
            --no-daemon
      - name: Build JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Compiled write regression JMH
        run: |
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledWriteBenchmark.json_(jackson2|jackson3|gson|fastjson2|jsonp|simple)_pojo_(utf8|string)_compiled$' \
            -wi 3 -i 5 -w 300ms -r 500ms -f 1
