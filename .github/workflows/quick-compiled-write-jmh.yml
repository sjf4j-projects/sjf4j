name: Quick Compiled Write JMH

on:
  push:
    branches:
      - perf/compiled-binder-round2-native-string-output
    paths:
      - .github/workflows/quick-compiled-write-jmh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-jmh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Build JMH executable
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
      - name: Run focused String write benchmarks
        run: |
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledWriteBenchmark\\.json_(jackson2|jackson3|fastjson2)_(pojo|map)_string_(compiled|runtime|native)$' \
            -f 1 -wi 3 -w 150ms -i 5 -r 250ms -t 1 \
            -rf json -rff quick-compiled-write-jmh.json | tee quick-compiled-write-jmh.txt
      - name: Upload focused results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-compiled-write-jmh
          path: |
            quick-compiled-write-jmh.json
            quick-compiled-write-jmh.txt
          if-no-files-found: ignore
