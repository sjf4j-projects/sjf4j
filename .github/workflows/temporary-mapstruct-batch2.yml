name: MapStruct inspired Mapper cases batch 2

on:
  push:
    branches:
      - test/mapstruct-mapping-cases-batch2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run mapper processor tests
        id: processor
        continue-on-error: true
        run: ./gradlew :sjf4j-processor:test --tests 'org.sjf4j.processor.CompiledMapper*' --stacktrace
      - name: Compile and run mapper testbench tests
        id: testbench
        continue-on-error: true
        run: ./gradlew :sjf4j-testbench:test --tests 'org.sjf4j.testbench.processor.mapper.Mapper*' --stacktrace
      - name: Show failing and passing JUnit cases
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for mod in ('sjf4j-processor','sjf4j-testbench'):
            files=glob.glob(mod+'/build/test-results/test/TEST-*.xml')
            total=failed=errors=0
            for path in files:
              root=ET.parse(path).getroot()
              total+=int(root.attrib.get('tests','0'))
              failed+=int(root.attrib.get('failures','0'))
              errors+=int(root.attrib.get('errors','0'))
              for case in root.findall('.//testcase'):
                for e in case.findall('failure')+case.findall('error'):
                  print('FAIL:', path, case.attrib.get('name'), (e.attrib.get('message') or '')[:1800])
            print(mod, 'TOTAL', total, 'FAILED', failed, 'ERRORS', errors)
          PY
      - name: Upload tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch2-junit-xml
          path: |
            sjf4j-processor/build/test-results/test/
            sjf4j-testbench/build/test-results/test/
      - name: Final status (retain red tests)
        if: always()
        env:
          PROCESSOR: ${{ steps.processor.outcome }}
          TESTBENCH: ${{ steps.testbench.outcome }}
        run: |
          echo "processor=$PROCESSOR testbench=$TESTBENCH"
          test "$PROCESSOR" = success && test "$TESTBENCH" = success
