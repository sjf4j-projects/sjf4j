name: Experiment SchemaPlan static execution modes
on:
  push:
    branches: [experiment/schema-static-plan-mode]
    paths: [.github/workflows/schema-static-mode-exp.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Schema regression and JMH build
        run: ./gradlew :sjf4j-schema:test :sjf4j-testbench:test :sjf4j-testbench:jmhJar --no-daemon --console=plain
      - name: Build original PR benchmark on same runner
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/sjf4j-baseline" 554d4b1f1b05e0ef35a1cf666918fc464569a2c9
          (cd "$RUNNER_TEMP/sjf4j-baseline" && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
      - name: Same runner JMH with allocations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          regex='.*CreekSchemaBenchmark\.(schema_validate_map|schema_is_valid_map|schema_is_valid_fail_nested|schema_validate_fail_nested|schema_is_valid_fail_property)'
          for variant in optimized baseline; do
            if [ "$variant" = optimized ]; then root="$GITHUB_WORKSPACE"; else root="$RUNNER_TEMP/sjf4j-baseline"; fi
            jar=$(find "$root/sjf4j-testbench/build/libs" -maxdepth 1 -name '*jmh*.jar' -type f | head -n 1)
            java -jar "$jar" "$regex" -f 2 -wi 15 -i 5 -w 350ms -r 350ms -prof gc \
              -rf json -rff "$GITHUB_WORKSPACE/results/$variant.json" | tee "$GITHUB_WORKSPACE/results/$variant.txt"
          done
          python3 - <<'PY'
          import json
          for variant in ('baseline','optimized'):
              print('===',variant,'===')
              for row in json.load(open('results/'+variant+'.json')):
                  p=row['primaryMetric']
                  alloc=next((v['score'] for k,v in row['secondaryMetrics'].items() if k.endswith('gc.alloc.rate.norm')),None)
                  print(row['benchmark'].rsplit('.',1)[-1],round(p['score'],5),'+/-',round(p['scoreError'],5),'us/op',round(alloc,2),'B/op')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-static-mode-jmh
          path: results/
