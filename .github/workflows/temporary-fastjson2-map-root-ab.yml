name: Temporary Fastjson2 Untyped Map Root A-B
on:
  push:
    branches:
      - experiment/fastjson2-map-root-raw
    paths:
      - .github/workflows/temporary-fastjson2-map-root-ab.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Processor and Fastjson2 conformance
        shell: bash
        run: |
          ./gradlew :sjf4j-processor:test :sjf4j-backend-fastjson2:test :sjf4j-testbench:test --no-daemon --console=plain && exit 0
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for f in Path('sjf4j-processor/build/test-results/test').glob('TEST-*.xml'):
              for case in ET.parse(f).getroot().findall('.//testcase'):
                  for fail in case.findall('failure') + case.findall('error'):
                      print('TEST FAILURE',case.attrib.get('name'),fail.attrib.get('message'),(fail.text or '')[:1800])
          PY
          exit 1
      - name: Build unchanged and optimized JMH jars
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/map-root-a 535b51e90fe827b756762ac4dd10d2ad938276a3
          git worktree add --detach /tmp/map-root-b HEAD
          (cd /tmp/map-root-a && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
          (cd /tmp/map-root-b && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
      - name: Map and POJO control A-B-B-A
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for tag in a-1 b-1 b-2 a-2; do
            rev="${tag%-*}"
            java -jar /tmp/map-root-${rev}/sjf4j-testbench/build/libs/*-jmh.jar \
              '.*CompiledReadBenchmark[.]fastjson2_(map_(string|utf8)_(compiled|runtime|native)|pojo_string_compiled)$' \
              -f 1 -wi 5 -w 300ms -i 8 -r 350ms -t 1 \
              -rf json -rff results/${tag}.json | tee results/${tag}.txt
          done
      - name: Summarize results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          scores={}
          for tag in ('a-1','b-1','b-2','a-2'):
            for x in json.loads(Path('results',tag+'.json').read_text()):
              scores.setdefault(x['benchmark'].split('.')[-1],{})[tag]=x['primaryMetric']['score']
          for case,v in sorted(scores.items()):
            a=(v['a-1']+v['a-2'])/2
            b=(v['b-1']+v['b-2'])/2
            print(f'{case}: baseline {a:.6f}, raw graph {b:.6f}, delta {(b/a-1)*100:+.2f}%, runs {v}')
          PY
      - name: Upload raw JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-map-root-ab
          path: results/
          if-no-files-found: ignore
