name: Experiment / Jackson3 Users 1KB type-profile isolation

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-jackson3-users1k-c2-diagnosis.yml'

permissions:
  contents: read

jobs:
  diagnose:
    name: Jackson3 Users 1KB / Tiered C2 type profile controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build original JMH jar once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/xml
          ./gradlew --no-daemon :sjf4j-testbench:jmhJar
          jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -s "$jar"
          cp "$jar" results/benchmark.jar
          { echo "Commit: $GITHUB_SHA"; java -version 2>&1; lscpu; } > results/environment.txt
          sha256sum results/benchmark.jar > results/jar.sha256

      - name: JMH type-profile A/B, same host, same jar, two seeds
        shell: bash
        run: |
          set -euo pipefail
          bench='org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write'
          for mode in default no-use-type-profile no-c1-type-profile c2-only; do
            flags=()
            case "$mode" in
              no-use-type-profile) flags=(-jvmArgsAppend '-XX:-UseTypeProfile');;
              no-c1-type-profile) flags=(-jvmArgsAppend '-XX:TypeProfileLevel=0');;
              c2-only) flags=(-jvmArgsAppend '-XX:-TieredCompilation');;
            esac
            java -jar results/benchmark.jar "$bench" \
              -p backend=jackson3 -p model=users -p shape=pojo \
              -p sizeKb=1 -p seed=12345,324 \
              -p implementation=native,blackbird,compiled \
              -f 2 -t 1 -wi 4 -i 5 -w 400ms -r 400ms -prof gc \
              "${flags[@]}" -rf json -rff "results/$mode.json" \
              > "results/$mode.log" 2>&1 || {
                tail -110 "results/$mode.log"; exit 1;
              }
          done

      - name: Compare generated C2 code under each profile mode
        shell: bash
        run: |
          set -euo pipefail
          bench='org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write'
          for mode in default no-use-type-profile no-c1-type-profile c2-only; do
            flags="-XX:+UnlockDiagnosticVMOptions -XX:+LogCompilation -XX:LogFile=$PWD/results/xml/$mode.xml"
            case "$mode" in
              no-use-type-profile) flags="$flags -XX:-UseTypeProfile";;
              no-c1-type-profile) flags="$flags -XX:TypeProfileLevel=0";;
              c2-only) flags="$flags -XX:-TieredCompilation";;
            esac
            java -jar results/benchmark.jar "$bench" \
              -p backend=jackson3 -p model=users -p shape=pojo \
              -p sizeKb=1 -p seed=12345 -p implementation=compiled \
              -f 1 -t 1 -wi 5 -i 2 -w 450ms -r 450ms \
              -jvmArgsAppend "$flags" \
              -rf json -rff "results/$mode-diagnostic.json" \
              > "results/$mode-diagnostic.log" 2>&1 || {
                tail -110 "results/$mode-diagnostic.log"; exit 1;
              }
            test -s "results/xml/$mode.xml"
          done

      - name: Summarize ratios, memory and C2 method shapes
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('results')
          print('## Jackson3 Users 1KB: isolate C1 type-profile collection vs C2 type-profile consumption')
          print('Same JDK25 runner and unchanged JMH jar, Native/Blackbird/Compiled, both seeds, 2 forks; 4×400ms warmup and 5×400ms measured. JMH verifies JSON output.')
          print()
          print('| JIT mode | Seed | Native µs | Blackbird µs | Compiled µs | Blackbird/Compiled | Compiled alloc B/op |')
          print('|---|---:|---:|---:|---:|---:|---:|')
          for mode in ('default','no-use-type-profile','no-c1-type-profile','c2-only'):
              rows=json.loads((root/(mode+'.json')).read_text())
              assert len(rows)==6,(mode,len(rows))
              data={(x['params']['seed'],x['params']['implementation']):x for x in rows}
              for seed in ('12345','324'):
                  n,b,c=[data[(seed,x)]['primaryMetric']['score'] for x in ('native','blackbird','compiled')]
                  gc=data[(seed,'compiled')]['secondaryMetrics']['gc.alloc.rate.norm']['score']
                  print(f'| {mode} | {seed} | {n:.3f} | {b:.3f} | {c:.3f} | {b/c:.3f}x | {gc:.0f} |')
          print()
          print('### C2 size of generated writeUsers, _writeUser and _writeStringMember (diagnostic, separately compiled forks)')
          print('| Mode | writeUsers | _writeUser | _writeStringMember |')
          print('|---|---:|---:|---:|')
          for mode in ('default','no-use-type-profile','no-c1-type-profile','c2-only'):
              t=ET.parse(root/'xml'/(mode+'.xml'))
              nm={x.get('compile_id'):x for x in t.iter('nmethod') if x.get('compiler')=='c2'}
              sizes={}
              for task in t.iter('task'):
                  m=task.get('method','')
                  if 'FabienBindings$Jackson3_Impl ' not in m:continue
                  sub=m.split('FabienBindings$Jackson3_Impl ',1)[1].split(' ',1)[0]
                  if sub not in ('writeUsers','_writeUser','_writeStringMember'):continue
                  n=nm.get(task.get('compile_id'))
                  if n is not None:sizes[sub]=int(n.get('size'))
              print(f"| {mode} | {sizes.get('writeUsers','—')} | {sizes.get('_writeUser','—')} | {sizes.get('_writeStringMember','—')} |")
          print()
          print('Do not assume disabling an application-wide JVM option is a viable library optimization; this is a causal diagnostic only.')
          PY

      - name: Upload benchmark results and HotSpot XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-users1k-type-profile-ab
          path: |
            results/environment.txt
            results/jar.sha256
            results/summary.md
            results/*.json
            results/*.log
            results/xml/*.xml
          retention-days: 14
          if-no-files-found: warn
