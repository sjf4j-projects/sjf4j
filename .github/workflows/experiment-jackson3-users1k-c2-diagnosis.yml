name: Experiment / Jackson3 native write inlining ablation

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-jackson3-users1k-c2-diagnosis.yml'

permissions:
  contents: read

jobs:
  ablation:
    name: Jackson3 Users native numeric / object-start inline suppression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build unchanged Users JMH jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/xml
          ./gradlew --no-daemon :sjf4j-testbench:jmhJar
          jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -s "$jar"
          cp "$jar" results/benchmark.jar
          { echo "Commit: $GITHUB_SHA"; java -version 2>&1; lscpu; } > results/environment.txt
          sha256sum results/benchmark.jar > results/jar.sha256

      - name: Paired default-JIT JMH for 1/10/100KB Users
        shell: bash
        run: |
          set -euo pipefail
          bench='org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write'
          number='-XX:CompileCommand=dontinline,tools.jackson.core.json.UTF8JsonGenerator::writeNumber'
          start='-XX:CompileCommand=dontinline,tools.jackson.core.json.UTF8JsonGenerator::writeStartObject'
          for mode in default no-number no-start no-both; do
            flags=()
            case "$mode" in
              no-number) flags=(-jvmArgsAppend "$number");;
              no-start) flags=(-jvmArgsAppend "$start");;
              no-both) flags=(-jvmArgsAppend "$number $start");;
            esac
            impl=compiled
            if [[ "$mode" == default ]]; then impl=native,blackbird,compiled; fi
            java -jar results/benchmark.jar "$bench" \
              -p backend=jackson3 -p model=users -p shape=pojo \
              -p sizeKb=1,10,100 -p seed=12345,324 -p implementation="$impl" \
              -f 2 -t 1 -wi 3 -i 4 -w 350ms -r 350ms -prof gc \
              "${flags[@]}" -rf json -rff "results/$mode.json" \
              > "results/$mode.log" 2>&1 || {
                tail -110 "results/$mode.log"; exit 1;
              }
            if [[ "$mode" != default ]]; then
              grep -qF 'CompileCommand: dontinline' "results/$mode.log" || {
                echo "JVM did not acknowledge $mode directive"; exit 1;
              }
            fi
          done

      - name: Capture 1KB C2 code shape per mode without disturbing timed JMH
        shell: bash
        run: |
          set -euo pipefail
          bench='org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write'
          number='-XX:CompileCommand=dontinline,tools.jackson.core.json.UTF8JsonGenerator::writeNumber'
          start='-XX:CompileCommand=dontinline,tools.jackson.core.json.UTF8JsonGenerator::writeStartObject'
          for mode in default no-number no-start no-both; do
            flags="-XX:+UnlockDiagnosticVMOptions -XX:+LogCompilation -XX:LogFile=$PWD/results/xml/$mode.xml"
            case "$mode" in
              no-number) flags="$flags $number";;
              no-start) flags="$flags $start";;
              no-both) flags="$flags $number $start";;
            esac
            java -jar results/benchmark.jar "$bench" \
              -p backend=jackson3 -p model=users -p shape=pojo \
              -p sizeKb=1 -p seed=12345 -p implementation=compiled \
              -f 1 -t 1 -wi 5 -i 2 -w 400ms -r 400ms \
              -jvmArgsAppend "$flags" \
              -rf json -rff "results/$mode-diagnostic.json" \
              > "results/$mode-diagnostic.log" 2>&1 || {
                tail -110 "results/$mode-diagnostic.log"; exit 1;
              }
            test -s "results/xml/$mode.xml"
          done

      - name: Summarize paired ratios and C2 native call evidence
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('results')
          data={}
          for mode in ('default','no-number','no-start','no-both'):
              rows=json.loads((root/(mode+'.json')).read_text())
              expected=18 if mode=='default' else 6
              assert len(rows)==expected,(mode,len(rows))
              data[mode]={(x['params']['sizeKb'],x['params']['seed'],x['params']['implementation']):x for x in rows}
          print('## Jackson3 Users POJO Write: native writeNumber/writeStartObject inlining ablation')
          print('Unmodified same JMH jar, one JDK25 runner, default tiered compiler, 2 forks, 3x350ms warmup+4x350ms measured, GC profiler.')
          print('**Baseline / Variant > 1** means suppressing that Jackson native inline makes Compiled faster.')
          print()
          print('| KB | Seed | Baseline µs/op | No number µs/op | No start µs/op | No both µs/op | Baseline/No number | Baseline/No start | Baseline/No both | Alloc delta No both B/op | BB / Baseline |')
          print('|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|')
          for kb in ('1','10','100'):
              for seed in ('12345','324'):
                  key=(kb,seed,'compiled')
                  d={mode:data[mode][key] for mode in data}
                  v=lambda mode:d[mode]['primaryMetric']['score']
                  alloc=lambda mode:d[mode]['secondaryMetrics']['gc.alloc.rate.norm']['score']
                  bb=data['default'][(kb,seed,'blackbird')]['primaryMetric']['score']
                  print(f"| {kb} | {seed} | {v('default'):.3f} | {v('no-number'):.3f} | {v('no-start'):.3f} | {v('no-both'):.3f} | {v('default')/v('no-number'):.3f}x | {v('default')/v('no-start'):.3f}x | {v('default')/v('no-both'):.3f}x | {alloc('no-both')-alloc('default'):+.0f} | {bb/v('default'):.3f}x |")
          print()
          print('### C2 _writeUser code size and inline choices (separate non-measured diagnostic forks)')
          print('| Mode | C2 nmethod bytes | writeNumber inline success/fail | writeStartObject inline success/fail | _writeStringMember inline success/fail |')
          print('|---|---:|---|---|---|')
          for mode in ('default','no-number','no-start','no-both'):
              tree=ET.parse(root/'xml'/(mode+'.xml'))
              nm={x.get('compile_id'):x for x in tree.iter('nmethod') if x.get('compiler')=='c2'}
              matches=[x for x in tree.iter('task') if 'FabienBindings$Jackson3_Impl _writeUser ' in x.get('method','') and x.get('compile_id') in nm]
              assert matches,(mode,'no C2 _writeUser task')
              task=matches[-1]
              methods={x.get('id'):x.get('name') for x in task.iter('method')}
              stat={x:[0,0] for x in ('writeNumber','writeStartObject','_writeStringMember')}
              for parent in task.iter('parse'):
                  children=list(parent)
                  for i,node in enumerate(children):
                      if node.tag!='call':continue
                      method=methods.get(node.get('method'),'')
                      if method not in stat:continue
                      decision=next((x for x in children[i+1:i+5] if x.tag in ('inline_success','inline_fail')),None)
                      if decision is not None:stat[method][0 if decision.tag=='inline_success' else 1]+=1
              print(f"| {mode} | {nm[task.get('compile_id')].get('size')} | {stat['writeNumber'][0]}/{stat['writeNumber'][1]} | {stat['writeStartObject'][0]}/{stat['writeStartObject'][1]} | {stat['_writeStringMember'][0]}/{stat['_writeStringMember'][1]} |")
          print('CompileCommand flags were confirmed by HotSpot startup logs; full XML, per-fork JSON and logs archived.')
          PY

      - name: Upload raw JMH, JIT XML and CPU environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-users-native-inline-ablation
          path: |
            results/environment.txt
            results/jar.sha256
            results/summary.md
            results/*.json
            results/*.log
            results/xml/*.xml
          retention-days: 14
          if-no-files-found: warn
