name: Experiment / Jackson3 Users incremental write

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-jackson3-users-incremental-write.yml'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/IncrementalUsersModel.java'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/IncrementalUsersWriteBenchmark.java'

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build real annotation-processed Jackson3 binding and JMH jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/generated
          { git rev-parse HEAD; java -version 2>&1; lscpu; } > results/environment.txt
          ./gradlew --no-daemon :sjf4j-testbench:jmhJar
          jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -s "$jar"
          echo "$jar" > results/jar-path.txt
          find sjf4j-testbench/build/generated -name '*IncrementalUsersWriteBenchmark*Compiled_Impl.java' -exec cp {} results/generated/ \;
          find results/generated -type f -name '*.java' | grep -q .
          grep -R -q 'write09' results/generated
          jar tf "$jar" | grep -q 'IncrementalUsersWriteBenchmark'

      - name: Add one field group at a time; stop at first Blackbird win
        shell: bash
        run: |
          set -euo pipefail
          jar=$(cat results/jar-path.txt)
          bench='org.sjf4j.testbench.binding.fabien.IncrementalUsersWriteBenchmark.write'
          echo '| Stage | Seed | Native / Compiled | Blackbird / Compiled | BB winner? |' > results/ratios.md
          echo '| --- | ---: | ---: | ---: | :---: |' >> results/ratios.md
          for stage in 1 2 3 4 5 6 7 8 9; do
            echo "::group::Stage $stage (Users POJO, 1 KB generator input)"
            java -jar "$jar" "$bench" \
              -p stage="$stage" -p implementation=native,blackbird,compiled \
              -p sizeKb=1 -p seed=12345,324 \
              -f 2 -t 1 -wi 3 -i 4 -w 500ms -r 500ms -prof gc -rf json \
              -rff "results/stage-$stage.json" > "results/stage-$stage.log" 2>&1 || {
                tail -100 "results/stage-$stage.log"; exit 1;
              }
            STAGE="$stage" python3 - <<'PY'
          import json, os
          from pathlib import Path
          stage=int(os.environ['STAGE'])
          rows=json.loads(Path(f'results/stage-{stage}.json').read_text())
          stop=False
          for seed in ('12345','324'):
              scored={r['params']['implementation']:r['primaryMetric']['score'] for r in rows
                      if r['params']['seed']==seed and r['params']['stage']==str(stage)}
              if set(scored)!=set(('native','blackbird','compiled')):
                  raise SystemExit(f'Missing measurements stage={stage} seed={seed}: {scored}')
              native=scored['native']/scored['compiled']
              bb=scored['blackbird']/scored['compiled']
              # Greater than 3% BB lead in either seed: stop expansion and verify.
              win=bb < .97
              stop|=win
              with Path('results/ratios.md').open('a') as f:
                  f.write(f'| {stage:02} | {seed} | {native:.3f}x | {bb:.3f}x | {"YES" if win else "no"} |\n')
              print(f'stage={stage} seed={seed} native/compiled={native:.3f} '
                    f'blackbird/compiled={bb:.3f} stop={win}')
          Path('results/stop').write_text(str(stage) if stop else '')
          PY
            echo "::endgroup::"
            if [[ -s results/stop ]]; then
              echo "Stopping at first observed >3% Blackbird lead: stage $stage"
              java -jar "$jar" "$bench" \
                -p stage="$stage" -p implementation=native,blackbird,compiled \
                -p sizeKb=1 -p seed=12345,324 \
                -f 3 -t 1 -wi 4 -i 5 -w 500ms -r 500ms -prof gc -rf json \
                -rff "results/confirm-stage-$stage.json" > "results/confirm-stage-$stage.log" 2>&1 || {
                  tail -100 "results/confirm-stage-$stage.log"; exit 1;
                }
              # Diagnostic only, never use JIT-logged data as performance evidence.
              java -jar "$jar" "$bench" \
                -p stage="$stage" -p implementation=compiled \
                -p sizeKb=1 -p seed=12345 \
                -f 1 -wi 3 -i 1 -w 400ms -r 400ms \
                -jvmArgsAppend '-XX:+UnlockDiagnosticVMOptions -XX:+PrintCompilation -XX:+PrintInlining' \
                > results/compiled-jit.log 2>&1 || true
              break
            fi
          done

      - name: Full original Users control (independent from staged models)
        shell: bash
        run: |
          set -euo pipefail
          jar=$(cat results/jar-path.txt)
          java -jar "$jar" 'org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write' \
            -p backend=jackson3 -p model=users -p shape=pojo \
            -p implementation=native,blackbird,compiled \
            -p sizeKb=1,10,100 -p seed=12345,324 \
            -f 2 -t 1 -wi 3 -i 4 -w 500ms -r 500ms -prof gc -rf json \
            -rff results/original-users.json > results/original-users.log 2>&1 || {
              tail -100 results/original-users.log; exit 1;
            }

      - name: Summarize ratios and first regression
        if: always()
        shell: bash
        run: |
          {
            echo '## Jackson3 Users POJO Write: incremental model isolation'
            echo
            if [[ -f results/ratios.md ]]; then cat results/ratios.md; fi
            echo
            if [[ -s results/stop ]]; then
              echo "First >3% Blackbird lead at **stage $(cat results/stop)**."
              echo 'The confirmation JSON, generated APT code and JIT log are archived; downstream stages were not benchmarked.'
            else
              echo 'No >3% Blackbird lead found in staged 1KB models, subject to repeatability.'
            fi
            echo
            python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('results').glob('confirm-stage-*.json')) + [Path('results/original-users.json')]:
              if not path.exists(): continue
              rows=json.loads(path.read_text())
              print('### '+path.stem)
              print('| Size KB | Seed | Native / Compiled | Blackbird / Compiled |')
              print('| ---: | ---: | ---: | ---: |')
              keys=sorted(set((r['params']['sizeKb'],r['params']['seed']) for r in rows),
                          key=lambda x:(int(x[0]),x[1]))
              for size,seed in keys:
                  scored={r['params']['implementation']:r['primaryMetric']['score'] for r in rows
                          if r['params']['sizeKb']==size and r['params']['seed']==seed}
                  if len(scored)!=3: raise SystemExit(f'Missing original/confirmation implementation: {scored}')
                  print(f"| {size} | {seed} | {scored['native']/scored['compiled']:.3f}x | {scored['blackbird']/scored['compiled']:.3f}x |")
              print()
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive raw JMH, source, GC and JIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-users-incremental-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
