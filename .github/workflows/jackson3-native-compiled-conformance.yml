name: Jackson3 Native Compiled Conformance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/jackson3-native-compiled-conformance.yml'
      - 'sjf4j-testbench/build.gradle.kts'
      - 'sjf4j-testbench/src/test/java/org/sjf4j/testbench/binding/CompiledJackson3NameMatchTest.java'
      - 'sjf4j-testbench/src/test/java/org/sjf4j/testbench/binding/CompiledJackson3NativeScalarsTest.java'
      - 'sjf4j-processor/src/main/java/org/sjf4j/processor/binding/**'
      - 'sjf4j-processor/src/main/java/org/sjf4j/processor/CodegenProcessor.java'
      - 'sjf4j-backend-jackson3/src/main/java/org/sjf4j/backend/jackson3/binding/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify generated native/non-native Jackson3 binders
        shell: bash
        run: |
          set -euo pipefail
          for native in false true; do
            echo "=== Conformance nativePojo=$native ==="
            ./gradlew :sjf4j-testbench:test \
              --tests 'org.sjf4j.testbench.binding.CompiledJackson3NameMatchTest' \
              --tests 'org.sjf4j.testbench.binding.CompiledJackson3NativeScalarsTest' \
              "-Psjf4jJackson3NativePojo=$native" --no-daemon

            GENERATED="$(find sjf4j-testbench/build/generated -type f \
              -name 'CompiledJackson3NameMatchTest$Reader_Impl.java' -print -quit)"
            test -n "$GENERATED" && test -s "$GENERATED" || {
              echo "Generated JUnit binder not found" >&2
              exit 1
            }
            if [[ "$native" == true ]]; then
              grep -qF 'nextNameMatchAndToken(' "$GENERATED" || {
                echo "Native generated binder has no fused matcher" >&2
                exit 1
              }
              grep -Eq 'Native\([[:alnum:]_]+\.nativeParser\(\)\)' "$GENERATED" || {
                echo "Native generated binder never calls a native helper" >&2
                exit 1
              }
            elif grep -qF 'nextNameMatchAndToken(' "$GENERATED"; then
              echo "Native generated path unexpectedly enabled" >&2
              exit 1
            fi
            SCALARS="$(find sjf4j-testbench/build/generated -type f \
              -name 'CompiledJackson3NativeScalarsTest$Reader_Impl.java' -print -quit)"
            test -n "$SCALARS" && test -s "$SCALARS" || {
              echo "Native scalar test binder generated source not found" >&2
              exit 1
            }
            if [[ "$native" == true ]]; then
              grep -qF 'nextNameMatchAndToken(' "$SCALARS"
              grep -qF 'getDecimalValue()' "$SCALARS"
              grep -qF 'getBigIntegerValue()' "$SCALARS"
              grep -qF 'Numbers.toByte(parser.getNumberValue())' "$SCALARS"
              grep -qF 'readCharValue(parser)' "$SCALARS"
              grep -qF 'Enum.valueOf(' "$SCALARS"
            elif grep -qF 'nextNameMatchAndToken(' "$SCALARS"; then
              echo "Native scalars unexpectedly enabled in wrapper mode" >&2
              exit 1
            fi
            python3 - "$GENERATED" "$native" <<'PY'
          import sys
          from pathlib import Path
          src=Path(sys.argv[1]).read_text()
          native=sys.argv[2] == "true"
          for method in ("fromUtf8","fromString","fromReader","fromInputStream"):
              begin=src.find(" " + method + "(")
              end=src.find("catch (BindingException",begin) if begin>=0 else -1
              if begin<0 or end<0:
                  raise SystemExit("Generated method not found: " + method)
              selected="Native(parser.nativeParser()" in src[begin:end]
              wanted=native and method in ("fromUtf8","fromInputStream")
              if selected!=wanted:
                  raise SystemExit(f"{method}: native={selected} expected={wanted}")
          PY
          done
