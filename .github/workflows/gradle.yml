# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # The build lifecycle itself is offline. CI explicitly seeds the official
    # suite once so that JaCoCo still includes runtime conformance coverage.
    - name: Download official JSON Schema suite for CI
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: ./gradlew :sjf4j-testbench:downloadOfficialSchemaTests

    # build -> check includes all official suites and the JaCoCo coverage gate.
    - name: Build and verify coverage
      run: ./gradlew build

    # Standard Gradle 'build' does not compile src/jmh/java.
    # Compile the benchmark jar to catch JMH and compiled binder generation errors.
    - name: Compile JMH benchmarks
      run: ./gradlew :sjf4j-testbench:jmhJar

    # This is a correctness smoke, not performance data: GitHub runners are
    # noisy. Cover both read/write of SnakeYAML native Users/Clients POJO/Map.
    - name: Smoke-check native YAML binding
      run: |
        JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
        test -n "$JAR"
        java -jar "$JAR" \
          'org.sjf4j.testbench.binding.fabien.Fabien(ReadBenchmark.read|WriteBenchmark.write)' \
          -p backend=snake -p implementation=native \
          -p model=users,clients -p shape=pojo,map -p sizeKb=10 -p seed=12345 \
          -f 0 -wi 0 -i 1 -r 100ms -t 1 -rf json -rff /tmp/fabien-yaml-smoke.json
        python3 - <<'PY'
        import json
        with open('/tmp/fabien-yaml-smoke.json') as f:
            scores = json.load(f)
        assert len(scores) == 8, f"Expected 8 YAML native JMH results, got {len(scores)}"
        PY

    # Verify the largest fixture at both seeds for *every* backend, including
    # native/blackbird. This is not a timing baseline (-f 0, short measurement).
    # It catches precision loss in Map binding (e.g. Gson's default Double).
    - name: Smoke-check 100KB binding across all backends
      run: |
        set -euo pipefail
        JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
        test -n "$JAR"
        for backend in jackson2 jackson3 fastjson2 gson jsonp simple snake; do
          case "$backend" in
            jackson2|jackson3) modes=runtime,compiled,native,blackbird ;;
            fastjson2|gson|snake) modes=runtime,compiled,native ;;
            jsonp|simple) modes=runtime,compiled ;;
          esac
          report="/tmp/fabien-100kb-$backend.json"
          log="/tmp/fabien-100kb-$backend.log"
          if ! java -jar "$JAR" \
              'org.sjf4j.testbench.binding.fabien.Fabien(ReadBenchmark.read|WriteBenchmark.write)' \
              -p "backend=$backend" -p "implementation=$modes" \
              -p model=clients -p shape=pojo,map -p sizeKb=100 -p seed=12345,324 \
              -f 0 -wi 0 -i 1 -r 50ms -t 1 -rf json -rff "$report" >"$log" 2>&1; then
            tail -100 "$log"
            exit 1
          fi
          expected=$(( $(echo "$modes" | tr -cd ',' | wc -c) + 1 ))
          expected=$(( expected * 2 * 2 * 2 ))
          if ! python3 - "$report" "$expected" <<'PY'
        import json, sys
        with open(sys.argv[1]) as f:
            rows = json.load(f)
        if len(rows) != int(sys.argv[2]):
            print(f"Incomplete JMH smoke: {len(rows)} results vs expected {sys.argv[2]}")
            sys.exit(1)
        PY
          then
            tail -100 "$log"
            exit 1
          fi
          echo "100KB $backend: $expected cases passed"
        done

    - name: Print JaCoCo summary
      if: ${{ always() }}
      run: |
        python3 - <<'PY'
        import os
        import xml.etree.ElementTree as ET
        path = 'sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml'
        if not os.path.exists(path):
            print(f'JaCoCo report not found: {path}')
            raise SystemExit(0)
        root = ET.parse(path).getroot()
        for counter in root.findall('counter'):
            if counter.attrib['type'] in ('BRANCH', 'LINE', 'INSTRUCTION', 'METHOD'):
                missed = int(counter.attrib['missed'])
                covered = int(counter.attrib['covered'])
                total = missed + covered
                pct = (covered / total * 100.0) if total else 100.0
                print(f"{counter.attrib['type']}: {covered}/{total} {pct:.2f}%")
        PY

    - name: Upload coverage to Codecov
      if: ${{ always() && hashFiles('sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml') != '' && env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ env.CODECOV_TOKEN }}
        files: sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml
        fail_ci_if_error: true

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

  uuid-write-compare:
    name: Jackson2 UUIDSerializer vs FastUuid JMH
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'bench/jackson2-uuid-write-20261117' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build benchmark JAR
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Benchmark A/B/B/A with GC profiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/performance/uuid-write
          {
            echo "Runner: $RUNNER_NAME; OS: $RUNNER_OS; arch: $RUNNER_ARCH"
            lscpu
            java -version 2>&1
          } > build/performance/uuid-write/runner.txt
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
          test -n "$JAR"
          run() {
            local method="$1"
            local tag="$2"
            java -jar "$JAR" \
              "org.sjf4j.testbench.binding.uuid.Jackson2UuidWriteBenchmark.$method" \
              -p count=1,64,512 -t 1 -f 3 \
              -wi 4 -i 4 -w 500ms -r 1s \
              -prof gc -rf json \
              -rff "build/performance/uuid-write/$tag.json" \
              2>&1 | tee "build/performance/uuid-write/$tag.log"
          }
          run jacksonSerializer S1
          run fastUuid F1
          run fastUuid F2
          run jacksonSerializer S2

      - name: Summarize UUID JMH results
        shell: bash
        run: |
          python3 - <<'PY' | tee build/performance/uuid-write/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          from statistics import mean
          directory = Path('build/performance/uuid-write')
          data = {tag: {int(row['params']['count']): row for row in json.loads((directory / (tag + '.json')).read_text())}
                  for tag in ('S1', 'F1', 'F2', 'S2')}
          for tag, rows in data.items():
              assert set(rows) == {1,64,512}, f'Incomplete results for {tag}: {rows.keys()}'
          print('## Jackson2 UUIDSerializer vs FastUuid')
          print('JDK 25; same runner; 3 forks per case; 4×500ms warmup; 4×1s measurement; -prof gc.')
          print('A/B/B/A execution; averages of two JMH 3-fork scores.')
          print('Positive speedup = UUIDSerializer faster.')
          print()
          print('| UUIDs/op | UUIDSerializer µs/op | FastUuid µs/op | Serializer speedup | Serializer B/op | FastUuid B/op |')
          print('| ---: | ---: | ---: | ---: | ---: | ---: |')
          for count in (1, 64, 512):
              s = mean(data[t][count]['primaryMetric']['score'] for t in ('S1', 'S2'))
              f = mean(data[t][count]['primaryMetric']['score'] for t in ('F1', 'F2'))
              def alloc(t):
                  return data[t][count].get('secondaryMetrics', {}).get('gc.alloc.rate.norm', {}).get('score', float('nan'))
              print(f'| {count} | {s:.3f} | {f:.3f} | {(f/s-1)*100:+.1f}% | '
                    f'{mean(alloc(t) for t in ("S1", "S2")):.0f} | {mean(alloc(t) for t in ("F1", "F2")):.0f} |')
          PY
      - name: Upload raw JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson2-uuid-write-${{ github.run_id }}
          path: build/performance/uuid-write/
          retention-days: 30
          if-no-files-found: warn
