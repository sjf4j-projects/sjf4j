# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Run tests with coverage
      run: ./gradlew :sjf4j-processor:test :sjf4j-testbench:jacocoTestReport :sjf4j-testbench:jacocoTestCoverageVerification

    # Temporary same-runner A/B. Restore workflow after JMH.
    - name: Compare three-value specialization against previous parser loops
      run: |
        set -e
        git fetch --no-tags --depth=1 origin bbc0b112bc095cf6440b976d8e0a3149392f681b
        for path in \
          sjf4j-backend-jackson2/src/main/java/org/sjf4j/backend/jackson2/binding/Jackson2Parser.java \
          sjf4j-backend-jackson3/src/main/java/org/sjf4j/backend/jackson3/binding/Jackson3Parser.java \
          sjf4j-backend-gson/src/main/java/org/sjf4j/backend/gson/binding/GsonParser.java \
          sjf4j-backend-jsonp/src/main/java/org/sjf4j/backend/jsonp/binding/JsonpParser.java \
          sjf4j-core/src/main/java/org/sjf4j/binding/simple/SimpleJsonParser.java
        do
          cp "$path" "/tmp/$(basename "$path").$(echo "$path" | cut -d/ -f1)"
          git show "bbc0b112bc095cf6440b976d8e0a3149392f681b:$path" > "$path"
        done
        ./gradlew :sjf4j-testbench:jmhJar --no-daemon --rerun-tasks
        JMH_JAR=$(find sjf4j-testbench/build/libs -type f -iname '*jmh*.jar' | head -n 1)
        java -jar "$JMH_JAR" 'JacksonRawSizeBenchmark\.jackson[23]_(map|list)_string_(native|compiled|runtime)$' -p count=3,4,32 -f 2 -wi 8 -i 4 -w 100ms -r 100ms -t 1 -prof gc -rf json -rff /tmp/jackson-old.json
        java -jar "$JMH_JAR" 'OtherRawSizeBenchmark\.(gson|jsonp|simple)_(map|list)_(native|compiled|runtime)$' -p count=3,4,32 -f 2 -wi 8 -i 4 -w 100ms -r 100ms -t 1 -prof gc -rf json -rff /tmp/other-old.json
        for path in \
          sjf4j-backend-jackson2/src/main/java/org/sjf4j/backend/jackson2/binding/Jackson2Parser.java \
          sjf4j-backend-jackson3/src/main/java/org/sjf4j/backend/jackson3/binding/Jackson3Parser.java \
          sjf4j-backend-gson/src/main/java/org/sjf4j/backend/gson/binding/GsonParser.java \
          sjf4j-backend-jsonp/src/main/java/org/sjf4j/backend/jsonp/binding/JsonpParser.java \
          sjf4j-core/src/main/java/org/sjf4j/binding/simple/SimpleJsonParser.java
        do
          cp "/tmp/$(basename "$path").$(echo "$path" | cut -d/ -f1)" "$path"
        done
        ./gradlew :sjf4j-testbench:jmhJar --no-daemon --rerun-tasks
        JMH_JAR=$(find sjf4j-testbench/build/libs -type f -iname '*jmh*.jar' | head -n 1)
        java -jar "$JMH_JAR" 'JacksonRawSizeBenchmark\.jackson[23]_(map|list)_string_(native|compiled|runtime)$' -p count=3,4,32 -f 2 -wi 8 -i 4 -w 100ms -r 100ms -t 1 -prof gc -rf json -rff /tmp/jackson-new.json
        java -jar "$JMH_JAR" 'OtherRawSizeBenchmark\.(gson|jsonp|simple)_(map|list)_(native|compiled|runtime)$' -p count=3,4,32 -f 2 -wi 8 -i 4 -w 100ms -r 100ms -t 1 -prof gc -rf json -rff /tmp/other-new.json
        python3 - <<'PY'
        import json
        print('BEGIN THREE VALUE A/B')
        for group in ('jackson','other'):
            old=json.load(open('/tmp/'+group+'-old.json'))
            new=json.load(open('/tmp/'+group+'-new.json'))
            for prev in old:
                name=prev['benchmark'].split('.')[-1]
                if not name.endswith(('_compiled','_runtime')):
                    continue
                curr=next(v for v in new if v['benchmark']==prev['benchmark'] and v['params']==prev['params'])
                v0=prev['primaryMetric']['score']
                v1=curr['primaryMetric']['score']
                b0=prev['secondaryMetrics']['gc.alloc.rate.norm']['score']
                b1=curr['secondaryMetrics']['gc.alloc.rate.norm']['score']
                size=prev['params'].get('count')
                print(f"{group} {name} size={size}: old={v0:.2f} new={v1:.2f} change={(v1/v0-1)*100:.1f}% B/op={b0:.1f}->{b1:.1f}")
        print('END THREE VALUE A/B')
        PY

    - name: Print JaCoCo summary
      if: ${{ always() }}
      run: |
        python3 - <<'PY'
        import os
        import xml.etree.ElementTree as ET
        path = 'sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml'
        if not os.path.exists(path):
            print(f'JaCoCo report not found: {path}')
            raise SystemExit(0)
        root = ET.parse(path).getroot()
        for counter in root.findall('counter'):
            if counter.attrib['type'] in ('BRANCH', 'LINE', 'INSTRUCTION', 'METHOD'):
                missed = int(counter.attrib['missed'])
                covered = int(counter.attrib['covered'])
                total = missed + covered
                pct = (covered / total * 100.0) if total else 100.0
                print(f"{counter.attrib['type']}: {covered}/{total} {pct:.2f}%")
        PY

    - name: Upload coverage to Codecov
      if: ${{ always() && hashFiles('sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml') != '' && env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ env.CODECOV_TOKEN }}
        files: sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml
        fail_ci_if_error: true

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
