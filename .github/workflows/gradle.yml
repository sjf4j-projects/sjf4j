name: Java CI with Gradle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The official schema suite is downloaded explicitly, never during a normal build.
      - name: Download official JSON Schema tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :sjf4j-testbench:downloadOfficialSchemaTests

      - name: Build, test and compile JMH
        run: ./gradlew build :sjf4j-testbench:jmhJar

      - name: Binding correctness smoke
        run: bash scripts/ci-binding-smoke.sh

      - name: Upload coverage
        if: ${{ always() && hashFiles('sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml') != '' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
