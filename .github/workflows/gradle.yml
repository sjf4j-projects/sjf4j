# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Run tests with coverage
      run: ./gradlew :sjf4j-processor:test :sjf4j-testbench:jacocoTestReport :sjf4j-testbench:jacocoTestCoverageVerification

    # Temporary Fastjson2 two-value A/B; restore workflow after measurement.
    - name: Compare Fastjson2 generic and two-value raw parser
      run: |
        git fetch --no-tags --depth=1 origin be9833a6a9dfc80e6a40f071d1a1bb668066dafe
        cp sjf4j-backend-fastjson2/src/main/java/org/sjf4j/backend/fastjson2/binding/Fastjson2Parser.java /tmp/current-fastjson2.java
        git show be9833a6a9dfc80e6a40f071d1a1bb668066dafe:sjf4j-backend-fastjson2/src/main/java/org/sjf4j/backend/fastjson2/binding/Fastjson2Parser.java > sjf4j-backend-fastjson2/src/main/java/org/sjf4j/backend/fastjson2/binding/Fastjson2Parser.java
        ./gradlew :sjf4j-testbench:jmhJar --no-daemon --rerun-tasks
        JMH_JAR=$(find sjf4j-testbench/build/libs -type f -iname '*jmh*.jar' | head -n 1)
        java -jar "$JMH_JAR" 'Fastjson2RawAllocationBenchmark\.(map|list)(Native|Compiled|Runtime)String$' -p shape=two,five,six,wide -f 2 -wi 8 -i 4 -w 100ms -r 100ms -t 1 -prof gc -rf json -rff /tmp/fastjson-generic.json
        cp /tmp/current-fastjson2.java sjf4j-backend-fastjson2/src/main/java/org/sjf4j/backend/fastjson2/binding/Fastjson2Parser.java
        ./gradlew :sjf4j-testbench:jmhJar --no-daemon --rerun-tasks
        JMH_JAR=$(find sjf4j-testbench/build/libs -type f -iname '*jmh*.jar' | head -n 1)
        java -jar "$JMH_JAR" 'Fastjson2RawAllocationBenchmark\.(map|list)(Native|Compiled|Runtime)String$' -p shape=two,five,six,wide -f 2 -wi 8 -i 4 -w 100ms -r 100ms -t 1 -prof gc -rf json -rff /tmp/fastjson-two.json
        python3 - <<'PY'
        import json
        a = json.load(open('/tmp/fastjson-generic.json'))
        b = json.load(open('/tmp/fastjson-two.json'))
        print("BEGIN FASTJSON TWO A/B")
        for shape in ("two", "five", "six", "wide"):
            for kind in ("map", "list"):
                for mode in ("Native", "Compiled", "Runtime"):
                    method = kind + mode + "String"
                    before = next(x for x in a if x['params']['shape'] == shape and x['benchmark'].endswith('.' + method))
                    after = next(x for x in b if x['params']['shape'] == shape and x['benchmark'].endswith('.' + method))
                    x,y = before['primaryMetric']['score'],after['primaryMetric']['score']
                    bx = before['secondaryMetrics']['gc.alloc.rate.norm']['score']
                    by = after['secondaryMetrics']['gc.alloc.rate.norm']['score']
                    print(f"{shape} {kind} {mode}: generic {x:.4f} us/op, two {y:.4f} us/op, B/op {bx:.1f}->{by:.1f}")
        print("END FASTJSON TWO A/B")
        PY

    - name: Print JaCoCo summary
      if: ${{ always() }}
      run: |
        python3 - <<'PY'
        import os
        import xml.etree.ElementTree as ET
        path = 'sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml'
        if not os.path.exists(path):
            print(f'JaCoCo report not found: {path}')
            raise SystemExit(0)
        root = ET.parse(path).getroot()
        for counter in root.findall('counter'):
            if counter.attrib['type'] in ('BRANCH', 'LINE', 'INSTRUCTION', 'METHOD'):
                missed = int(counter.attrib['missed'])
                covered = int(counter.attrib['covered'])
                total = missed + covered
                pct = (covered / total * 100.0) if total else 100.0
                print(f"{counter.attrib['type']}: {covered}/{total} {pct:.2f}%")
        PY

    - name: Upload coverage to Codecov
      if: ${{ always() && hashFiles('sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml') != '' && env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ env.CODECOV_TOKEN }}
        files: sjf4j-testbench/build/reports/jacoco/test/jacocoTestReport.xml
        fail_ci_if_error: true

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
