name: Jackson2 name-hint A/B
on:
  push:
    branches:
      - perf/compiled-jackson-pojo-read
  workflow_dispatch:

jobs:
  jackson2-hint-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compare expected-name hint on same runner
        shell: bash
        run: |
          set -euo pipefail
          for variant in hinted unhinted; do
            if [[ "$variant" == hinted ]]; then
              git checkout --detach 378a925e214c47723d18b1ad9bfc924e2aa703cd
            else
              git checkout --detach fb60403ee2417834b421515059811e2b7631c3d0
            fi
            ./gradlew :sjf4j-testbench:clean :sjf4j-testbench:jmhJar --no-daemon --rerun-tasks
            java -jar sjf4j-testbench/build/libs/*-jmh.jar \
              '.*CompiledReadBenchmark.jackson2_pojo_(reversed_)?(string|utf8)_compiled' \
              -wi 5 -i 10 -w 500ms -r 500ms -f 2 -prof gc \
              -rf json -rff "jackson2-$variant.json" | tee "jackson2-$variant.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson2-name-hint-ab
          path: |
            jackson2-hinted.json
            jackson2-hinted.log
            jackson2-unhinted.json
            jackson2-unhinted.log
          if-no-files-found: ignore
