name: Jackson2 Users Compiled vs Blackbird Same Runner
on:
  push:
    branches:
      - experiment/jackson2-users-blackbird-same-run-20261101
  workflow_dispatch:

jobs:
  users-abba:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BASE_SHA: 3fd9cdd3f48b4640baf8bd024e38e02768c51380
      VARIANT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record hardware
        run: |
          mkdir -p diagnostics
          java -version 2> diagnostics/java-version.txt
          lscpu > diagnostics/lscpu.txt
      - name: Build and measure A1 (original matcher)
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          ./gradlew :sjf4j-processor:clean :sjf4j-testbench:clean :sjf4j-testbench:jmhJar --no-daemon
          SRC="$(find sjf4j-testbench/build/generated -name '*FabienReadBenchmark*FabienCompiled_Impl.java' -print -quit)"
          test -n "$SRC"
          grep -Fq '.matchNext(nativeParser, expectedNameIndex)' "$SRC"
          cp "$SRC" diagnostics/original-generated.java
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          java -jar "$JAR" '.*FabienReadBenchmark\.users_jackson2_(compiled|blackbird)$' \
            -p sizeKb=1,5,10 -p seed=12,3285,5678 \
            -f 3 -t 1 -wi 6 -i 7 -w 250ms -r 250ms \
            -prof gc -rf json -rff A1.json 2>&1 | tee A1.log
      - name: Build B and verify JOJO correctness
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$VARIANT_SHA"
          ./gradlew :sjf4j-processor:clean :sjf4j-testbench:clean :sjf4j-testbench:jmhJar --no-daemon
          SRC="$(find sjf4j-testbench/build/generated -name '*FabienReadBenchmark*FabienCompiled_Impl.java' -print -quit)"
          test -n "$SRC"
          grep -Fq '.serializedName(expectedNameIndex)' "$SRC"
          grep -Fq '.nextFallbackName(nativeParser' "$SRC"
          cp "$SRC" diagnostics/inline-generated.java
          ./gradlew :sjf4j-testbench:test :sjf4j-backend-jackson2:test --no-daemon
      - name: Measure B (inline, plus Blackbird)
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          for RUN in B1; do
            java -jar "$JAR" '.*FabienReadBenchmark\.users_jackson2_(compiled|blackbird)$' \
              -p sizeKb=1,5,10 -p seed=12,3285,5678 \
              -f 3 -t 1 -wi 6 -i 7 -w 250ms -r 250ms \
              -prof gc -rf json -rff "$RUN.json" 2>&1 | tee "$RUN.log"
          done
      - name: Compare paired A/B
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from statistics import mean
          def load(name):
              with open(name+'.json') as f: rows=json.load(f)
              return {(int(r['params']['sizeKb']),int(r['params']['seed']),r['benchmark'].rsplit('.',1)[-1]):r for r in rows}
          a,b=load('A1'),load('B1')
          print('size seed baseline_us inline_us blackbird_A_us blackbird_B_us inline_vs_baseline_% inline_vs_blackbird_% baseline_vs_blackbird_%')
          for size,seed in sorted({(k[0],k[1]) for k in a}):
              get=lambda d,name:d[(size,seed,'users_jackson2_'+name)]['primaryMetric']['score']
              ac,bc=get(a,'compiled'),get(b,'compiled')
              ab,bb=get(a,'blackbird'),get(b,'blackbird')
              black=mean((ab,bb))
              print(f'{size:>4} {seed:>5} {ac:>10.3f} {bc:>9.3f} {ab:>14.3f} {bb:>14.3f} {(ac-bc)/ac*100:>20.2f} {(black-bc)/black*100:>21.2f} {(black-ac)/black*100:>23.2f}')
          print('AGGREGATE size baseline_us inline_us blackbird_us inline_vs_blackbird_%')
          for size in (1,5,10):
              keys=sorted({k[1] for k in a if k[0]==size})
              get=lambda d,seed,name:d[(size,seed,'users_jackson2_'+name)]['primaryMetric']['score']
              ac=mean(get(a,seed,'compiled') for seed in keys)
              bc=mean(get(b,seed,'compiled') for seed in keys)
              black=mean((get(a,seed,'blackbird')+get(b,seed,'blackbird'))/2 for seed in keys)
              print(f'{size:>4} {ac:>11.3f} {bc:>9.3f} {black:>12.3f} {(black-bc)/black*100:>22.2f}')
          print('ALLOCATION size seed baseline_B/op inline_B/op blackbird_A_B/op blackbird_B_B/op')
          for size,seed in sorted({(k[0],k[1]) for k in a}):
              alloc=lambda d,name:d[(size,seed,'users_jackson2_'+name)]['secondaryMetrics']['gc.alloc.rate.norm']['score']
              print(f'{size:>4} {seed:>5} {alloc(a,"compiled"):>13.1f} {alloc(b,"compiled"):>11.1f} {alloc(a,"blackbird"):>17.1f} {alloc(b,"blackbird"):>17.1f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson2-users-blackbird-same-run-jdk25
          path: |
            A1.json
            B1.json
                                    A1.log
            B1.log
                                    diagnostics/**
          if-no-files-found: warn
