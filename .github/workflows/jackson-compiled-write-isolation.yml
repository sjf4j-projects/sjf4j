name: Jackson compiled write isolation JMH
on:
  push:
    branches:
      - perf/jackson-compiled-write
  workflow_dispatch:
jobs:
  jackson-write:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile JMH and generated binders
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Isolate property write overhead
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*JacksonPropertyWriteOverheadBenchmark.*' \
            -wi 3 -i 5 -w 300ms -r 500ms -f 1 -prof gc | tee jackson-write-isolation.log
      - name: POJO write end-to-end reference
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledWriteBenchmark.json_jackson[23]_pojo_(string|utf8)_(compiled|native|blackbird)' \
            -wi 3 -i 5 -w 300ms -r 500ms -f 1 -prof gc | tee jackson-write-endtoend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson-write-isolation
          path: |
            jackson-write-isolation.log
            jackson-write-endtoend.log
          if-no-files-found: ignore
