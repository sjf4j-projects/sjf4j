name: Jackson compiled write JIT diagnostics
on:
  push:
    branches: [perf/jackson-write-jit-inlining-diagnostics]
permissions:
  contents: read
jobs:
  jit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Capture JIT inlining decisions
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          java -jar "$jar" '.*CompiledWriteBenchmark\.json_jackson2_pojo_string_(compiled|direct_wrapped)' \
            -bm avgt -tu us -t 1 -f 1 -wi 15 -w 400ms -i 5 -r 400ms \
            -jvmArgs '-XX:+UnlockDiagnosticVMOptions -XX:+PrintCompilation -XX:+PrintInlining' \
            -rf json -rff jit-results.json > jit-full.log 2>&1
          grep -E '(@ [0-9]+.*(_writeUser|_writeStringMember|_writeAddress|_writeList|_writeFriend|Jackson2HandPojoSerializedWriter::(writeUser|str|address|tags|friends))|CompiledWriteBenchmark\\$Jackson2CompiledBinder_Impl|_writeUser \()' jit-full.log | tail -n 150 > jit-interesting.log || true
          tail -n 45 jit-full.log
          echo '== EXCERPT =='
          tail -n 250 jit-interesting.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jit-inlining-diagnostics
          path: |
            jit-full.log
            jit-interesting.log
            jit-results.json
          if-no-files-found: warn
