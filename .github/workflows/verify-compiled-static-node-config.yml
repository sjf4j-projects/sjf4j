name: Compiled NodeConfig A-B verification
on:
  pull_request:
    branches: [refactor/compiled-static-node-config]
    paths: ['.github/workflows/verify-compiled-static-node-config.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: before
            sha: 57ba5bce1e074004fca6f2c933ad658016e90fbd
          - revision: after
            sha: 23ff1dbbea32b9cf51d240c8af61748b51c04988
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :sjf4j-testbench:jmhJar
      - uses: actions/upload-artifact@v4
        with:
          name: jmh-${{ matrix.revision }}
          path: sjf4j-testbench/build/libs/*-jmh.jar
          if-no-files-found: error
          retention-days: 7
  compare:
    name: Same-runner A-B / ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        group: [jackson2, jackson3, fastjson2, gson, jsonp, simple, snake, mapper-pojo, mapper-json, jdbc, schema]
    env:
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: jmh-before
          path: before
      - uses: actions/download-artifact@v8
        with:
          name: jmh-after
          path: after
      - name: Record hardware and run identical selected Full JMH cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { lscpu; java -version 2>&1; } > results/hardware.txt
          params=()
          case "$GROUP" in
            jackson2|jackson3|fastjson2|gson|jsonp|simple|snake)
              selector='^org\.sjf4j\.testbench\.binding\.fabien\.Fabien(ReadBenchmark\.read|WriteBenchmark\.write)$'
              case "$GROUP" in
                jackson2|jackson3) modes=compiled,native,blackbird ;;
                fastjson2|gson|snake) modes=compiled,native ;;
                jsonp|simple) modes=compiled,runtime ;;
              esac
              params=(-p "backend=$GROUP" -p "implementation=$modes" -p model=users -p shape=pojo -p sizeKb=10,100 -p seed=12345,324)
              ;;
            mapper-pojo)
              selector='^org\.sjf4j\.testbench\.mapping\.MappingFullBenchmark\.pojo_(direct|flat|profile|nested|update)_(compiled|mapstruct)$'
              ;;
            mapper-json)
              selector='^org\.sjf4j\.testbench\.mapping\.MappingFullBenchmark\.json_(map|object)_(mapstruct|cast|strict)$'
              ;;
            jdbc)
              selector='^org\.sjf4j\.testbench\.mapping\.JdbcFullBenchmark\.(pojo|record|map)_(row|list)_(compiled|spring)$'
              params=(-p rows=1000)
              ;;
            schema)
              selector='^org\.sjf4j\.testbench\.schema\.CreekSchemaBenchmark\.(pojo_isValid_(runtime|compiled)|map_isValid_(runtime|compiled)|jsonNode_isValid_(runtime|networknt)|roundtrip_(jackson|compiled|isValid_runtime|isValid_compiled))$'
              ;;
            *) exit 1 ;;
          esac
          for revision in before after; do
            jar=$(find "$revision" -name '*-jmh.jar' -print -quit)
            test -n "$jar"
            java -jar "$jar" "$selector" "${params[@]}" -t 1 -f 3 -wi 5 -i 5 -w 1s -r 1s -prof gc -foe true -rf json -rff "results/$revision.json" | tee "results/$revision.log"
          done
      - name: Compare Best 2 ratios
        shell: bash
        run: |
          python3 - <<'PY' > results/comparison.md
          import json
          from statistics import mean
          from pathlib import Path

          def key(row):
              return row['benchmark'].split('.')[-2] + '.' + row['benchmark'].split('.')[-1], tuple(sorted(row.get('params', {}).items()))

          def score(row):
              forks = row['primaryMetric']['rawData']
              assert len(forks) == 3 and all(len(f) == 5 for f in forks), row['benchmark']
              return mean(sorted(mean(f) for f in forks)[:2])

          before = {key(row): score(row) for row in json.loads(Path('results/before.json').read_text())}
          after = {key(row): score(row) for row in json.loads(Path('results/after.json').read_text())}
          assert before and before.keys() == after.keys(), 'Incomplete or mismatched benchmark cases'
          print('Best 2 mean, same runner, baseline / candidate (>1 is faster).')
          print()
          print('| Case | Parameters | Before / After |')
          print('|---|---|---:|')
          for k in sorted(before):
              label, params = k
              print(f"| {label} | {', '.join(f'{a}={b}' for a,b in params)} | {before[k]/after[k]:.3f} |")
          print()
          print('| Binding case | Parameters | Ratio | Before | After |')
          print('|---|---|---|---:|---:|')
          for k in sorted(before):
              label, params = k
              p = dict(params)
              mode = p.get('implementation')
              if mode not in ('blackbird', 'native', 'runtime'):
                  continue
              p['implementation'] = 'compiled'
              other = (label, tuple(sorted(p.items())))
              if other in before:
                  print(f"| {label} | {', '.join(f'{a}={b}' for a,b in params if a != 'implementation')} | {mode}/compiled | {before[k]/before[other]:.3f} | {after[k]/after[other]:.3f} |")
          PY
          cat results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-${{ matrix.group }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
