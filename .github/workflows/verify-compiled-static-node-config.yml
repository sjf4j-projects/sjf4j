name: Compiled NodeConfig targeted A-B-A retest
on:
  pull_request:
    branches: [refactor/compiled-static-node-config]
    paths: ['.github/workflows/verify-compiled-static-node-config.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: before
            sha: 57ba5bce1e074004fca6f2c933ad658016e90fbd
          - revision: after
            sha: 23ff1dbbea32b9cf51d240c8af61748b51c04988
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :sjf4j-testbench:jmhJar
      - uses: actions/upload-artifact@v4
        with:
          name: jmh-${{ matrix.revision }}
          path: sjf4j-testbench/build/libs/*-jmh.jar
          if-no-files-found: error
          retention-days: 7
  compare:
    name: Same-runner A-B-A / ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [jackson2-write, schema-pojo]
    env:
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: jmh-before
          path: before
      - uses: actions/download-artifact@v8
        with:
          name: jmh-after
          path: after
      - name: Run baseline, candidate, baseline on the same runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { lscpu; java -version 2>&1; } | tee results/hardware.txt
          params=()
          case "$GROUP" in
            jackson2-write)
              selector='^org\.sjf4j\.testbench\.binding\.fabien\.FabienWriteBenchmark\.write$'
              params=(-p backend=jackson2 -p implementation=compiled,native,blackbird -p model=users -p shape=pojo -p sizeKb=100 -p seed=12345,324)
              ;;
            schema-pojo)
              selector='^org\.sjf4j\.testbench\.schema\.CreekSchemaBenchmark\.pojo_isValid_(compiled|runtime)$'
              params=(-tu ns)
              ;;
            *) exit 1 ;;
          esac
          for pass in before-1 after before-2; do
            revision=before
            if [[ "$pass" == after ]]; then revision=after; fi
            jar=$(find "$revision" -name '*-jmh.jar' -print -quit)
            test -n "$jar"
            java -jar "$jar" "$selector" "${params[@]}" -t 1 -f 3 -wi 5 -i 5 -w 1s -r 1s -prof gc -foe true -rf json -rff "results/$pass.json" | tee "results/$pass.log"
          done
      - name: Compare Best 2 ratios and individual forks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > results/comparison.md
          import json
          from pathlib import Path
          from statistics import mean

          passes = ('before-1', 'after', 'before-2')
          def load(name):
              rows = json.loads(Path(f'results/{name}.json').read_text())
              result = {}
              for row in rows:
                  key = (row['benchmark'].split('.')[-1], tuple(sorted(row.get('params', {}).items())))
                  metric = row['primaryMetric']
                  assert row['mode'] == 'avgt'
                  data = metric['rawData']
                  assert len(data) == 3 and all(len(f) == 5 for f in data), key
                  forks = [mean(f) for f in data]
                  result[key] = (mean(sorted(forks)[:2]), forks, metric['scoreUnit'],
                                 row['secondaryMetrics']['gc.alloc.rate.norm']['score'])
              assert len(result) == len(rows) and result
              return result

          a, b, a2 = (load(name) for name in passes)
          assert a.keys() == b.keys() == a2.keys()
          print('Same-runner A/B/A, Best 2 fork means; both baseline/candidate ratios >1 indicate improvement.')
          print()
          print('| Case | Parameters | A1 | B | A2 | A1/B | A2/B | A1/A2 | Unit |')
          print('|---|---|---:|---:|---:|---:|---:|---:|---|')
          for key in sorted(a):
              label, params = key
              x, y, z = (r[key][0] for r in (a, b, a2))
              assert a[key][2] == b[key][2] == a2[key][2]
              print(f"| {label} | {', '.join(f'{k}={v}' for k,v in params)} | {x:.6f} | {y:.6f} | {z:.6f} | {x/y:.3f} | {z/y:.3f} | {x/z:.3f} | {a[key][2]} |")
          print()
          print('| Case | Parameters | Competitor / Compiled | A1 | B | A2 |')
          print('|---|---|---|---:|---:|---:|')
          for key in sorted(a):
              label, params = key
              p = dict(params)
              mode = p.get('implementation')
              if mode in ('native', 'blackbird'):
                  p['implementation'] = 'compiled'
                  other = (label, tuple(sorted(p.items())))
                  desc = ', '.join(f'{k}={v}' for k,v in params if k != 'implementation')
              elif label == 'pojo_isValid_runtime':
                  mode = 'runtime'
                  other = ('pojo_isValid_compiled', params)
                  desc = 'POJO'
              else:
                  continue
              ratios = [r[key][0]/r[other][0] for r in (a,b,a2)]
              print(f"| {label} | {desc} | {mode}/compiled | " + ' | '.join(f'{v:.3f}' for v in ratios) + ' |')
          print()
          print('| Case | Parameters | Pass | Fork means | Allocation B/op |')
          print('|---|---|---|---|---:|')
          for key in sorted(a):
              for name, r in zip(passes, (a,b,a2)):
                  print(f"| {key[0]} | {', '.join(f'{k}={v}' for k,v in key[1])} | {name} | " + ', '.join(f'{v:.6f}' for v in r[key][1]) + f' | {r[key][3]:.3f} |')
          PY
          tee -a "$GITHUB_STEP_SUMMARY" < results/comparison.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retest-${{ matrix.group }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
