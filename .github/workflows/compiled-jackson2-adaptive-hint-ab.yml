name: Jackson2 adaptive hint A/B
on:
  push:
    branches:
      - perf/compiled-jackson-pojo-read
  workflow_dispatch:
jobs:
  jackson2-adaptive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: ABBA baseline vs adaptive expected-name hint
        shell: bash
        run: |
          set -euo pipefail
          ADAPTIVE_SHA=4df1a2f6686953ca74ecf51681254bd16335c59b
          BASE_SHA=378a925e214c47723d18b1ad9bfc924e2aa703cd
          round=0
          for variant in baseline adaptive adaptive baseline; do
            round=$((round + 1))
            if [[ "$variant" == baseline ]]; then
              git checkout --detach "$BASE_SHA"
            else
              git checkout --detach "$ADAPTIVE_SHA"
            fi
            ./gradlew :sjf4j-testbench:clean :sjf4j-testbench:jmhJar --no-daemon --rerun-tasks
            java -jar sjf4j-testbench/build/libs/*-jmh.jar \
              '.*CompiledReadBenchmark.jackson2_pojo_(reversed_)?(string|utf8)_compiled' \
              -wi 5 -i 10 -w 500ms -r 500ms -f 2 -prof gc \
              -rf json -rff "jackson2-$variant-$round.json" | tee "jackson2-$variant-$round.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson2-adaptive-ab
          path: |
            jackson2-baseline-*.json
            jackson2-baseline-*.log
            jackson2-adaptive-*.json
            jackson2-adaptive-*.log
          if-no-files-found: ignore
