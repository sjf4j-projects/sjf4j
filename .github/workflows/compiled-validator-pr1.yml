name: CompiledValidator PR1 smoke

on:
  push:
    branches: [ "feat/compiled-validator-pr1-foundation" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile processor and run compiled-validator foundation tests
        run: ./gradlew :sjf4j-processor:compileJava :sjf4j-testbench:test --tests '*CompiledValidatorFoundationTest' --stacktrace
