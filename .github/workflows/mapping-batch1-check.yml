name: Mapping batch 1 test run

on:
  push:
    branches:
      - test/mapstruct-mapping-cases-batch1

permissions:
  contents: read

jobs:
  mapping-tests:
    name: Focused Mapping tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile-time error diagnostics
        id: diagnostics
        continue-on-error: true
        run: ./gradlew :sjf4j-processor:test --tests org.sjf4j.processor.CompiledMapperDiagnosticsTest --stacktrace

      - name: Mapping runtime scenarios
        id: mapping
        continue-on-error: true
        run: |
          ./gradlew :sjf4j-testbench:test \
            --tests org.sjf4j.testbench.processor.mapper.MapperNullSemanticsTest \
            --tests org.sjf4j.testbench.processor.mapper.MapperConversionEdgeTest \
            --tests org.sjf4j.testbench.processor.mapper.MapperNestedGraphTest \
            --tests org.sjf4j.testbench.processor.mapper.MapperUpdateEdgeTest \
            --tests org.sjf4j.testbench.processor.mapper.MapperSourceResolutionTest \
            --stacktrace

      - name: Summarize XML test results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for module in ("sjf4j-processor", "sjf4j-testbench"):
              files = list(Path(module, "build/test-results/test").glob("TEST-*.xml"))
              total = failures = errors = 0
              print(f"=== {module}: {len(files)} XML suites ===")
              for path in files:
                  root = ET.parse(path).getroot()
                  total += int(root.get("tests", 0))
                  failures += int(root.get("failures", 0))
                  errors += int(root.get("errors", 0))
                  for case in root.findall("testcase"):
                      for issue in list(case.findall("failure")) + list(case.findall("error")):
                          print(f"FAILED {case.get('classname')}.{case.get('name')}")
                          print("MESSAGE:", issue.get("message"))
                          print("DETAIL:", (issue.text or "")[:1200])
              print(f"TOTAL {total}, FAILED {failures}, ERRORS {errors}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-batch1-junit
          path: |
            sjf4j-processor/build/test-results/test/
            sjf4j-testbench/build/test-results/test/
            sjf4j-processor/build/reports/tests/test/
            sjf4j-testbench/build/reports/tests/test/
          if-no-files-found: warn

      - name: Fail job if either test step failed
        if: always()
        run: |
          echo "Diagnostics: ${{ steps.diagnostics.outcome }}"
          echo "Runtime: ${{ steps.mapping.outcome }}"
          test "${{ steps.diagnostics.outcome }}" = "success" && test "${{ steps.mapping.outcome }}" = "success"
