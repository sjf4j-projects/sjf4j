name: Fabien Jackson2 Name Match Fastpath A-B
on:
  push:
    branches:
      - experiment/jackson2-name-match-fastpath-20261101
  workflow_dispatch:

jobs:
  ab-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record hardware
        run: |
          mkdir -p diagnostics
          java -version 2> diagnostics/java-version.txt
          lscpu > diagnostics/lscpu.txt
      - name: Build baseline JMH jar
        shell: bash
        run: |
          set -euo pipefail
          PATH_TO_PARSER=sjf4j-backend-jackson2/src/main/java/org/sjf4j/backend/jackson2/binding/Jackson2Parser.java
          git show 64d9df81d41e1cc3273767ba6a3307867d194d78:"$PATH_TO_PARSER" > "$PATH_TO_PARSER"
          ./gradlew :sjf4j-testbench:jmhJar --no-daemon
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          cp "$JAR" baseline-jmh.jar
      - name: Build optimized JMH jar
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- sjf4j-backend-jackson2/src/main/java/org/sjf4j/backend/jackson2/binding/Jackson2Parser.java
          ./gradlew :sjf4j-testbench:jmhJar --no-daemon
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          cp "$JAR" optimized-jmh.jar
      - name: Benchmark both versions on the same runner
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline optimized; do
            echo "Running $variant"
            java -jar "$variant-jmh.jar" \
              '.*FabienReadBenchmark\.(clients_jackson2_(compiled|blackbird_fast_temporal)|users_jackson2_(compiled|blackbird))$' \
              -p sizeKb=10 -p seed=12345,324,43201 \
              -f 2 -t 1 -wi 5 -i 7 -w 250ms -r 250ms \
              -prof gc -rf json -rff "$variant-results.json" \
              2>&1 | tee "$variant-jmh.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabien-jackson2-name-fastpath-ab-jdk25
          path: |
            baseline-results.json
            optimized-results.json
            baseline-jmh.log
            optimized-jmh.log
            diagnostics/**
          if-no-files-found: warn
