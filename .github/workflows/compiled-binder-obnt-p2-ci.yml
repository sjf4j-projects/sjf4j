name: Compiled Binder OBNT P2 Validation
on:
  push:
    branches: [test/compiled-binder-obnt-p2-ci]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and processor tests
        run: ./gradlew :sjf4j-core:test :sjf4j-processor:test --no-daemon
      - name: Failure diagnostics
        if: failure()
        run: grep -R -A 30 '<failure' sjf4j-processor/build/test-results/test/*.xml | head -n 200 || true
