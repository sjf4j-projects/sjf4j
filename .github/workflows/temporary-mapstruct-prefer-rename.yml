name: Temporary CompiledMapper prefer rename verification

on:
  push:
    branches:
      - test/mapstruct-mapping-cases-batch2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and processor mapper tests
        id: processor
        continue-on-error: true
        run: ./gradlew :sjf4j-core:compileJava :sjf4j-processor:test --tests 'org.sjf4j.processor.CompiledMapper*' --stacktrace
      - name: Testbench mapper tests
        id: testbench
        continue-on-error: true
        run: ./gradlew :sjf4j-testbench:test --tests 'org.sjf4j.testbench.processor.mapper.Mapper*' --stacktrace
      - name: JMH compilation
        id: jmh
        continue-on-error: true
        run: ./gradlew :sjf4j-testbench:jmhClasses --stacktrace
      - name: JUnit summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for module in ('sjf4j-processor', 'sjf4j-testbench'):
            n=f=e=0
            for path in glob.glob(module+'/build/test-results/test/TEST-*.xml'):
              root=ET.parse(path).getroot()
              n+=int(root.attrib.get('tests',0)); f+=int(root.attrib.get('failures',0)); e+=int(root.attrib.get('errors',0))
              for case in root.findall('.//testcase'):
                for failure in case.findall('failure')+case.findall('error'):
                  print('FAIL',module,case.attrib.get('name'),(failure.attrib.get('message') or '')[:3000])
            print(module,'TOTAL',n,'FAILED',f,'ERRORS',e)
          PY
      - name: Verify outcomes
        if: always()
        env:
          PROCESSOR: ${{ steps.processor.outcome }}
          TESTBENCH: ${{ steps.testbench.outcome }}
          JMH: ${{ steps.jmh.outcome }}
        run: |
          echo "processor=$PROCESSOR testbench=$TESTBENCH jmh=$JMH"
          test "$PROCESSOR" = success && test "$TESTBENCH" = success && test "$JMH" = success
