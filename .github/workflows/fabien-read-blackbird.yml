name: Fabien Read Blackbird Diagnosis
on:
  push:
    branches:
      - experiment/fabien-blackbird-diagnosis-20261031
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record runner and JDK
        run: |
          mkdir -p diagnostics
          java -version 2> diagnostics/java-version.txt
          uname -a > diagnostics/uname.txt
          lscpu > diagnostics/lscpu.txt
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Capture generated binder source
        shell: bash
        run: |
          mkdir -p diagnostics/generated
          find sjf4j-testbench/build -type f -name '*.java' -print0 |
            while IFS= read -r -d '' file; do
              if grep -qE 'readUsers|readClients' "$file"; then
                cp "$file" diagnostics/generated/
              fi
            done
          find sjf4j-testbench/build/classes/java/jmh -type f -name '*Fabien*' -print             > diagnostics/fabien-classes.txt || true
      - name: List benchmark cases
        run: |
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" -l | tee diagnostics/benchmark-list.txt
      - name: Run paired JMH comparison with allocation profiling
        shell: bash
        run: |
          set -o pipefail
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR"             '.*FabienReadBenchmark\.(users|clients)_jackson2_(native|blackbird|runtime|compiled)|.*FabienReadBenchmark\.clients_jackson2_handwritten.*'             -p sizeKb=1 -p seed=12345             -f 3 -t 1 -wi 7 -i 10 -w 500ms -r 500ms             -prof gc -rf json -rff fabien-results.json             2>&1 | tee fabien-jmh.log
      - name: Capture CPU stack samples
        shell: bash
        run: |
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          set +e
          java -jar "$JAR"             '.*FabienReadBenchmark\.(users|clients)_jackson2_(blackbird|compiled)'             -p sizeKb=1 -p seed=12345             -f 1 -t 1 -wi 5 -i 5 -w 300ms -r 300ms             -prof stack > fabien-stack.log 2>&1
          echo "$?" > diagnostics/stack-profiler-exit-code.txt
          set -e
      - name: Capture JIT inlining decisions
        shell: bash
        run: |
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          set +e
          java -jar "$JAR"             '.*FabienReadBenchmark\.(users|clients)_jackson2_(blackbird|compiled)'             -p sizeKb=1 -p seed=12345             -f 1 -t 1 -wi 4 -i 2 -w 250ms -r 250ms             -jvmArgsAppend '-XX:+UnlockDiagnosticVMOptions -XX:+PrintInlining'             > fabien-inlining.log 2>&1
          echo "$?" > diagnostics/inlining-exit-code.txt
          grep -E 'FabienCompiled|Jackson2Parser|Blackbird|BeanDeserializer|BeanPropertyMap|StringDeserializer|NumberDeserializers|EnumDeserializer|CollectionDeserializer|ObjectArrayDeserializer|FastLocalDate|FastUuid|FastOffsetDateTime'             fabien-inlining.log > fabien-inlining-focus.txt || true
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabien-read-blackbird-diagnosis
          path: |
            fabien-results.json
            fabien-jmh.log
            fabien-stack.log
            fabien-inlining.log
            fabien-inlining-focus.txt
            diagnostics/**
            sjf4j-testbench/build/generated/sources/annotationProcessor/jmh/**
          if-no-files-found: warn
