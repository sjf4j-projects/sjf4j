name: Verify latest Jackson String consolidation
on:
  push:
    branches: [feat/jackson-compiled-string-helper-consolidation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run processor tests and testbench
        run: ./gradlew :sjf4j-processor:test :sjf4j-testbench:test :sjf4j-testbench:jmhJar --no-daemon
