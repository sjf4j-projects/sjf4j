name: LocalTime backend JMH
on:
  pull_request:
    branches: [main]
    paths:
      - 'sjf4j-core/src/main/java/org/sjf4j/util/FastLocalTime.java'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/runtime/LocalTimeBackendBenchmark.java'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Run all backend LocalTime comparisons
        run: |
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" 'org.sjf4j.testbench.binding.runtime.LocalTimeBackendBenchmark.*' -wi 2 -i 3 -f 2 -w 1s -r 1s -prof gc -rf text -rff localtime-results.txt
          cat localtime-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: localtime-jmh-jdk17
          path: localtime-results.txt
