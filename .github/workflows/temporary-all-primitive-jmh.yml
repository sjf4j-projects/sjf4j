name: Temporary All Primitive Array AB JMH

on:
  push:
    branches:
      - perf/nodemapper-primitive-array-fastpath

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Benchmark base and full primitive access
        shell: bash
        run: |
          set -euo pipefail
          BENCHMARK='sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/mapping/NodeMapperConversionBenchmark.java'
          OUT="$RUNNER_TEMP/all-primitive-jmh"
          mkdir -p "$OUT"
          cp "$BENCHMARK" "$OUT/NodeMapperConversionBenchmark.java"
          git worktree add --detach "$OUT/base" c94b77fa105408bd62a9fa04493419324a97e918
          cp "$OUT/NodeMapperConversionBenchmark.java" "$OUT/base/$BENCHMARK"
          PATTERN='org.sjf4j.testbench.mapping.NodeMapperConversionBenchmark.nodeMapper_(javaArrayToTypedList|intArrayToTypedList|boxedLongArrayToTypedList|byteArrayToTypedList|shortArrayToTypedList|floatArrayToTypedList|doubleArrayToTypedList|booleanArrayToTypedList|charArrayToTypedList|listToTypedList)'
          run_bench() {
            local root="$1" label="$2"
            cd "$root"
            ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
            local jar
            jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*jmh.jar' -print -quit)
            test -n "$jar"
            java -jar "$jar" "$PATTERN" -f 1 -t 1 -wi 4 -i 6 -w 200ms -r 300ms -prof gc -rf json -rff "$OUT/$label.json"
          }
          run_bench "$OUT/base" base
          run_bench "$GITHUB_WORKSPACE" candidate
          python3 - <<'PY'
          import os,json
          root=os.environ['RUNNER_TEMP']+'/all-primitive-jmh/'
          datasets={label:json.load(open(root+label+'.json')) for label in ('base','candidate')}
          for label,items in datasets.items():
              if len(items)!=10: raise RuntimeError(f'{label} expected 10 measurements, received {len(items)}')
          results={}
          for label,rows in datasets.items():
              for r in rows:
                  method=r['benchmark'].split('.')[-1]
                  metric=r['primaryMetric']
                  allocation=r.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan'))
                  results.setdefault(method,{})[label]=(metric['score'],metric.get('scoreError',0),allocation)
          print('=== ALL PRIMITIVE ARRAY PAIRED JMH RESULTS ===')
          print(f'{"scenario":38} {"baseline":>10} {"candidate":>10} {"delta %":>9} {"base B/op":>10} {"PR B/op":>10}')
          for method,measure in sorted(results.items()):
              old,old_err,old_b=measure['base']
              new,new_err,new_b=measure['candidate']
              print(f'{method:38} {old:10.2f} {new:10.2f} {(new/old-1)*100:+9.2f} {old_b:10.2f} {new_b:10.2f}')
              print(f'  JMH +/- ns: main={old_err:.2f} new={new_err:.2f}')
          PY
      - name: Preserve measured JMH JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-primitive-array-jmh
          path: ${{ runner.temp }}/all-primitive-jmh/*.json
          if-no-files-found: ignore
