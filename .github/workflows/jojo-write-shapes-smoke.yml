name: Verify JOJO write model shapes (one-off)

on:
  push:
    branches: [fix/record-components-jojo-write-bench-20261010]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Record test and JMH compilation
        run: ./gradlew :sjf4j-testbench:test --tests '*RecordPropertySerializationTest' :sjf4j-testbench:jmhJar --no-daemon
      - name: Verify every JSON output and run all write workloads
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$JAR"
          java -jar "$JAR" '.*JojoWriteBenchmark.*' \
            -f 1 -wi 1 -i 2 -w 100ms -r 100ms \
            -foe true -prof gc -rf json -rff jojo-write-results.json \
            2>&1 | tee jojo-write-output.txt
      - name: Verify 33 result combinations
        run: |
          python3 - <<'PY'
          import json
          with open('jojo-write-results.json') as f:
              records=json.load(f)
          assert len(records)==33, len(records)
          assert {x['params']['workload'] for x in records}=={'static','mixed','dynamic'}
          assert len({x['benchmark'] for x in records})==11
          assert len({(x['benchmark'],x['params']['workload']) for x in records})==33
          print('ALL_33_JOJO_WRITE_SHAPES_VALIDATED')
          for x in sorted(records,key=lambda x:(x['params']['workload'],x['benchmark'])):
              name=x['benchmark'].rsplit('.',1)[-1]
              print('%s,%s,%.4f' %(name,x['params']['workload'],x['primaryMetric']['score']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: true-jojo-write-shapes-smoke
          path: |
            jojo-write-results.json
            jojo-write-output.txt
          if-no-files-found: warn
