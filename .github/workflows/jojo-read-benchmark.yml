name: JOJO read benchmark (one-off)

on:
  push:
    branches: [bench/jojo-read-workloads-20261010]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Compile JMH benchmark
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Run JOJO read benchmark
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$JAR"
          java -jar "$JAR" '.*JojoReadBenchmark.*' \
            -f 1 -wi 3 -i 5 -w 300ms -r 300ms \
            -prof gc -rf json -rff jojo-read-results.json \
            2>&1 | tee jojo-read-output.txt
      - name: Summarize timings
        if: success()
        run: |
          python3 - <<'PY'
          import json
          with open('jojo-read-results.json') as f:
              records = json.load(f)
          print("benchmark,workload,us/op,B/op")
          for r in sorted(records, key=lambda x:(x["params"]["workload"],x["benchmark"])):
              score = r["primaryMetric"]["score"]
              secondary = r.get("secondaryMetrics",{})
              allocation = secondary.get("gc.alloc.rate.norm",{}).get("score",float("nan"))
              print(f'{r["benchmark"].rsplit(".",1)[-1]},{r["params"]["workload"]},{score:.4f},{allocation:.1f}')
          PY
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jojo-read-benchmark-results
          path: |
            jojo-read-results.json
            jojo-read-output.txt
          if-no-files-found: warn
