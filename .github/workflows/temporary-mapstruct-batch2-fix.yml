name: Temporary mapper root reuse and nested method regression

on:
  push:
    branches:
      - test/mapstruct-mapping-cases-batch2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Processor mapping compilation regressions
        id: processor
        continue-on-error: true
        run: ./gradlew :sjf4j-processor:test --tests 'org.sjf4j.processor.CompiledMapper*' --stacktrace
      - name: Testbench mapper regressions
        id: testbench
        continue-on-error: true
        run: ./gradlew :sjf4j-testbench:test --tests 'org.sjf4j.testbench.processor.mapper.Mapper*' --stacktrace
      - name: JMH compilation
        id: jmh
        continue-on-error: true
        run: ./gradlew :sjf4j-testbench:jmhClasses --stacktrace
      - name: Summarize results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for mod in ('sjf4j-processor','sjf4j-testbench'):
            total=failed=errors=0
            for path in glob.glob(mod+'/build/test-results/test/TEST-*.xml'):
              root=ET.parse(path).getroot()
              total+=int(root.attrib.get('tests','0'))
              failed+=int(root.attrib.get('failures','0'))
              errors+=int(root.attrib.get('errors','0'))
              for case in root.findall('.//testcase'):
                for e in case.findall('failure')+case.findall('error'):
                  print('FAIL:',case.attrib.get('classname'),case.attrib.get('name'),(e.attrib.get('message') or '')[:2400])
            print(mod,'TOTAL',total,'FAILED',failed,'ERRORS',errors)
          PY
      - name: Enforce test outcome
        if: always()
        env:
          PROCESSOR: ${{ steps.processor.outcome }}
          TESTBENCH: ${{ steps.testbench.outcome }}
          JMH: ${{ steps.jmh.outcome }}
        run: |
          echo "processor=$PROCESSOR testbench=$TESTBENCH jmh=$JMH"
          test "$PROCESSOR" = success && test "$TESTBENCH" = success && test "$JMH" = success
