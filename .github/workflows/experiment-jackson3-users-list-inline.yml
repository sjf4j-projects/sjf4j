name: Experiment / Jackson3 Users inline list B
on:
  pull_request:
    paths:
      - '.github/workflows/experiment-jackson3-users-list-inline.yml'
      - 'sjf4j-processor/src/main/java/org/sjf4j/processor/binding/StructuralWriteEmitter.java'
      - 'sjf4j-processor/src/main/java/org/sjf4j/processor/binding/JacksonWriteEmitter.java'
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and inspect generated list traversal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/generated
          ./gradlew --no-daemon :sjf4j-testbench:jmhJar
          find sjf4j-testbench/build/generated -name '*IncrementalUsersWriteBenchmark*Compiled_Impl.java' -exec cp {} results/generated/ \;
          grep -R -A 100 'void _writeEntry09' results/generated/ > results/entry09.txt || true
          grep -R -q 'instanceof java.util.RandomAccess' results/generated/
          jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          echo "$jar" > results/jar-path.txt
      - name: Stage09 Users, full Users, two seeds
        shell: bash
        run: |
          set -euo pipefail
          jar=$(cat results/jar-path.txt)
          java -jar "$jar" 'org.sjf4j.testbench.binding.fabien.IncrementalUsersWriteBenchmark.write' -p stage=9 -p implementation=native,blackbird,compiled -p sizeKb=1 -p seed=12345,324 -f 3 -t 1 -wi 4 -i 5 -w 500ms -r 500ms -prof gc -rf json -rff results/stage09.json > results/stage09.log 2>&1 || { tail -100 results/stage09.log; exit 1; }
          java -jar "$jar" 'org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write' -p backend=jackson3 -p model=users -p shape=pojo -p implementation=native,blackbird,compiled -p sizeKb=1,10,100 -p seed=12345,324 -f 2 -t 1 -wi 3 -i 4 -w 500ms -r 500ms -prof gc -rf json -rff results/original-users.json > results/original-users.log 2>&1 || { tail -100 results/original-users.log; exit 1; }
      - name: Summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          for p in (Path('results/stage09.json'),Path('results/original-users.json')):
              if not p.exists(): continue
              print('### '+p.stem)
              rows=json.loads(p.read_text())
              for size,seed in sorted(set((r['params']['sizeKb'],r['params']['seed']) for r in rows),key=lambda x:(int(x[0]),x[1])):
                  s={r['params']['implementation']:r['primaryMetric']['score'] for r in rows if r['params']['sizeKb']==size and r['params']['seed']==seed}
                  print(f"size={size} seed={seed} native/compiled={s['native']/s['compiled']:.3f} blackbird/compiled={s['blackbird']/s['compiled']:.3f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson3-users-list-inline-${{ github.run_id }}
          path: results/
          retention-days: 14
