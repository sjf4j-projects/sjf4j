name: Experiment / Fastjson2 native batch arrays for Clients Write

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-fastjson2-native-arrays.yml'
      - 'sjf4j-processor/src/main/java/org/sjf4j/processor/binding/Fastjson2WriteEmitter.java'

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    name: Fastjson2 Clients POJO Write array-native A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download unchanged Full JMH jar
        uses: actions/download-artifact@v8
        with:
          name: binding-full-jmh-jar
          run-id: 44917024751
          github-token: ${{ github.token }}
          path: baseline-jar
      - name: Build candidate JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Run baseline and candidate on the same machine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { echo 'Baseline JMH source: 501caabe3a197e37498b0854d3dbf98c24ce2790'; echo "Candidate $GITHUB_SHA"; lscpu; java -version 2>&1; } > results/environment.txt
          base=$(find baseline-jar -name '*-jmh.jar' -print -quit)
          candidate=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$base" && test -n "$candidate"
          sha256sum "$base" "$candidate" > results/jars.sha256
          common=( 'org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write' -p backend=fastjson2 -p model=clients -p shape=pojo -p sizeKb=1,10,100 -p seed=12345,324 -t 1 -f 2 -wi 3 -i 3 -w 400ms -r 400ms -prof gc -rf json )
          java -jar "$base" "${common[@]}" -p implementation=native,compiled \
            -rff results/baseline.json 2>&1 | tee results/baseline.log
          java -jar "$candidate" "${common[@]}" -p implementation=compiled \
            -rff results/candidate.json 2>&1 | tee results/candidate.log
      - name: Summarize batch array gains
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          base=json.loads(Path('results/baseline.json').read_text())
          cand=json.loads(Path('results/candidate.json').read_text())
          assert len(base)==12 and len(cand)==6, (len(base), len(cand))
          def metric(rows,size,seed,impl):
              matched=[r for r in rows if r['params']['sizeKb']==size and r['params']['seed']==seed and r['params']['implementation']==impl]
              assert len(matched)==1,(size,seed,impl,len(matched))
              r=matched[0]
              return r['primaryMetric']['score'],r['secondaryMetrics'].get('gc.alloc.rate.norm',{}).get('score',float('nan'))
          print('## Fastjson2 Clients POJO Write: native String[] and long[] batch encoder')
          print()
          print('Same JDK25 runner; original main JMH jar versus candidate; 2 forks; 3x400ms warmup and measurement. Both variants validate JSON value equality in JMH Setup.')
          print('Compiled original uses structural array loops; candidate calls native JSONWriter.writeString(String[]) and writeInt64(long[]) for known non-null array fields.')
          print()
          print('| Size | Seed | Native µs | Original Compiled µs | Batch Compiled µs | Improvement original/batch | Native/Batch | Batch B/op |')
          print('|---|---|---:|---:|---:|---:|---:|---:|')
          for size in ['1','10','100']:
              for seed in ['12345','324']:
                  n,_=metric(base,size,seed,'native')
                  o,_=metric(base,size,seed,'compiled')
                  c,mem=metric(cand,size,seed,'compiled')
                  print(f'| {size}KB | {seed} | {n:.3f} | {o:.3f} | {c:.3f} | {o/c:.3f}x | {n/c:.3f}x | {mem:.0f} |')
          PY
      - name: Upload raw A/B results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-clients-native-arrays-ab
          path: results/
          retention-days: 7
          if-no-files-found: warn
