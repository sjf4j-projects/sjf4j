name: Fastjson2 Read Paired A-B
on:
  push:
    branches:
      - bench/fastjson2-read-ab-20261012
    paths:
      - .github/workflows/quick-fastjson2-read-ab.yml
permissions:
  contents: read

jobs:
  paired-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Check out fixed baseline and candidate commits
        shell: bash
        run: |
          git worktree add --detach /tmp/sjf4j-ab-base 3c6e1b5f31600d2223ab9862cf751aaff9f4880d
          git worktree add --detach /tmp/sjf4j-ab-candidate 8ca7088acb90606c0218a2c78ebc5b8319c29a06
          git -C /tmp/sjf4j-ab-base rev-parse HEAD
          git -C /tmp/sjf4j-ab-candidate rev-parse HEAD
      - name: Build JMH jars for both revisions
        shell: bash
        run: |
          (cd /tmp/sjf4j-ab-base && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
          (cd /tmp/sjf4j-ab-candidate && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
      - name: Paired A-B-B-A JMH (Fastjson2 POJO compiled String and UTF-8)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for spec in base-1 candidate-1 candidate-2 base-2; do
            revision="${spec%-*}"
            jar="/tmp/sjf4j-ab-${revision}/sjf4j-testbench/build/libs"
            echo "::group::JMH ${spec}"
            java -jar "${jar}"/*-jmh.jar \
              '.*CompiledReadBenchmark[.]json_fastjson2_pojo_(string|utf8)_compiled$' \
              -f 1 -wi 5 -w 250ms -i 8 -r 350ms -t 1 \
              -rf json -rff "results/${spec}.json" \
              | tee "results/${spec}.txt"
            echo "::endgroup::"
          done
      - name: Summarize results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('results')
          by_input = {}
          for tag in ['base-1','candidate-1','candidate-2','base-2']:
              rows = json.loads((p / f'{tag}.json').read_text())
              assert len(rows)==2,(tag,len(rows))
              for row in rows:
                  assert row['primaryMetric']['scoreUnit'] == 'us/op'
                  input_type = 'utf8' if '_utf8_' in row['benchmark'] else 'string'
                  by_input.setdefault(input_type,{})[tag] = row['primaryMetric']['score']
          lines=['input,base-1,candidate-1,candidate-2,base-2,baseline_avg,candidate_avg,relative_delta']
          for key, runs in sorted(by_input.items()):
              baseline=(runs['base-1']+runs['base-2'])/2
              candidate=(runs['candidate-1']+runs['candidate-2'])/2
              delta=(candidate/baseline-1)*100
              print(f'{key}: baseline {baseline:.4f}, PR33 {candidate:.4f} us/op, delta {delta:+.2f}%')
              lines.append(f"{key},{runs['base-1']:.6f},{runs['candidate-1']:.6f},{runs['candidate-2']:.6f},{runs['base-2']:.6f},{baseline:.6f},{candidate:.6f},{delta:+.2f}%")
          (p/'summary.csv').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Upload A-B results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-read-paired-ab
          path: results/
          if-no-files-found: ignore
