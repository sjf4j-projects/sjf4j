name: Fastjson2 compiled name performance
on:
  push:
    branches: [perf/compiled-write-consolidated]
    paths:
      - 'sjf4j-processor/**'
      - 'sjf4j-backend-fastjson2/**'
      - '.github/workflows/fastjson-compiled-name-perf.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify generated binders
        run: ./gradlew :sjf4j-processor:test :sjf4j-backend-fastjson2:test --no-daemon
      - name: Prepare baseline worktree
        run: git worktree add --detach ../sjf4j-baseline 3e7278cd5f8ad153f0d2cda2fe3d46011ce463a0
      - name: Build baseline JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
        working-directory: ../sjf4j-baseline
      - name: Benchmark baseline
        shell: bash
        working-directory: ../sjf4j-baseline
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledWriteBenchmark.json_fastjson2_(pojo|map)_(string|utf8)_(compiled|native|runtime)$' \
            -wi 5 -i 8 -w 300ms -r 350ms -f 1 -prof gc | tee "$GITHUB_WORKSPACE/fastjson-before.log"
      - name: Build updated JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Benchmark updated
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledWriteBenchmark.json_fastjson2_(pojo|map)_(string|utf8)_(compiled|native|runtime)$' \
            -wi 5 -i 8 -w 300ms -r 350ms -f 1 -prof gc | tee fastjson-after.log
      - name: Summarize before / after
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib, os
          pat = re.compile(r'^CompiledWriteBenchmark\.(json_fastjson2_(?:pojo|map)_(?:string|utf8)_(?:compiled|native|runtime))\s+avgt\s+\d+\s+([0-9.]+)')
          def read(path):
              result={}
              for line in pathlib.Path(path).read_text().splitlines():
                  m=pat.match(line)
                  if m:result[m.group(1)]=float(m.group(2))
              return result
          before=read("fastjson-before.log");after=read("fastjson-after.log")
          rows=["| Benchmark | Before (µs) | After (µs) | Δ time |",
                "|---|---:|---:|---:|"]
          for key in sorted(set(before)&set(after)):
              old,new=before[key],after[key]
              rows.append(f"| {key} | {old:.3f} | {new:.3f} | {(new/old-1)*100:+.1f}% |")
          text="\n".join(rows)+"\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastjson-compiled-name-before-after
          path: |
            fastjson-before.log
            fastjson-after.log
          if-no-files-found: ignore
