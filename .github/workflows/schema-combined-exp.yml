name: Experiment schema dispatch three-way A/B
on:
  push:
    branches: [experiment/schema-combined-dispatch]
    paths: [.github/workflows/schema-combined-exp.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check correctness and build variants
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/sjf4j-main" 41070c488151baf831ecf53beeb3beea92cad2d5
          git worktree add --detach "$RUNNER_TEMP/sjf4j-pr" 1866f9d87b44647367a3d729df3114b09cf586b0
          sourcepath="sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/schema/CreekSchemaBenchmark.java"
          cp "$GITHUB_WORKSPACE/$sourcepath" "$RUNNER_TEMP/sjf4j-main/$sourcepath"
          for variant in main pr optimized; do
            if [ "$variant" = optimized ]; then root="$GITHUB_WORKSPACE"; else root="$RUNNER_TEMP/sjf4j-$variant"; fi
            echo "Building $variant"
            if [ "$variant" = optimized ]; then
              (cd "$root" && ./gradlew :sjf4j-schema:test :sjf4j-testbench:jmhJar --no-daemon --console=plain)
            else
              (cd "$root" && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
            fi
          done
      - name: Same runner JMH with allocation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          regex='.*CreekSchemaBenchmark\.(schema_validate_map|schema_is_valid_map|schema_is_valid_fail_nested|schema_validate_fail_nested|schema_is_valid_fail_property)'
          for variant in main pr optimized; do
            if [ "$variant" = optimized ]; then root="$GITHUB_WORKSPACE"; else root="$RUNNER_TEMP/sjf4j-$variant"; fi
            jar=$(find "$root/sjf4j-testbench/build/libs" -maxdepth 1 -name '*jmh*.jar' -type f | head -n 1)
            java -jar "$jar" "$regex" -f 2 -wi 15 -i 5 -w 350ms -r 350ms -prof gc \
              -rf json -rff "$GITHUB_WORKSPACE/results/$variant.json" | tee "$GITHUB_WORKSPACE/results/$variant.txt"
          done
          python3 - <<'PY'
          import json
          for variant in ('main','pr','optimized'):
              print('===',variant,'===')
              for row in json.load(open('results/'+variant+'.json')):
                  p=row['primaryMetric']
                  alloc=next((v['score'] for k,v in row['secondaryMetrics'].items() if k.endswith('gc.alloc.rate.norm')),None)
                  print(row['benchmark'].rsplit('.',1)[-1],round(p['score'],5),'+/-',round(p['scoreError'],5),'us/op',round(alloc,2),'B/op')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-combined-jmh
          path: results/
