name: Temporary Fastjson2 Direct Scalar A-B
on:
  push:
    branches:
      - experiment/fastjson2-direct-scalar-read
    paths:
      - .github/workflows/temporary-fastjson2-direct-scalar-ab.yml
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Conformance for B
        shell: bash
        run: |
          ./gradlew :sjf4j-backend-fastjson2:test :sjf4j-processor:test :sjf4j-testbench:test --no-daemon --console=plain && exit 0
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for file in Path('sjf4j-processor/build/test-results/test').glob('TEST-*.xml'):
              for test in ET.parse(file).getroot().findall('.//testcase'):
                  for fail in test.findall('failure') + test.findall('error'):
                      print('FAIL',test.attrib.get('name'),fail.attrib.get('message'),(fail.text or '')[:2500])
          PY
          exit 1
      - name: Build main Matcher, fused A and direct B
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/scalar-main bb344a2f60a76b65165d13a4f07111811834044e
          git worktree add --detach /tmp/scalar-a 4287080a467435cf0746feade87281e99e15a146
          git worktree add --detach /tmp/scalar-b HEAD
          for rev in main a b; do
            (cd /tmp/scalar-$rev && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
          done
      - name: JMH A-B-B-A including native and handwritten
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for tag in a-1 b-1 b-2 a-2; do
            rev="${tag%-*}"
            java -jar /tmp/scalar-${rev}/sjf4j-testbench/build/libs/*-jmh.jar \
              '.*CompiledReadBenchmark[.]fastjson2_pojo_(reversed_)?(string|utf8)_(compiled|native)$|.*HandReadBenchmark[.]json_fastjson2_pojo_handwritten_raw$' \
              -f 1 -wi 4 -w 250ms -i 7 -r 320ms -t 1 \
              -rf json -rff results/${tag}.json | tee results/${tag}.txt
          done
      - name: Run main Matcher reference
        shell: bash
        run: |
          java -jar /tmp/scalar-main/sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledReadBenchmark[.]fastjson2_pojo_(reversed_)?(string|utf8)_compiled$' \
            -f 1 -wi 4 -w 250ms -i 7 -r 320ms -t 1 \
            -rf json -rff results/main.json | tee results/main.txt
      - name: Score summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          samples={}
          for tag in ('a-1','b-1','b-2','a-2','main'):
              for row in json.loads(Path('results',tag+'.json').read_text()):
                  case=row['benchmark'].split('.')[-1]
                  samples.setdefault(case,{})[tag]=row['primaryMetric']['score']
          for case,s in sorted(samples.items()):
              if all(t in s for t in ('a-1','b-1','b-2','a-2')):
                  a=(s['a-1']+s['a-2'])/2
                  b=(s['b-1']+s['b-2'])/2
                  print(f'{case}: P0={a:.6f}, direct={b:.6f}, delta={(b/a-1)*100:+.2f}%, main={s.get("main")}, pairs={s}')
              else:
                  print(case,s)
          PY
      - name: Upload JMH data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-direct-scalar-ab
          path: results/
          if-no-files-found: ignore
