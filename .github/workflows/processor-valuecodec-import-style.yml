name: Processor ValueCodec Import Style
on:
  push:
    branches: [test/processor-valuecodec-import-style-ci]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and processor tests
        run: ./gradlew :sjf4j-core:test :sjf4j-processor:test --no-daemon
      - name: Backend compile smoke
        run: |
          ./gradlew :sjf4j-backend-fastjson2:compileJava \
            :sjf4j-backend-jackson2:compileJava :sjf4j-backend-jackson3:compileJava \
            :sjf4j-backend-gson:compileJava :sjf4j-backend-jsonp:compileJava --no-daemon
      - name: Failure diagnostics
        if: failure()
        run: |
          grep -R -A 35 '<failure' sjf4j-processor/build/test-results/test/*.xml | head -n 200 || true
