name: Creator OneOf JMH (focused)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/creator-oneof-jmh.yml'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/runtime/CreatorOneOfBenchmark.java'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Benchmark Creator OneOf
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*CreatorOneOfBenchmark[.].*' \
            -bm avgt -tu us -t 1 -f 2 -wi 15 -w 400ms -i 5 -r 400ms \
            -rf json -rff creator-oneof-results.json | tee creator-oneof.log
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-oneof-jmh
          path: |
            creator-oneof-results.json
            creator-oneof.log
          if-no-files-found: warn
