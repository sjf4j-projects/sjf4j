name: Fastjson2 URI ValueCodec Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/compiled/Fastjson2CodecReadProbeBenchmark.java'
      - '.github/workflows/fastjson2-compiled-read-probe.yml'
      - 'sjf4j-processor/**'
      - 'sjf4j-core/**'
      - 'sjf4j-backend-fastjson2/**'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon

      - name: Measure URI POJO and scalar dispatch (3 forks)
        run: |
          java -version
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*Fastjson2CodecReadProbeBenchmark.*' \
            -f 3 -wi 4 -i 6 -w 250ms -r 250ms -prof gc \
            -rf json -rff sjf4j-testbench/build/fastjson2-uri-probe.json

      - name: Print URI versus String and codec dispatch
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = 'sjf4j-testbench/build/fastjson2-uri-probe.json'
          if not os.path.isfile(p):
              print('JMH result missing')
              raise SystemExit(0)
          rows = json.load(open(p))
          data = {x['benchmark'].split('.')[-1]: x for x in rows}
          for name, row in sorted(data.items()):
              score = row['primaryMetric']['score']
              error = row['primaryMetric']['scoreError']
              alloc = row['secondaryMetrics'].get('gc.alloc.rate.norm', {}).get('score', float('nan'))
              print(f'{name}: {score:.4f} +/- {error:.4f} us/op; {alloc:.1f} B/op')
          for encoding in ('string', 'utf8'):
              n = data['native_uri_' + encoding]['primaryMetric']['score']
              c = data['compiled_uri_' + encoding]['primaryMetric']['score']
              cr = data['compiled_raw_' + encoding]['primaryMetric']['score']
              nr = data['native_raw_' + encoding]['primaryMetric']['score']
              print(f'{encoding}: URI compiled/native={c/n:.3f}, '
                    f'compiled URI/raw={c/cr:.3f}, native URI/raw={n/nr:.3f}')
          base = data['streaming_io_scalar']['primaryMetric']['score']
          for name in ('value_info_scalar', 'direct_codec_scalar', 'native_scalar'):
              v = data[name]['primaryMetric']['score']
              print(f'scalar {name}/StreamingIO={v/base:.3f}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastjson2-uri-probe
          path: sjf4j-testbench/build/fastjson2-uri-probe.json
          if-no-files-found: ignore
