name: Quick Jackson Blackbird JMH

on:
  push:
    branches:
      - perf/compiled-binder-round2-native-string-output
    paths:
      - .github/workflows/quick-jackson-blackbird-jmh.yml

permissions:
  contents: read

jobs:
  quick-jmh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Build JMH Jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
      - name: Run eight Jackson2 Jackson3 POJO String benchmarks
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledWriteBenchmark[.]json_jackson(2|3)_pojo_string_(compiled|runtime|native|blackbird)$' \
            -f 1 -wi 3 -w 150ms -i 5 -r 250ms -t 1 \
            -rf json -rff quick-jackson-blackbird.json | tee quick-jackson-blackbird.txt
          test "$(grep -c 'CompiledWriteBenchmark.json_jackson' quick-jackson-blackbird.txt)" -ge 8
      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-jackson-blackbird
          path: |
            quick-jackson-blackbird.json
            quick-jackson-blackbird.txt
          if-no-files-found: ignore
