name: Quick Compiled Read JMH

on:
  push:
    branches:
      - bench/compiled-read-pojo-quick-20261012
    paths:
      - .github/workflows/quick-compiled-read-jmh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Build JMH Jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
      - name: Run focused POJO read benchmarks
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledReadBenchmark[.]json_(jackson2|jackson3|fastjson2)_pojo_(string|utf8)_(compiled|runtime|native|blackbird)$' \
            -f 1 -wi 3 -w 150ms -i 5 -r 250ms -t 1 \
            -rf json -rff quick-compiled-read-jmh.json | tee quick-compiled-read-jmh.txt
          test "$(grep -Ec '^CompiledReadBenchmark[.]json_(jackson2|jackson3|fastjson2)_pojo_.*avgt' quick-compiled-read-jmh.txt)" -eq 22
      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-compiled-read-jmh
          path: |
            quick-compiled-read-jmh.json
            quick-compiled-read-jmh.txt
          if-no-files-found: ignore
