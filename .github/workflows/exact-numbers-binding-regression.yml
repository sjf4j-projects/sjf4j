name: Exact Numbers Binding Retest (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/exact-numbers-binding-regression.yml'
      - 'scripts/retest-exact-numbers-binding.py'

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    name: Retest / ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        backend: [jackson2, simple, jsonp, snake]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Reuse exact baseline and current jars from first experiment
        uses: actions/download-artifact@v8
        with:
          name: exact-numbers-jars
          run-id: 45786732782
          github-token: ${{ github.token }}
          path: jars
      - name: Record environment and retest
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          mkdir -p results
          { echo "Original run: 45786732782"; java -version 2>&1; lscpu; free -h; sha256sum jars/*.jar; } > results/runner.txt
          python3 scripts/retest-exact-numbers-binding.py "$BACKEND" jars/baseline.jar jars/current.jar results
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-numbers-retest-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
