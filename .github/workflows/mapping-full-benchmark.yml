name: Mapping Full Benchmark (JDK 25)

on:
  pull_request:
    paths:
      - ".github/workflows/mapping-full-benchmark.yml"
      - "scripts/benchmark-mapping.sh"
      - "scripts/analyze-mapping-benchmark.py"
      - "sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/mapping/MappingFullBenchmark.java"
      - "sjf4j-testbench/build.gradle.kts"
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label: use self-hosted for a physically fixed baseline'
        type: choice
        required: true
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - self-hosted
      cpu_model:
        description: 'Optional exact CPU model guard (from /proc/cpuinfo model name)'
        required: false
        type: string
      cpu_set:
        description: 'Optional Linux taskset CPU list for JMH and its forks (e.g. 1-2)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mapping-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-jmh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check scripts
        run: |
          bash -n scripts/benchmark-mapping.sh
          python3 -m py_compile scripts/analyze-mapping-benchmark.py
          test -x scripts/benchmark-mapping.sh
      - name: Run Mapper processor regression tests
        if: github.event_name == 'pull_request'
        run: ./gradlew :sjf4j-processor:test
      - name: Compile JMH jar and both generated mapper implementations
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Upload JMH jar
        uses: actions/upload-artifact@v4
        with:
          name: mapping-jmh-jar
          path: sjf4j-testbench/build/libs/*-jmh.jar
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke / ${{ matrix.group }}
    if: github.event_name == 'pull_request'
    needs: build-jmh
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [order, pojo, collection, json]
    env:
      MAPPING_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: mapping-jmh-jar
          path: sjf4j-testbench/build/libs
      - name: Verify Mapping ${{ matrix.group }} correctness and completeness
        run: ./scripts/benchmark-mapping.sh smoke "${{ matrix.group }}"
      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-smoke-${{ matrix.group }}-${{ github.run_id }}
          path: build/performance/mapping/${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 7

  benchmark:
    name: Full / all groups (one CPU model)
    if: github.event_name == 'workflow_dispatch'
    needs: build-jmh
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      MAPPING_SKIP_BUILD: '1'
      MAPPING_EXPECT_CPU_MODEL: ${{ inputs.cpu_model || '' }}
      MAPPING_CPU_SET: ${{ inputs.cpu_set || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: mapping-jmh-jar
          path: sjf4j-testbench/build/libs
      - name: Record benchmark runner hardware
        shell: bash
        run: |
          OUT="build/performance/mapping"
          mkdir -p "$OUT"
          {
            echo "Run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Commit: $GITHUB_SHA"
            echo "Runner label: ${{ inputs.runner_label || 'ubuntu-24.04' }}"
            echo "Expected CPU model: ${MAPPING_EXPECT_CPU_MODEL:-none}"
            echo "CPU set: ${MAPPING_CPU_SET:-unrestricted}"
            lscpu
            grep Cpus_allowed_list /proc/self/status || true
            free -h
            java -version 2>&1
          } > "$OUT/runner.txt"
      - name: All four Mapping Full groups on the same runner
        run: ./scripts/benchmark-mapping.sh full all
      - name: Upload all raw results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-full-all-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/performance/mapping/
          if-no-files-found: warn
          retention-days: 30

  collect-results:
    name: Combined Mapping report
    if: ${{ github.event_name == 'workflow_dispatch' && needs.build-jmh.result == 'success' && needs.benchmark.result == 'success' }}
    needs: [build-jmh, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download one-run raw results
        uses: actions/download-artifact@v4
        with:
          name: mapping-full-all-${{ github.run_id }}-${{ github.run_attempt }}
          path: results
      - name: Generate strict Best 2 report
        shell: bash
        run: |
          python3 scripts/analyze-mapping-benchmark.py \
            results/order/mapping-order.json \
            results/pojo/mapping-pojo.json \
            results/collection/mapping-collection.json \
            results/json/mapping-json.json \
            --output results/report.md
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-full-combined-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
