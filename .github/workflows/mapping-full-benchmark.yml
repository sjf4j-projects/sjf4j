name: Mapping Benchmark (JDK 25)

on:
  pull_request:
    paths:
      - ".github/workflows/mapping-full-benchmark.yml"
      - "scripts/benchmark-mapping.sh"
      - "scripts/analyze-mapping-benchmark.py"
      - "sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/mapping/MappingFullBenchmark.java"
      - "sjf4j-testbench/build.gradle.kts"
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        type: choice
        default: smoke
        options: [smoke, quick, full]

permissions:
  contents: read

env:
  PROFILE: ${{ inputs.profile || 'smoke' }}

concurrency:
  group: mapping-${{ github.ref }}-${{ inputs.profile || 'smoke' }}
  cancel-in-progress: false

jobs:
  build-jmh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check scripts
        run: |
          bash -n scripts/benchmark-mapping.sh
          python3 -m py_compile scripts/analyze-mapping-benchmark.py
          test -x scripts/benchmark-mapping.sh
      - name: Compile JMH jar and both generated mapper implementations
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Upload JMH jar
        uses: actions/upload-artifact@v4
        with:
          name: mapping-jmh-jar
          path: sjf4j-testbench/build/libs/*-jmh.jar
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  benchmark:
    name: ${{ inputs.profile || 'smoke' }} / ${{ matrix.group }}
    needs: build-jmh
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        group: [order, pojo, collection, json]
    env:
      MAPPING_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: mapping-jmh-jar
          path: sjf4j-testbench/build/libs
      - name: Record runner hardware
        shell: bash
        run: |
          OUT="build/performance/mapping/${{ matrix.group }}"
          mkdir -p "$OUT"
          {
            echo "Group: ${{ matrix.group }}"
            echo "Profile: $PROFILE"
            echo "Run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Commit: $GITHUB_SHA"
            lscpu
            grep Cpus_allowed_list /proc/self/status || true
            free -h
            java -version 2>&1
          } > "$OUT/runner.txt"
      - name: Run benchmark
        run: bash scripts/benchmark-mapping.sh "$PROFILE" "${{ matrix.group }}"
      - name: Upload raw results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ env.PROFILE }}-${{ matrix.group }}-${{ github.run_id }}
          path: build/performance/mapping/${{ matrix.group }}/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  collect-results:
    name: Combined results
    needs: [build-jmh, benchmark]
    if: ${{ always() && needs.build-jmh.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download group artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mapping-${{ env.PROFILE }}-*-${{ github.run_id }}
          path: results
      - name: Generate Full Best 2 Mean report
        if: ${{ env.PROFILE == 'full' && needs.benchmark.result == 'success' }}
        shell: bash
        run: |
          python3 scripts/analyze-mapping-benchmark.py \
            "results/mapping-full-order-${{ github.run_id }}/mapping-order.json" \
            "results/mapping-full-pojo-${{ github.run_id }}/mapping-pojo.json" \
            "results/mapping-full-collection-${{ github.run_id }}/mapping-collection.json" \
            "results/mapping-full-json-${{ github.run_id }}/mapping-json.json" \
            --output results/report.md
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-combined-${{ env.PROFILE }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
