name: Temporary Array Direct Access AB JMH

on:
  push:
    branches:
      - perf/nodemapper-primitive-array-fastpath

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Paired base and candidate benchmark
        shell: bash
        run: |
          set -euo pipefail
          BENCHMARK="sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/mapping/NodeMapperConversionBenchmark.java"
          OUT="$RUNNER_TEMP/array-jmh"
          mkdir -p "$OUT"
          cp "$BENCHMARK" "$OUT/NodeMapperConversionBenchmark.java"
          git worktree add --detach "$OUT/base" c94b77fa105408bd62a9fa04493419324a97e918
          cp "$OUT/NodeMapperConversionBenchmark.java" "$OUT/base/$BENCHMARK"
          PATTERN='org.sjf4j.testbench.mapping.NodeMapperConversionBenchmark.nodeMapper_(javaArrayToTypedList|boxedLongArrayToTypedList|intArrayToTypedList|listToTypedList)'
          run_bench() {
            local root="$1" label="$2"
            cd "$root"
            ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
            local jar
            jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*jmh.jar' -print -quit)
            test -n "$jar"
            java -jar "$jar" "$PATTERN" -f 1 -t 1 -wi 4 -i 6 -w 250ms -r 350ms -prof gc -rf json -rff "$OUT/$label.json"
          }
          run_bench "$OUT/base" base
          run_bench "$GITHUB_WORKSPACE" candidate
          python3 - <<'PY'
          import os,json
          root=os.environ['RUNNER_TEMP']+'/array-jmh/'
          data={label:json.load(open(root+label+'.json')) for label in ('base','candidate')}
          for k,v in data.items():
              if len(v)!=4: raise RuntimeError(f'{k}: expected four measurements, got {len(v)}')
          score={}
          for label,records in data.items():
              for r in records:
                  method=r['benchmark'].split('.')[-1]
                  p=r['primaryMetric']
                  a=r.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan'))
                  score.setdefault(method,{})[label]=(p['score'],p.get('scoreError',0),a)
          print('=== MAPPER ARRAY AB RESULTS ===')
          print(f'{"method":37} {"base ns":>11} {"candidate ns":>13} {"delta %":>9} {"base B":>11} {"candidate B":>12}')
          for method,vals in sorted(score.items()):
              old,err1,alloc1=vals['base']
              new,err2,alloc2=vals['candidate']
              print(f'{method:37} {old:11.2f} {new:13.2f} {(new/old-1)*100:+9.2f} {alloc1:11.2f} {alloc2:12.2f}')
              print(f'  scoreError: base={err1:.2f} candidate={err2:.2f}')
          PY
      - name: Upload JMH JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: array-direct-access-ab
          path: ${{ runner.temp }}/array-jmh/*.json
          if-no-files-found: ignore
