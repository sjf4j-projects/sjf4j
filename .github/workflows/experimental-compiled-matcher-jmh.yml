name: Experimental Fastjson2 Compiled Matcher
on:
  push:
    branches:
      - experiment/compiled-fastjson2-pojo-matcher
    paths:
      - .github/workflows/experimental-compiled-matcher-jmh.yml
permissions:
  contents: read
jobs:
  test-and-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Verify generated binder and backend tests
        shell: bash
        run: |
          ./gradlew :sjf4j-backend-fastjson2:test :sjf4j-processor:test :sjf4j-testbench:test --no-daemon --console=plain && exit 0
          echo '=== TEST XML diagnostics ==='
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for f in Path('sjf4j-processor/build/test-results/test').glob('TEST-*.xml'):
              try: root=ET.parse(f).getroot()
              except Exception: continue
              for tc in root.findall('.//testcase'):
                  for issue in list(tc.findall('failure'))+list(tc.findall('error')):
                      print(tc.attrib.get('name'),issue.attrib.get('message'),(issue.text or '')[:3500])
          PY
          exit 1
      - name: Compile paired JMH harnesses
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/matcher-base 5349dc38982a47d35745842439443b9f2fb6093c
          git worktree add --detach /tmp/matcher-candidate HEAD
          (cd /tmp/matcher-base && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
          (cd /tmp/matcher-candidate && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
      - name: Paired A-B-B-A Fastjson2 compiled JMH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for tag in base-1 candidate-1 candidate-2 base-2; do
            rev="${tag%-*}"
            echo "::group::${tag}"
            java -jar /tmp/matcher-${rev}/sjf4j-testbench/build/libs/*-jmh.jar \
              '.*CompiledReadBenchmark[.]json_fastjson2_pojo_(reversed_)?(string|utf8)_compiled$' \
              -f 1 -wi 4 -w 250ms -i 6 -r 300ms -t 1 \
              -rf json -rff results/${tag}.json | tee results/${tag}.txt
            echo "::endgroup::"
          done
      - name: Summarize
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cases={}
          for tag in ['base-1','candidate-1','candidate-2','base-2']:
              rows=json.loads(Path('results',tag+'.json').read_text())
              assert len(rows)==4,(tag,len(rows))
              for row in rows:
                  name=row['benchmark']
                  key=('reversed' if '_reversed_' in name else 'ordered') + '/' + ('utf8' if '_utf8_' in name else 'string')
                  cases.setdefault(key,{})[tag]=row['primaryMetric']['score']
          for key,x in sorted(cases.items()):
              a=(x['base-1']+x['base-2'])/2
              b=(x['candidate-1']+x['candidate-2'])/2
              print(f'{key}: base {a:.6f}, specialized {b:.6f}, delta {(b/a-1)*100:+.2f}% (runs: {x})')
          PY
      - name: Upload JMH data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-specialized-matcher-ab
          path: results/
          if-no-files-found: ignore
