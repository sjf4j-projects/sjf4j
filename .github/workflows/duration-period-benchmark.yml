name: Duration and Period parser evaluation
on:
  pull_request:
    branches: [main]
    paths:
      - 'sjf4j-testbench/src/main/java/org/sjf4j/testbench/binding/runtime/ExperimentalTemporalParsers.java'
      - 'sjf4j-testbench/src/test/java/org/sjf4j/testbench/binding/runtime/ExperimentalTemporalParsersTest.java'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/runtime/DurationPeriod*Benchmark.java'
      - '.github/workflows/duration-period-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '25']
    name: JMH JDK \${{ matrix.java-version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: \${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Isolated parser comparison
        run: |
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" 'org.sjf4j.testbench.binding.runtime.DurationPeriodParseBenchmark.*' -wi 1 -i 2 -f 2 -w 500ms -r 500ms -prof gc -rf json -rff duration-period-parse-jdk\${{ matrix.java-version }}.json
          cat duration-period-parse-jdk\${{ matrix.java-version }}.json
      - name: Seven-backend binding comparison
        run: |
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" 'org.sjf4j.testbench.binding.runtime.DurationPeriodBindingBenchmark.*' -wi 1 -i 2 -f 2 -w 500ms -r 500ms -prof gc -rf json -rff duration-period-binding-jdk\${{ matrix.java-version }}.json
          cat duration-period-binding-jdk\${{ matrix.java-version }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: duration-period-jmh-jdk\${{ matrix.java-version }}
          path: |
            duration-period-parse-jdk\${{ matrix.java-version }}.json
            duration-period-binding-jdk\${{ matrix.java-version }}.json
