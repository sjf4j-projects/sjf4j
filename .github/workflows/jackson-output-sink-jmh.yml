name: Jackson Compiled Entrypoint Investigation (JDK 25)

# Diagnostic branch only; never changes production writer or main.
on:
  push:
    branches:
      - experiment/jackson-output-sink-jmh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jackson-output-sink-investigation
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile JMH and compiled binders
        run: ./gradlew :sjf4j-testbench:jmhJar

      - name: Capture runtime environment and generated bytecode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/performance/jackson-entrypoint
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
          test -n "$JAR"
          {
            echo "Commit: $GITHUB_SHA"
            lscpu
            free -h
            java -version 2>&1
          } > build/performance/jackson-entrypoint/runner.txt
          for spec in \
              'FabienBindings$Jackson2_Impl' \
              'FabienBindings$Jackson3_Impl' \
              'JacksonOutputSinkBenchmark$Jackson2Stream_Impl' \
              'JacksonOutputSinkBenchmark$Jackson3Stream_Impl'; do
            clazz="org.sjf4j.testbench.binding.fabien.$spec"
            javap -c -p -classpath "$JAR" "$clazz" > "build/performance/jackson-entrypoint/${spec//\$/_}.javap.txt"
          done

      - name: Paired Users experiment across backends and seeds
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
          java -jar "$JAR" 'org.sjf4j.testbench.binding.fabien.JacksonWriterEntrypointBenchmark.write' \
            -p backend=jackson2,jackson3 \
            -p model=users -p seed=12345,324 -p sizeKb=100 \
            -p variant=native,blackbird,runtimeBytes,runtimePooled,originalBytes,siblingBytes,siblingPooled,siblingBaos,siblingDiscard \
            -f 3 -wi 4 -i 5 -w 400ms -r 400ms -t 1 -prof gc \
            -rf json -rff build/performance/jackson-entrypoint/users.json \
            > build/performance/jackson-entrypoint/users.log 2>&1
          tail -60 build/performance/jackson-entrypoint/users.log

      - name: Jackson3 Clients control
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
          java -jar "$JAR" 'org.sjf4j.testbench.binding.fabien.JacksonWriterEntrypointBenchmark.write' \
            -p backend=jackson3 -p model=clients -p seed=12345 -p sizeKb=100 \
            -p variant=native,blackbird,runtimeBytes,runtimePooled,originalBytes,siblingBytes,siblingPooled,siblingBaos,siblingDiscard \
            -f 3 -wi 4 -i 5 -w 400ms -r 400ms -t 1 -prof gc \
            -rf json -rff build/performance/jackson-entrypoint/clients.json \
            > build/performance/jackson-entrypoint/clients.log 2>&1
          tail -60 build/performance/jackson-entrypoint/clients.log

      - name: Summarize same-generated-class A/B
        shell: bash
        run: |
          python3 - <<'PY' | tee build/performance/jackson-entrypoint/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import defaultdict
          from pathlib import Path
          root = Path("build/performance/jackson-entrypoint")
          rows = json.loads((root / "users.json").read_text()) + json.loads((root / "clients.json").read_text())
          assert len(rows) == 45, f"Expected 45 measurements, got {len(rows)}"
          data = defaultdict(dict)
          for x in rows:
              p=x["params"]
              key=(p["backend"],p["model"],p["seed"])
              data[key][p["variant"]]=(x["primaryMetric"]["score"], x["primaryMetric"]["scoreError"], x["secondaryMetrics"].get("gc.alloc.rate.norm",{}).get("score",float("nan")))
          print("# Jackson entrypoint comparison")
          print("JDK 25. 3 forks × (4 warmup + 5 measurement iterations) of 400ms. Lower µs/op is better.")
          print("Same generated binder: siblingBytes vs siblingPooled vs siblingBaos vs siblingDiscard.")
          for key in sorted(data):
              b,m,s=key
              print(f"\n## {b} / {m} / seed={s}")
              print("| Variant | µs/op | JMH Error | Alloc B/op |")
              print("| --- | ---: | ---: | ---: |")
              for v in ("native","blackbird","runtimeBytes","runtimePooled","originalBytes","siblingBytes","siblingPooled","siblingBaos","siblingDiscard"):
                  score,err,alloc=data[key][v]
                  print(f"| {v} | {score:.2f} | ±{err:.2f} | {alloc:.0f} |")
              orig=data[key]["originalBytes"][0]; sibling=data[key]["siblingBytes"][0]; stream=data[key]["siblingPooled"][0]
              print(f"\nSame-overload class-shape difference: originalBytes / siblingBytes = {orig/sibling:.3f}x.")
              print(f"Same-generated-class byte[] vs pooled stream: siblingBytes / siblingPooled = {sibling/stream:.3f}x.")
          PY

      - name: Upload source comparison and raw JMH/GC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson-entrypoint-jdk25
          path: build/performance/jackson-entrypoint/
          retention-days: 30
          if-no-files-found: warn
