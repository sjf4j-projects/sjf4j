name: Jackson3 Original Users Four-Path JMH (JDK 25)

# Experimental PR only. This workflow never touches production code or main.
on:
  push:
    branches:
      - experiment/jackson-output-sink-jmh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jackson-output-sink-investigation
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build JMH
        run: ./gradlew :sjf4j-testbench:jmhJar

      - name: Preflight every variant and output equivalence
        shell: bash
        run: |
          set -euo pipefail
          DIR=build/performance/jackson3-original-path
          mkdir -p "$DIR"
          {
            echo "Commit: $GITHUB_SHA"
            java -version 2>&1
            lscpu
          } > "$DIR/runner.txt"
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
          test -n "$JAR"
          java -jar "$JAR" 'org.sjf4j.testbench.binding.fabien.Jackson3OriginalPathBenchmark.write' \
            -p path=originalBytes,siblingBytes,siblingStream,manual \
            -p seed=12345,324 -p sizeKb=100 \
            -f 0 -wi 0 -i 1 -r 60ms -t 1 \
            -rf json -rff "$DIR/smoke.json" > "$DIR/smoke.log" 2>&1 || {
              tail -160 "$DIR/smoke.log"
              exit 1
            }
          python3 - <<'PY'
          import json
          p="build/performance/jackson3-original-path/smoke.json"
          rows=json.load(open(p))
          if len(rows)!=8:
              raise SystemExit(f"Preflight expected 8 successful paths, got {len(rows)}")
          print("All 8 paths passed setup+output parity")
          PY
          grep 'PATH_CHECK' "$DIR/smoke.log" | sort | tee "$DIR/output-checks.txt"

      - name: Full original-path A/B with GC allocation
        shell: bash
        run: |
          set -euo pipefail
          DIR=build/performance/jackson3-original-path
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
          java -jar "$JAR" 'org.sjf4j.testbench.binding.fabien.Jackson3OriginalPathBenchmark.write' \
            -p path=originalBytes,siblingBytes,siblingStream,manual \
            -p seed=12345,324 -p sizeKb=100 \
            -f 3 -wi 4 -i 5 -w 400ms -r 400ms -t 1 -prof gc \
            -rf json -rff "$DIR/results.json" > "$DIR/benchmark.log" 2>&1 || {
              tail -160 "$DIR/benchmark.log"
              exit 1
            }
          python3 - <<'PY'
          import json
          p="build/performance/jackson3-original-path/results.json"
          rows=json.load(open(p))
          if len(rows)!=8:
              raise SystemExit(f"Expected all 8 JMH results, got {len(rows)}. See benchmark.log")
          PY
          tail -55 "$DIR/benchmark.log"

      - name: Summarize relative differences and per-fork scores
        shell: bash
        run: |
          python3 - <<'PY' | tee build/performance/jackson3-original-path/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root=Path("build/performance/jackson3-original-path")
          rows=json.loads((root/"results.json").read_text())
          data={(r["params"]["seed"],r["params"]["path"]):r for r in rows}
          assert len(data)==8
          print("# Jackson3 original Users POJO, 100KB")
          print("JDK 25. Four paths, same original Users POJO, 2 seeds; 3 forks.")
          print("All four serialize the same data; manual and streaming use SJF4J Pooled output.")
          print("lower µs/op and B/op is better.")
          for seed in ("12345","324"):
              print(f"\n## Seed {seed}")
              print("| Path | µs/op | JMH error | B/op | Ratio to siblingBytes | Fork means (µs/op) |")
              print("| --- | ---: | ---: | ---: | ---: | --- |")
              baseline=data[(seed,"siblingBytes")]["primaryMetric"]["score"]
              for path in ("originalBytes","siblingBytes","siblingStream","manual"):
                  r=data[(seed,path)]
                  m=r["primaryMetric"]
                  gc=r["secondaryMetrics"]["gc.alloc.rate.norm"]["score"]
                  forks=m.get("rawData",[])
                  means=[sum(x)/len(x) for x in forks if x]
                  shown=", ".join(f"{v:.2f}" for v in means) if means else "not available"
                  print(f"| {path} | {m['score']:.2f} | ±{m['scoreError']:.2f} | {gc:.0f} | {m['score']/baseline:.3f}x | {shown} |")
              print()
          print("\nNote: The hand-written path is a separate code body; the generated byte[]")
          print("vs OutputStream path comparison is a more tightly controlled A/B.")
          PY

      - name: Upload JMH JSON, GC, fork summary and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-original-four-path-jdk25
          path: build/performance/jackson3-original-path/
          retention-days: 30
          if-no-files-found: warn
