name: Jackson Compiled Class Shape Ablation (JDK 25)

# Diagnostic only; run on experiment branch, never merge automatically.
on:
  push:
    branches: [experiment/jackson-output-sink-jmh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jackson-output-sink-investigation
  cancel-in-progress: true

jobs:
  ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH and generated binders
        run: ./gradlew :sjf4j-testbench:jmhJar

      - name: Capture JDK, CPU and generated class bytecode
        shell: bash
        run: |
          set -euo pipefail
          DIR=build/performance/jackson-class-shape
          mkdir -p "$DIR"
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
          { echo "Commit: $GITHUB_SHA"; java -version 2>&1; lscpu; } > "$DIR/runner.txt"
          classes=(
            'FabienBindings$Jackson2_Impl'
            'FabienBindings$Jackson3_Impl'
            'JacksonWriterClassShapeBenchmark$Jackson2UsersOnly_Impl'
            'JacksonWriterClassShapeBenchmark$Jackson2WritePair_Impl'
            'JacksonWriterClassShapeBenchmark$Jackson2WriteAll_Impl'
            'JacksonWriterClassShapeBenchmark$Jackson2FullClone_Impl'
            'JacksonWriterClassShapeBenchmark$Jackson3UsersOnly_Impl'
            'JacksonWriterClassShapeBenchmark$Jackson3WritePair_Impl'
            'JacksonWriterClassShapeBenchmark$Jackson3WriteAll_Impl'
            'JacksonWriterClassShapeBenchmark$Jackson3FullClone_Impl'
          )
          i=0
          for spec in "${classes[@]}"; do
            i=$((i + 1))
            echo "$i $spec" >> "$DIR/classes.txt"
            javap -c -p -classpath "$JAR" "org.sjf4j.testbench.binding.fabien.$spec" > "$DIR/class-$i.javap.txt"
          done

      - name: Benchmark isolated class-shape variants
        shell: bash
        run: |
          set -euo pipefail
          DIR=build/performance/jackson-class-shape
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
          java -jar "$JAR" 'org.sjf4j.testbench.binding.fabien.JacksonWriterClassShapeBenchmark.write' \
            -p backend=jackson2,jackson3 \
            -p variant=runtime,original,usersOnly,writePair,writeAll,fullClone \
            -p seed=12345,324 -p sizeKb=100 \
            -f 3 -wi 4 -i 5 -w 400ms -r 400ms -t 1 -prof gc \
            -rf json -rff "$DIR/results.json" > "$DIR/benchmark.log" 2>&1
          tail -70 "$DIR/benchmark.log"

      - name: JMH summary
        shell: bash
        run: |
          python3 - <<'PY' | tee build/performance/jackson-class-shape/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import defaultdict
          rows=json.load(open("build/performance/jackson-class-shape/results.json"))
          assert len(rows)==24, f"Expected 24 JMH cases, got {len(rows)}"
          data=defaultdict(dict)
          for row in rows:
              p=row["params"]
              key=(p["backend"],p["seed"])
              data[key][p["variant"]]=row
          for (backend,seed), d in sorted(data.items()):
              assert len(d)==6, (backend,seed,len(d))
              print(f"## {backend} / Users 100KB / seed={seed}")
              print("| Variant | Score µs/op | JMH error | Allocation B/op |")
              print("| --- | ---: | ---: | ---: |")
              for v in ("runtime","original","usersOnly","writePair","writeAll","fullClone"):
                  m=d[v]["primaryMetric"]
                  alloc=d[v]["secondaryMetrics"]["gc.alloc.rate.norm"]["score"]
                  print(f"| {v} | {m['score']:.2f} | ±{m['scoreError']:.2f} | {alloc:.0f} |")
              print()
          PY

      - name: Upload raw JMH and bytecode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson-class-shape-jdk25
          path: build/performance/jackson-class-shape/
          retention-days: 30
          if-no-files-found: warn
