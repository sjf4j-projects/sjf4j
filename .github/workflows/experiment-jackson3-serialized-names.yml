name: Experiment / Jackson3 compiled native prepared names

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-jackson3-serialized-names.yml'
      - 'sjf4j-processor/src/main/java/org/sjf4j/processor/binding/BackendSpec.java'
      - 'sjf4j-processor/src/main/java/org/sjf4j/processor/binding/JacksonWriteEmitter.java'

permissions:
  contents: read

jobs:
  users-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Compile, test, inspect actual generated code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/generated
          { git rev-parse HEAD; java -version 2>&1; lscpu; } > results/environment.txt
          ./gradlew --no-daemon :sjf4j-processor:test \
            --tests '*CompiledJacksonUnifiedWriteTest' \
            --tests '*Jackson3PreparedNameWriteTest'
          ./gradlew --no-daemon :sjf4j-testbench:jmhJar
          jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -s "$jar"
          echo "$jar" > results/jar-path.txt
          find sjf4j-testbench/build/generated -name '*FabienBindings*Jackson3_Impl.java' -exec cp {} results/generated/ \; || true
          if ! grep -R -q 'private static final SerializedString ' results/generated; then
            echo 'Direct prepared fields not found in generated Jackson3 Fabien binder'
            find sjf4j-testbench/build/generated -name '*Jackson3_Impl.java' | head -30
            exit 1
          fi
          if grep -R -q 'Jackson3CompiledName' results/generated; then
            echo 'Old Jackson3CompiledName found in compiled generated write path'
            exit 1
          fi

      - name: JMH actual generated Compiled / Native / Blackbird Users Write
        shell: bash
        run: |
          set -euo pipefail
          jar=$(cat results/jar-path.txt)
          java -jar "$jar" 'org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write' \
            -p backend=jackson3 -p model=users -p shape=pojo \
            -p implementation=native,blackbird,compiled \
            -p sizeKb=1,10,100 -p seed=12345,324 \
            -f 3 -t 1 -wi 4 -i 5 -w 500ms -r 500ms -prof gc \
            -rf json -rff results/jackson3-generated-users-write.json \
            > results/jackson3-generated-users-write.log 2>&1 || {
              tail -120 results/jackson3-generated-users-write.log
              exit 1
            }

      - name: Summarize
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('results/jackson3-generated-users-write.json')
          print('## Jackson3 generated direct SerializedString / Users POJO Write')
          if not p.exists():
              print('Benchmark result missing; check logs.')
              raise SystemExit(0)
          rows=json.loads(p.read_text())
          print('| KB | Seed | Native (us/op) | Blackbird (us/op) | Compiled (us/op) | Native / Compiled | Blackbird / Compiled |')
          print('| ---: | ---: | ---: | ---: | ---: | ---: | ---: |')
          for size in ('1','10','100'):
              for seed in ('12345','324'):
                  scores={r['params']['implementation']:r['primaryMetric']['score']
                          for r in rows if r['params']['sizeKb']==size and r['params']['seed']==seed}
                  if set(scores)!={'native','blackbird','compiled'}:
                      raise SystemExit(f'Missing data size={size} seed={seed}: {scores}')
                  print(f"| {size} | {seed} | {scores['native']:.3f} | {scores['blackbird']:.3f} | {scores['compiled']:.3f} | {scores['native']/scores['compiled']:.3f} | {scores['blackbird']/scores['compiled']:.3f} |")
          print()
          print('3 forks per case. Ratios >1 indicate Compiled is faster.')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson3-serialized-names-users-${{ github.run_id }}
          path: results/
          retention-days: 14
