name: Schema Benchmark (JDK 25)

on:
  pull_request:
    paths:
      - ".github/workflows/schema-full-benchmark.yml"
      - "scripts/benchmark-schema.sh"
      - "scripts/analyze-schema-benchmark.py"
      - "sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/schema/CreekSchemaBenchmark.java"
      - "sjf4j-testbench/build.gradle.kts"
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        type: choice
        default: smoke
        options: [smoke, quick, full]

permissions:
  contents: read

env:
  PROFILE: ${{ inputs.profile || 'smoke' }}

concurrency:
  group: schema-${{ github.ref }}-${{ inputs.profile || 'smoke' }}
  cancel-in-progress: false

jobs:
  build-jmh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar

      - name: Verify JMH external-node service entries
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$JAR"
          providers=$(unzip -p "$JAR" META-INF/services/org.sjf4j.external.ExternalProvider)
          echo "$providers"
          grep -q 'org.sjf4j.backend.jackson2.external.Jackson2ExternalProvider' <<< "$providers"

      - name: Upload JMH jar
        uses: actions/upload-artifact@v4
        with:
          name: schema-jmh-jar
          path: sjf4j-testbench/build/libs/*-jmh.jar
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  benchmark:
    name: ${{ inputs.profile || 'smoke' }} / ${{ matrix.group }}
    needs: build-jmh
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        group: [validation, roundtrip]
    env:
      SCHEMA_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: schema-jmh-jar
          path: sjf4j-testbench/build/libs
      - name: Record runner hardware
        shell: bash
        run: |
          OUT="build/performance/schema/${{ matrix.group }}"
          mkdir -p "$OUT"
          {
            echo "Group: ${{ matrix.group }}"
            echo "Profile: $PROFILE"
            echo "Run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Commit: $GITHUB_SHA"
            lscpu
            grep Cpus_allowed_list /proc/self/status || true
            free -h
            java -version 2>&1
          } > "$OUT/runner.txt"
      - name: Run benchmark
        run: bash scripts/benchmark-schema.sh "$PROFILE" "${{ matrix.group }}"
      - name: Upload raw results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-${{ env.PROFILE }}-${{ matrix.group }}-${{ github.run_id }}
          path: build/performance/schema/${{ matrix.group }}/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  collect-results:
    name: Combined results
    needs: [build-jmh, benchmark]
    if: ${{ always() && needs.build-jmh.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download group artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: schema-${{ env.PROFILE }}-*-${{ github.run_id }}
          path: results
      - name: Generate Full Best 2 Mean report
        if: ${{ env.PROFILE == 'full' && needs.benchmark.result == 'success' }}
        shell: bash
        run: |
          python3 scripts/analyze-schema-benchmark.py \
            "results/schema-full-validation-${{ github.run_id }}/schema-validation.json" \
            "results/schema-full-roundtrip-${{ github.run_id }}/schema-roundtrip.json" \
            --output results/report.md
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-combined-${{ env.PROFILE }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
