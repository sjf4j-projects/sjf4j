name: Native generator PR verification

on:
  push:
    branches:
      - refactor/compiled-native-generator-naming

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run compiled writer tests
        run: |
          ./gradlew :sjf4j-processor:test \
            --tests org.sjf4j.processor.CompiledCodecRawIOTest \
            --tests org.sjf4j.processor.CompiledGsonJsonpRootScalarTest \
            --tests org.sjf4j.processor.CompiledJacksonMixedPojoWriteTest \
            --tests org.sjf4j.processor.CompiledJacksonUnifiedWriteTest \
            --tests org.sjf4j.processor.CompiledGsonJsonpUnifiedWriteTest \
            --tests org.sjf4j.processor.Fastjson2CompiledWrapperIntegrationTest
      - name: Compile JMH benchmarks
        run: ./gradlew :sjf4j-testbench:compileJmhJava
