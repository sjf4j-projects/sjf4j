name: Experiment prune vacuous schema keywords
on:
  push:
    branches: [experiment/schema-trivial-keywords]
    paths: [.github/workflows/schema-trivial-keywords-exp.yml]
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :sjf4j-schema:test :sjf4j-testbench:jmhJar --no-daemon --console=plain
      - name: Build baseline
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/sjf4j-baseline" ef47ddd582aa2fc7e0abd4871edc4c3b9628b1c5
          (cd "$RUNNER_TEMP/sjf4j-baseline" && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
      - name: JMH same runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          regex='.*CreekSchemaBenchmark\.(schema_validate_map|schema_is_valid_map|schema_is_valid_fail_nested|round_trip_validate)$'
          for variant in baseline pruned; do
            if [ "$variant" = baseline ]; then root="$RUNNER_TEMP/sjf4j-baseline"; else root="$GITHUB_WORKSPACE"; fi
            jar=$(find "$root/sjf4j-testbench/build/libs" -maxdepth 1 -name '*jmh*.jar' -type f | head -n 1)
            java -jar "$jar" "$regex" -f 2 -wi 12 -i 5 -w 300ms -r 350ms -prof gc \
              -rf json -rff "$GITHUB_WORKSPACE/results/$variant.json" | tee "$GITHUB_WORKSPACE/results/$variant.txt"
          done
          python3 - <<'PY'
          import json
          for variant in ('baseline','pruned'):
              print('===',variant,'===')
              for row in json.load(open('results/'+variant+'.json')):
                  p=row['primaryMetric']
                  alloc=next((v['score'] for k,v in row['secondaryMetrics'].items() if k.endswith('gc.alloc.rate.norm')),None)
                  print(row['benchmark'].rsplit('.',1)[-1],round(p['score'],5),'+/-',round(p['scoreError'],5),'us/op',round(alloc,1),'B/op')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivial-keywords-jmh
          path: results/
