name: Temporary Fastjson2 Direct Boundary A-B
on:
  push:
    branches:
      - experiment/fastjson2-direct-boundary
    paths:
      - .github/workflows/temporary-fastjson2-direct-boundary-ab.yml
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Conformance
        shell: bash
        run: ./gradlew :sjf4j-processor:test :sjf4j-backend-fastjson2:test :sjf4j-testbench:test --no-daemon --console=plain
      - name: Build B and C
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/boundary-b f41733679e324b9a9aee7e2bd768d8a020c7e1ef
          git worktree add --detach /tmp/boundary-c HEAD
          (cd /tmp/boundary-b && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
          (cd /tmp/boundary-c && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
      - name: Native boundary A-B-B-A
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for tag in b-1 c-1 c-2 b-2; do
            rev="${tag%-*}"
            java -jar /tmp/boundary-${rev}/sjf4j-testbench/build/libs/*-jmh.jar \
              '.*CompiledReadBenchmark[.]fastjson2_pojo_(reversed_)?(string|utf8)_(compiled|native)$|.*HandReadBenchmark[.]json_fastjson2_pojo_handwritten_raw$' \
              -f 1 -wi 4 -w 250ms -i 7 -r 320ms -t 1 \
              -rf json -rff results/${tag}.json | tee results/${tag}.txt
          done
      - name: Summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          samples={}
          for tag in ('b-1','c-1','c-2','b-2'):
              for row in json.loads(Path('results',tag+'.json').read_text()):
                  samples.setdefault(row['benchmark'].split('.')[-1],{})[tag]=row['primaryMetric']['score']
          for case,s in sorted(samples.items()):
              b=(s['b-1']+s['b-2'])/2
              c=(s['c-1']+s['c-2'])/2
              print(f'{case}: direct_scalars={b:.6f}, direct_boundary={c:.6f}, delta={(c/b-1)*100:+.2f}%, pairs={s}')
          PY
      - name: Upload JMH data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-direct-boundary-ab
          path: results/
          if-no-files-found: ignore
