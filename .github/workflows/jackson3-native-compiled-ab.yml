name: Jackson3 Native Compiled A/B (experimental)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/jackson3-native-compiled-ab.yml'
      - 'sjf4j-processor/src/main/java/org/sjf4j/processor/binding/**'
      - 'sjf4j-backend-jackson3/src/main/java/org/sjf4j/backend/jackson3/binding/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compare default and native Jackson3 compiled readers
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/performance/jackson3-native-compiled
          mkdir -p "$OUT"
          java -version 2> "$OUT/java.txt"
          lscpu > "$OUT/cpu.txt"
          for native in false true; do
            echo "=== Compile native=$native ==="
            ./gradlew :sjf4j-testbench:jmhJar --rerun-tasks \
              "-Psjf4jJackson3NativePojo=$native" > "$OUT/$native-build.log" 2>&1 || {
                tail -n 140 "$OUT/$native-build.log"; exit 1
              }
            JAR="$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)"
            test -s "$JAR"
            echo "=== Smoke native=$native ==="
            java -cp "$JAR" \
              org.sjf4j.testbench.binding.fabien.FabienJackson3NativeSmoke \
              > "$OUT/$native-smoke.log" 2>&1 || {
                cat "$OUT/$native-smoke.log"; exit 1
              }
            cat "$OUT/$native-smoke.log"
            GENERATED_SOURCE="$(find sjf4j-testbench/build -type f \
            -name 'FabienBindings$Jackson3_Impl.java' -print -quit)"
          if [[ -z "$GENERATED_SOURCE" || ! -s "$GENERATED_SOURCE" ]]; then
            echo "Generated Jackson3 benchmark binder source not found" >&2
            find sjf4j-testbench/build -type f -name '*Jackson3*' || true
            exit 1
          fi
          if [[ "$native" == true ]]; then
            # Inspect the actual generated benchmark binder, not unrelated sources.
            grep -n -m 6 -F 'nextNameMatchAndToken(' "$GENERATED_SOURCE" \
              > "$OUT/generated-native.txt" || {
                echo "Native cursor calls absent from $GENERATED_SOURCE" >&2
                exit 1
              }
            if ! grep -Eq 'Native\([[:alnum:]_]+\.nativeParser\(\)\)' "$GENERATED_SOURCE"; then
              echo "Native matcher emitted, but no read method calls the native helper" >&2
              exit 1
            fi
          elif grep -qF 'nextNameMatchAndToken(' "$GENERATED_SOURCE"; then
            echo "Native cursor calls present when nativePojo=false" >&2
            exit 1
          fi
          echo "=== JMH native=$native ==="
            java -jar "$JAR" org.sjf4j.testbench.binding.fabien.FabienReadBenchmark.read \
              -p backend=jackson3 -p model=users,clients -p shape=pojo \
              -p implementation=compiled,blackbird,native -p sizeKb=1,10,100 \
              -p seed=12345,324 -t 1 -f 3 -wi 3 -i 5 \
              -w 400ms -r 400ms -prof gc \
              -rf json -rff "$OUT/$native.json" \
              > "$OUT/$native-jmh.log" 2>&1 || {
                tail -n 120 "$OUT/$native-jmh.log"; exit 1
              }
          done
          python3 - "$OUT" <<'PY'
          import csv,json,statistics,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          modes=("false","true");models=("users","clients")
          sizes=("1","10","100");seeds=("12345","324")
          impls=("compiled","blackbird","native")
          scores={};allocs={}
          for mode in modes:
              for e in json.loads((root/f"{mode}.json").read_text()):
                  p=e["params"]
                  k=(mode,p["model"],p["sizeKb"],p["seed"],p["implementation"])
                  forks=[statistics.mean(f) for f in e["primaryMetric"]["rawData"]]
                  if len(forks)!=3:raise SystemExit(f"Expected three forks: {k}")
                  scores[k]=statistics.mean(sorted(forks)[:2])
                  allocs[k]=e["secondaryMetrics"]["gc.alloc.rate.norm"]["score"]
          wanted={(mode,m,s,seed,impl) for mode in modes for m in models
                  for s in sizes for seed in seeds for impl in impls}
          if set(scores)!=wanted: raise SystemExit(f"Missing cases: {wanted-set(scores)}")
          def geo(xs):return statistics.geometric_mean(xs)
          def score(mode,m,s,impl):return geo(scores[(mode,m,s,seed,impl)] for seed in seeds)
          def alloc(mode,m,s,impl):
              return statistics.mean(allocs[(mode,m,s,seed,impl)] for seed in seeds)
          lines=[
              "# Native Jackson3 Compiled POJO A/B", "",
              "JDK25, same runner; 2 seeds x 3 forks, 3x400ms warmup, 5x400ms measurement.",
              "Best 2 Fork Mean; no List preallocation.",
              "",
              "| Model | Size | Wrapper -> Native compiled (us/op) | Speedup | Blackbird/Compiled wrapper -> native | Native/Compiled wrapper -> native | Allocated B/op wrapper -> native |",
              "| --- | --- | --- | ---: | --- | --- | --- |"
          ]
          rows=[]
          for m in models:
              for s in sizes:
                  c0,c1=(score(mode,m,s,"compiled") for mode in modes)
                  b0,b1=(score(mode,m,s,"blackbird")/score(mode,m,s,"compiled") for mode in modes)
                  n0,n1=(score(mode,m,s,"native")/score(mode,m,s,"compiled") for mode in modes)
                  a0,a1=(alloc(mode,m,s,"compiled") for mode in modes)
                  gain=(c0/c1-1)*100
                  lines.append(f"| {m} | {s}KB | {c0:.3f} -> {c1:.3f} | {gain:+.2f}% | {b0:.3f}x -> {b1:.3f}x | {n0:.3f}x -> {n1:.3f}x | {a0:.0f} -> {a1:.0f} |")
                  rows.append([m,s,c0,c1,gain,b0,b1,n0,n1,a0,a1])
          with (root/"comparison.csv").open("w",newline="") as f:
              w=csv.writer(f)
              w.writerow(["model","sizeKb","wrapper_us","native_us","speedup_pct",
                          "blackbird_wrapper","blackbird_native","native_wrapper",
                          "native_native","allocated_wrapper_B","allocated_native_B"])
              w.writerows(rows)
          (root/"comparison.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - name: Publish results
        if: always()
        run: |
          REPORT=build/performance/jackson3-native-compiled/comparison.md
          if test -f "$REPORT"; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-native-compiled-ab
          path: build/performance/jackson3-native-compiled/
          if-no-files-found: warn
          retention-days: 30
