name: Jackson native generator helper experiment
on:
  push:
    branches: [perf/jackson-pass-native-generator]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Test paired JMH and exact JSON parity
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          java -jar "$jar" '.*CompiledWriteBenchmark\.json_jackson[23]_pojo_(string|utf8)_(compiled|direct|direct_wrapped)' \
            -bm avgt -tu us -t 1 -f 3 -wi 10 -w 300ms -i 8 -r 300ms \
            -prof gc -rf json -rff native-helper-results.json | tee native-helper.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-helper-trial-${{ matrix.trial }}
          path: |
            native-helper-results.json
            native-helper.log
          if-no-files-found: warn
