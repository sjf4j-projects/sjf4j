name: CompiledWrite PR107 JMH static-config setup

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/compiled-write-main-vs-pr107-jmh.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 107
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout PR107
        uses: actions/checkout@v4
        with:
          ref: refactor/compiled-binder-static-helpers
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Adapt only the legacy RuntimeContext setup assertion for JMH
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("candidate/sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/compiled/CompiledWriteBenchmark.java")
          s = p.read_text()
          assert s.count("        verifyNullPolicyParity();") == 1, "Legacy setup call changed"
          # PR107 deliberately ignores the deprecated RuntimeContext constructor.
          # Suppress only this incompatible setup assertion; timed benchmark methods
          # and their default compiled/native/blackbird values stay unmodified.
          p.write_text(s.replace("        verifyNullPolicyParity();", "        // legacy RuntimeContext parity check disabled for performance measurement"))
          PY
      - name: Build JMH jar and identify commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          git -C candidate rev-parse HEAD | tee results/pr107-sha.txt
          java -version 2>&1 | tee results/java-version.txt
          (cd candidate && ./gradlew :sjf4j-testbench:jmhJar --no-daemon)
      - name: Run representative CompiledWriteBenchmark methods sequentially
        shell: bash
        run: |
          set -euo pipefail
          # 26 methods: Jackson2/3 POJO+Map, Fastjson2 POJO+Map, Gson POJO,
          # plus a handwritten wrapped-Jackson control.
          pattern='.*CompiledWriteBenchmark\.json_(jackson[23]_pojo_(string|utf8)_(compiled|native|blackbird)|jackson[23]_pojo_string_direct_wrapped|jackson[23]_map_string_(compiled|native)|fastjson2_pojo_(string|utf8)_(compiled|native)|fastjson2_map_string_(compiled|native)|gson_pojo_string_(compiled|native))$'
          for ref in candidate; do
            jar="$(find "$ref/sjf4j-testbench/build/libs" -maxdepth 1 -name '*-jmh.jar' -print -quit)"
            test -n "$jar"
            java -jar "$jar" "$pattern" -bm avgt -tu us -t 1 -f 3 \
              -wi 15 -w 400ms -i 5 -r 400ms \
              -rf json -rff "results/$ref.json" | tee "results/$ref.log"
          done
      - name: Summarize candidate measurements
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md
          import json
          from pathlib import Path
          p=Path("results/candidate.json")
          if not p.exists():
              print("Candidate benchmark has no JSON; inspect logs.")
          else:
              data=json.loads(p.read_text())
              print("# PR107 CompiledWriteBenchmark, adjusted legacy setup")
              print("Temurin JDK25, fork=3, warmup=15×400ms, measurement=5×400ms, 1 thread.")
              print(f"Successful methods: {len(data)}")
              print("| Method | Score (µs/op) | JMH error |")
              print("|---|---:|---:|")
              for r in sorted(data,key=lambda x:x["benchmark"]):
                  m=r["primaryMetric"]
                  print(f'| {r["benchmark"].split(".")[-1]} | {m["score"]:.3f} | ± {m["scoreError"]:.3f} |')
          PY
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-write-pr107-f3-wi15-static-config-setup
          path: results/
          if-no-files-found: warn
