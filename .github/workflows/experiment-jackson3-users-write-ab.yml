name: Experiment / Jackson3 Users Write 3.2.3 vs 3.3.0

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-jackson3-users-write-ab.yml'

permissions:
  contents: read

jobs:
  compare:
    name: Jackson3 Users Write version A/B (same runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Create temporary Gradle dependency-version override
        shell: bash
        run: |
          cat > /tmp/sjf4j-jackson3-version.init.gradle <<'GROOVY'
          def target = gradle.startParameter.projectProperties['jackson3TestVersion']
          if (!(target in ['3.2.3', '3.3.0'])) {
              throw new GradleException("Expected -Pjackson3TestVersion=3.2.3 or 3.3.0")
          }
          gradle.beforeProject { project ->
              project.configurations.configureEach { configuration ->
                  configuration.resolutionStrategy.eachDependency { details ->
                      if (details.requested.group in ['tools.jackson.core', 'tools.jackson.module']) {
                          details.useVersion(target)
                          details.because('Jackson3 Users Write controlled version A/B')
                      }
                  }
              }
          }
          GROOVY
      - name: Make read-only name-matcher constructor compatible with both Jackson versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sjf4j-backend-jackson3/src/main/java/org/sjf4j/backend/jackson3/binding/Jackson3NameMatcher.java')
          old = 'BinaryNameMatcher.construct(Arrays.asList(propertyNames), false)'
          new = 'BinaryNameMatcher.construct(Arrays.asList(propertyNames))'
          source = p.read_text()
          if old not in source:
              raise RuntimeError('Expected 3.3-only read matcher expression not found')
          p.write_text(source.replace(old, new))
          PY
          # This read-only compatibility change is identical for both runs,
          # and has no effect on the measured Users Write path.
      - name: Run both versions sequentially with identical source and JMH settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { echo "Commit: $GITHUB_SHA"; lscpu; java -version 2>&1; } > results/environment.txt
          for v in 3.2.3 3.3.0; do
            echo "=== Building Jackson $v ==="
            ./gradlew --no-daemon -I /tmp/sjf4j-jackson3-version.init.gradle \
              -Pjackson3TestVersion="$v" clean :sjf4j-testbench:jmhJar \
              2>&1 | tee "results/build-$v.log"
            ./gradlew --no-daemon -q -I /tmp/sjf4j-jackson3-version.init.gradle \
              -Pjackson3TestVersion="$v" :sjf4j-testbench:dependencies \
              --configuration jmhRuntimeClasspath > "results/dependencies-$v.txt"
            jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
            test -n "$jar"
            echo "=== Benchmarking Jackson $v ==="
            java -jar "$jar" 'org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write' \
              -p backend=jackson3 -p implementation=native,blackbird,compiled \
              -p model=users -p shape=pojo -p sizeKb=1,10,100 \
              -p seed=12345,324 -t 1 -f 3 -wi 3 -i 4 -w 500ms -r 500ms \
              -prof gc -rf json -rff "results/users-write-$v.json" \
              2>&1 | tee "results/jmh-$v.log"
          done
      - name: Compare JMH ratios
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          versions = {}
          for v in ['3.2.3', '3.3.0']:
              rows = json.loads(Path(f'results/users-write-{v}.json').read_text())
              expected = 3 * 3 * 2
              if len(rows) != expected:
                  raise RuntimeError(f'{v}: expected {expected} JMH cases, got {len(rows)}')
              versions[v] = {(r['params']['sizeKb'], r['params']['seed'],
                              r['params']['implementation']): r['primaryMetric']['score'] for r in rows}
          print('## Jackson3 Users POJO Write: 3.2.3 vs 3.3.0')
          print()
          print('Same commit and hosted runner, same JDK 25; JMH 3 forks, 3x500ms warmup, 4x500ms measurement, GC profiler.')
          print('Lower µs/op is faster; ratios above 1 mean SJF4J Compiled is faster.')
          print()
          print('| Size | Seed | Version | Native µs | Blackbird µs | Compiled µs | Native/Compiled | Blackbird/Compiled |')
          print('|---|---|---|---:|---:|---:|---:|---:|')
          for size in ['1', '10', '100']:
              for seed in ['12345', '324']:
                  for v in ['3.2.3', '3.3.0']:
                      d = versions[v]
                      n,b,c = (d[size,seed,x] for x in ['native','blackbird','compiled'])
                      print(f'| {size} KB | {seed} | {v} | {n:.3f} | {b:.3f} | {c:.3f} | {n/c:.3f}x | {b/c:.3f}x |')
          PY
      - name: Upload both versions and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-jackson3-users-write-ab
          path: results/
          if-no-files-found: warn
          retention-days: 7
