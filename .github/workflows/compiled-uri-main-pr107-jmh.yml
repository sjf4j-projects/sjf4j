name: CompiledWrite URI codec main vs PR107 JMH

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/compiled-uri-main-pr107-jmh.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uri-codec:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 107
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: refactor/compiled-binder-static-helpers
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Align the legacy setup assertion for measurement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for ref in ("baseline","candidate"):
              p=Path(ref)/"sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/compiled/CompiledWriteBenchmark.java"
              s=p.read_text()
              assert s.count("        verifyNullPolicyParity();")==1
              p.write_text(s.replace("        verifyNullPolicyParity();", "        // legacy RuntimeContext compatibility assertion omitted for JMH"))
          PY
      - name: Build each JMH jar
        run: |
          mkdir -p results
          git -C baseline rev-parse HEAD | tee results/main-sha.txt
          git -C candidate rev-parse HEAD | tee results/pr107-sha.txt
          java -version 2>&1 | tee results/java-version.txt
          (cd baseline && ./gradlew :sjf4j-testbench:jmhJar --no-daemon)
          (cd candidate && ./gradlew :sjf4j-testbench:jmhJar --no-daemon)
      - name: Run URI codec microbenchmark sequentially
        shell: bash
        run: |
          set -euo pipefail
          pattern='.*CompiledWriteBenchmark\.json_jackson[23]_uri_(compiled|runtime|direct)$'
          for ref in baseline candidate; do
            jar="$(find "$ref/sjf4j-testbench/build/libs" -maxdepth 1 -name '*-jmh.jar' -print -quit)"
            test -n "$jar"
            java -jar "$jar" "$pattern" -bm avgt -tu us -t 1 -f 3 \
              -wi 15 -w 400ms -i 5 -r 400ms \
              -rf json -rff "results/$ref.json" | tee "results/$ref.log"
          done
      - name: Summarize
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md
          import json
          from pathlib import Path
          p=Path("results")
          datasets={}
          for ref in ("baseline","candidate"):
              f=p/(ref+".json")
              if f.exists():
                  datasets[ref]={r["benchmark"].split(".")[-1]:r["primaryMetric"] for r in json.loads(f.read_text())}
          print("# CompiledWriteBenchmark URI codec: main vs PR107")
          print("JDK25, 3 forks, 15 warmups x 400ms, 5 measurements x 400ms; µs/op.")
          print("| Method | main | PR107 | PR107/main |")
          print("|---|---:|---:|---:|")
          if len(datasets)==2:
              for name in sorted(set(datasets["baseline"])&set(datasets["candidate"])):
                  a,b=datasets["baseline"][name],datasets["candidate"][name]
                  print(f'| {name} | {a["score"]:.4f} ± {a["scoreError"]:.4f} | {b["score"]:.4f} ± {b["scoreError"]:.4f} | {b["score"]/a["score"]:.3f}x |')
          else:
              print("Incomplete: check logs.")
          PY
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-write-uri-codec-main-vs-pr107-f3-wi15
          path: results/
          if-no-files-found: warn
