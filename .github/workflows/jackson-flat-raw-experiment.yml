name: Original CompiledReadBenchmark JDK25

on:
  push:
    branches:
      - experiment/jackson-original-jdk25-20261029

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Temurin 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Build JMH with JDK17 toolchain
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Reproduce original CompiledReadBenchmark on JDK25
        run: |
          "$JAVA_HOME_25_X64/bin/java" -version
          JAR=$(find sjf4j-testbench/build/libs -name '*jmh*.jar' | head -n 1)
          "$JAVA_HOME_25_X64/bin/java" -jar "$JAR" \
            '.*CompiledReadBenchmark.jackson[23]_map_(string|utf8)_(compiled|native|raw|runtime)$' \
            -f 2 -wi 6 -i 8 -w 250ms -r 250ms -prof gc \
            -rf json -rff jackson-jdk25-results.json
      - name: Upload JDK25 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson-jdk25-results
          path: jackson-jdk25-results.json
          if-no-files-found: ignore
