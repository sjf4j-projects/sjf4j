name: Jackson Original JMH Apple Silicon - f2 wi20 i5

on:
  push:
    branches:
      - experiment/jackson-macos-f2-wi20-i5-20261030

jobs:
  benchmark:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Temurin 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Build original JMH (unchanged)
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: System and JVM details
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu
          sysctl -n hw.memsize
          "$JAVA_HOME_25_ARM64/bin/java" -version
      - name: Run original Jackson 2/3 Map benchmark - 2 forks, 20 warmups, 5 measurements
        run: |
          JAR=$(find sjf4j-testbench/build/libs -name '*jmh*.jar' | head -n 1)
          "$JAVA_HOME_25_ARM64/bin/java" -jar "$JAR" \
            '.*CompiledReadBenchmark.jackson[23]_map_(string|utf8)_(compiled|native|raw|runtime)$' \
            -f 2 -wi 20 -i 5 -w 250ms -r 250ms -prof gc \
            -rf json -rff jackson-f2-wi20-i5-results.json
      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson-f2-wi20-i5-results
          path: jackson-f2-wi20-i5-results.json
          if-no-files-found: ignore
