name: Jackson Flat Raw Performance Experiment

on:
  push:
    branches:
      - experiment/jackson-flat-raw-20261029

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Build focused JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Flat scalar Map/List microbenchmarks
        run: |
          JAR=$(find sjf4j-testbench/build/libs -name '*jmh*.jar' | head -n 1)
          echo "JMH jar: $JAR"
          java -jar "$JAR" '.*JacksonFlatRawExperiment.*' -f 1 -wi 5 -i 5 -w 160ms -r 160ms -prof gc -rf json -rff jackson-flat-results.json
      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson-flat-results
          path: jackson-flat-results.json
          if-no-files-found: ignore
