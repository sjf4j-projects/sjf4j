name: Validate JOJO write workloads (one-off)

on:
  push:
    branches: [fix/record-components-jojo-write-bench-20261010]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Test record and compile JMH
        run: ./gradlew :sjf4j-testbench:test --tests '*RecordPropertySerializationTest' :sjf4j-testbench:jmhJar --no-daemon
      - name: Run all JOJO write workloads (fail on error)
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$JAR"
          java -jar "$JAR" '.*JojoWriteBenchmark.*' \
            -f 1 -wi 1 -i 2 -w 100ms -r 100ms \
            -foe true -prof gc -rf json -rff jojo-write-results.json \
            2>&1 | tee jojo-write-output.txt
      - name: Assert 33 benchmarks completed and summarize
        run: |
          python3 - <<'PY'
          import json
          with open('jojo-write-results.json') as f:
              records = json.load(f)
          assert len(records) == 33, f"expected 33 results, got {len(records)}"
          modes = {x['params']['workload'] for x in records}
          assert modes == {'static', 'mixed', 'dynamic'}, modes
          methods = {x['benchmark'].rsplit('.',1)[-1] for x in records}
          assert len(methods) == 11, len(methods)
          assert len({(x['benchmark'], x['params']['workload']) for x in records}) == 33
          print('VERIFIED_ALL_33_JOJO_WRITE_CASES')
          for x in sorted(records,key=lambda x:(x['params']['workload'],x['benchmark'])):
              p=x['primaryMetric']['score']
              alloc=x.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan'))
              print('JOJO_WRITE_RESULTS,%s,%s,%.4f,%.1f' %(x['benchmark'].rsplit('.',1)[-1],x['params']['workload'],p,alloc))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-jojo-write-smoke
          path: |
            jojo-write-results.json
            jojo-write-output.txt
          if-no-files-found: warn
