name: Inspect Compiled Read Generated Source

on:
  push:
    branches:
      - bench/compiled-read-pojo-quick-20261012
    paths:
      - .github/workflows/inspect-compiled-read-source.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Compile generated binders
        run: ./gradlew :sjf4j-testbench:compileJmhJava --no-daemon --console=plain
      - name: Copy generated binders
        shell: bash
        run: |
          mkdir -p generated-excerpt
          find sjf4j-testbench/build -name '*CompiledBinder*Impl.java' -print | head -60
          find sjf4j-testbench/build -name '*CompiledBinder*Impl.java' -path '*jmh*' -print0 | xargs -0 -r -n1 sh -c 'cp "$0" generated-excerpt/"$(basename "$0")"'
          ls -la generated-excerpt
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-read-generated-source
          path: generated-excerpt/
