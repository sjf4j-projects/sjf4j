name: Jackson2 POJO scalar A/B
on:
  push:
    branches:
      - perf/compiled-jackson-pojo-read
  workflow_dispatch:

jobs:
  jackson2-pojo-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Benchmark baseline and raw scalar implementation
        shell: bash
        run: |
          set -euo pipefail
          EXPERIMENT_SHA="$(git rev-parse HEAD)"
          BASELINE_SHA=378a925e214c47723d18b1ad9bfc924e2aa703cd
          for variant in baseline raw; do
            if [[ "$variant" == baseline ]]; then
              git checkout --detach "$BASELINE_SHA"
            else
              git checkout --detach "$EXPERIMENT_SHA"
            fi
            ./gradlew :sjf4j-testbench:clean :sjf4j-testbench:jmhJar --no-daemon --rerun-tasks
            java -jar sjf4j-testbench/build/libs/*-jmh.jar \
              '.*CompiledReadBenchmark.jackson2_pojo_(reversed_)?(string|utf8)_(compiled|runtime)' \
              -wi 5 -i 10 -w 500ms -r 500ms -f 2 -prof gc \
              -rf json -rff "jackson2-$variant.json" | tee "jackson2-$variant.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson2-pojo-ab
          path: |
            jackson2-baseline.json
            jackson2-baseline.log
            jackson2-raw.json
            jackson2-raw.log
          if-no-files-found: ignore
