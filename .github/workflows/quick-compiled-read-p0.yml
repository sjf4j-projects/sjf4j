name: Quick Compiled Read P0

on:
  push:
    branches:
      - perf/compiled-read-p0-fusion
    paths:
      - .github/workflows/quick-compiled-read-p0.yml

permissions:
  contents: read

jobs:
  read-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Run processor and testbench tests
        run: ./gradlew :sjf4j-processor:test :sjf4j-testbench:test --no-daemon --console=plain
      - name: Build JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
      - name: Run Fastjson2 compiled vs handwritten read
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '(.*CompiledReadBenchmark[.]json_fastjson2_pojo_(string|utf8)_(compiled|native)$|.*HandReadBenchmark[.]json_fastjson2_pojo_(handwritten|handwritten_hash|handwritten_raw|native)$)' \
            -f 1 -wi 3 -w 150ms -i 5 -r 250ms -t 1 \
            -rf json -rff fastjson2-read-p0.json | tee fastjson2-read-p0.txt
          test "$(grep -Ec '^(CompiledReadBenchmark|HandReadBenchmark)[.]json_fastjson2_pojo_.*avgt' fastjson2-read-p0.txt)" -eq 8
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-read-p0
          path: |
            fastjson2-read-p0.json
            fastjson2-read-p0.txt
          if-no-files-found: ignore
