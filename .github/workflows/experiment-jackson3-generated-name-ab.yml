name: Experiment / Jackson3 generated SerializedString same-run A/B

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-jackson3-generated-name-ab.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build pinned main baseline and optimized binder on same runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          ROOT="$PWD"
          BASE_SHA=501caabe3a197e37498b0854d3dbf98c24ce2790
          echo "baseline=$BASE_SHA" > results/commits.txt
          echo "optimized=$(git rev-parse HEAD)" >> results/commits.txt
          { java -version 2>&1; lscpu; } > results/environment.txt
          git worktree add --detach "$ROOT/../baseline" "$BASE_SHA"
          ( cd "$ROOT/../baseline" && ./gradlew --no-daemon :sjf4j-testbench:jmhJar )
          ./gradlew --no-daemon :sjf4j-testbench:jmhJar
          BASE_JAR=$(find "$ROOT/../baseline/sjf4j-testbench/build/libs" -maxdepth 1 -name '*-jmh.jar' -print -quit)
          OPT_JAR=$(find "$ROOT/sjf4j-testbench/build/libs" -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -s "$BASE_JAR"
          test -s "$OPT_JAR"
          printf '%s\n%s\n' "$BASE_JAR" "$OPT_JAR" > results/jar-paths.txt
          grep -R -q 'private static final Jackson3CompiledName ' "$ROOT/../baseline/sjf4j-testbench/build/generated"
          grep -R -q 'private static final SerializedString ' "$ROOT/sjf4j-testbench/build/generated"

      - name: Bench both generated implementations with identical CPU and JMH parameters
        shell: bash
        run: |
          set -euo pipefail
          BASE_JAR=$(sed -n '1p' results/jar-paths.txt)
          OPT_JAR=$(sed -n '2p' results/jar-paths.txt)
          bench='org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write'
          for arm in baseline optimized; do
            if [[ "$arm" == baseline ]]; then jar="$BASE_JAR"; else jar="$OPT_JAR"; fi
            java -jar "$jar" "$bench" \
              -p backend=jackson3 -p model=users -p shape=pojo \
              -p implementation=compiled,blackbird \
              -p sizeKb=1,10,100 -p seed=12345,324 \
              -f 3 -t 1 -wi 4 -i 5 -w 500ms -r 500ms -prof gc \
              -rf json -rff "results/$arm.json" \
              > "results/$arm.log" 2>&1 || { tail -100 "results/$arm.log"; exit 1; }
          done

      - name: Summarize baseline vs optimized generated Compiled binder
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/ab-ratios.md >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import json
          p=Path('results/baseline.json'); q=Path('results/optimized.json')
          print('## Jackson3 Users Compiled generated code A/B (same GitHub runner)')
          print()
          if not p.exists() or not q.exists():
              print('JMH results missing; inspect logs.')
              raise SystemExit(0)
          b=json.loads(p.read_text()); o=json.loads(q.read_text())
          print('| KB | Seed | Baseline compiled (us/op) | Native-field compiled (us/op) | Baseline / Optimized | Old Blackbird / Compiled | New Blackbird / Compiled |')
          print('| ---: | ---: | ---: | ---: | ---: | ---: | ---: |')
          for size in ('1','10','100'):
              for seed in ('12345','324'):
                  def scores(rows):
                      return {r['params']['implementation']:r['primaryMetric']['score']
                              for r in rows if r['params']['sizeKb']==size and r['params']['seed']==seed}
                  bb=scores(b); oo=scores(o)
                  if set(bb)!={'compiled','blackbird'} or set(oo)!={'compiled','blackbird'}:
                      raise SystemExit(f'Missing case {size}/{seed}: {bb} {oo}')
                  print(f"| {size} | {seed} | {bb['compiled']:.3f} | {oo['compiled']:.3f} | {bb['compiled']/oo['compiled']:.3f} | {bb['blackbird']/bb['compiled']:.3f} | {oo['blackbird']/oo['compiled']:.3f} |")
          print()
          print('Ratio >1 means the optimized generated binder is faster. Both builds and all JMH forks ran on one runner; runs are sequential.')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson3-generated-name-ab-${{ github.run_id }}
          path: results/
          retention-days: 14
