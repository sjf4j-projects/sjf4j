name: Experiment / Jackson3 C2 Write helper inlining

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-jackson3-write-c2.yml'

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    name: Jackson3 Users Write C2 inlining A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore the exact JMH jar from the latest full baseline
        uses: actions/download-artifact@v8
        with:
          name: binding-full-jmh-jar
          run-id: 44917024751
          github-token: ${{ github.token }}
          path: jmh
      - name: Run baseline and three C2 inlining experiments on the same runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { echo "Original JMH jar: full run 44917024751, commit 501caabe3a197e37498b0854d3dbf98c24ce2790"; lscpu; java -version 2>&1; } > results/environment.txt
          jar=$(find jmh -name '*-jmh.jar' -print -quit)
          test -n "$jar"
          sha256sum "$jar" > results/jmh-jar.sha256
          pattern='org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write'
          common=( -p backend=jackson3 -p model=users -p shape=pojo -p sizeKb=1,10,100 -p seed=12345,324 -t 1 -f 2 -wi 3 -i 4 -w 400ms -r 400ms -prof gc -rf json )
          for variant in baseline noinline-string noinline-pojo noinline-both; do
            case "$variant" in
              baseline) impl='native,blackbird,compiled'; commands=() ;;
              noinline-string) impl='compiled'; commands=(-jvmArgsAppend '-XX:CompileCommand=dontinline,org.sjf4j.testbench.binding.fabien.FabienBindings$Jackson3_Impl::_writeStringMember') ;;
              noinline-pojo) impl='compiled'; commands=(-jvmArgsAppend '-XX:CompileCommand=dontinline,org.sjf4j.testbench.binding.fabien.FabienBindings$Jackson3_Impl::_writeUser') ;;
              noinline-both) impl='compiled'; commands=(-jvmArgsAppend '-XX:CompileCommand=dontinline,org.sjf4j.testbench.binding.fabien.FabienBindings$Jackson3_Impl::_writeStringMember' -jvmArgsAppend '-XX:CompileCommand=dontinline,org.sjf4j.testbench.binding.fabien.FabienBindings$Jackson3_Impl::_writeUser') ;;
            esac
            echo "=== $variant (implementation=$impl) ==="
            java -jar "$jar" "$pattern" "${common[@]}" -p "implementation=$impl" "${commands[@]}" \
              -rff "results/$variant.json" 2>&1 | tee "results/$variant.log"
          done
      - name: Compare ratios and source-level hypothesis
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          variants = ['baseline', 'noinline-string', 'noinline-pojo', 'noinline-both']
          rows = {v: json.loads(Path(f'results/{v}.json').read_text()) for v in variants}
          def score(v, size, seed, impl='compiled'):
              found = [r for r in rows[v] if r['params']['sizeKb'] == size and r['params']['seed'] == seed and r['params']['implementation'] == impl]
              assert len(found) == 1, (v, size, seed, impl, len(found))
              return found[0]['primaryMetric']['score']
          assert len(rows['baseline']) == 18
          assert all(len(rows[v]) == 6 for v in variants[1:])
          print('## Jackson3 Users Write: C2 compilation shape experiment')
          print()
          print('Exact same prebuilt JMH jar and JDK 25 on one runner; 2 forks, each 3x400ms warmup + 4x400ms measurement.')
          print('Lower is better; BB/C and Native/C above 1 mean SJF4J wins.')
          print()
          print('| Size | Seed | Variant | Compiled µs | vs baseline (baseline/variant) | BB/Compiled | Native/Compiled |')
          print('| --- | --- | --- | ---: | ---: | ---: | ---: |')
          for sz in ['1','10','100']:
              for seed in ['12345','324']:
                  n = score('baseline',sz,seed,'native')
                  bb = score('baseline',sz,seed,'blackbird')
                  orig = score('baseline',sz,seed)
                  for v in variants:
                      c = score(v,sz,seed)
                      print(f'| {sz} KB | {seed} | {v} | {c:.3f} | {orig/c:.3f}x | {bb/c:.3f}x | {n/c:.3f}x |')
          PY
      - name: Save complete JMH outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-users-write-c2-ab
          path: results/
          retention-days: 7
          if-no-files-found: warn
