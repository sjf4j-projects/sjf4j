name: ObjectCursor Map POJO JOJO JMH experiment
on:
  pull_request:
    branches: [refactor/nodekind-value-codec-shapes]
    paths:
      - '.github/workflows/object-cursor-benchmark.yml'
      - 'sjf4j-core/src/main/java/org/sjf4j/node/NodeWalker.java'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/node/ObjectEntryTraversalBenchmark.java'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Run traversal A/B and GC allocations
        run: |
          JAR="$(find sjf4j-testbench/build/libs -name '*jmh.jar' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" 'org.sjf4j.testbench.node.ObjectEntryTraversalBenchmark.(entrySet|cursor)$' -wi 2 -i 4 -f 3 -w 500ms -r 500ms -prof gc -rf text -rff object-cursor-jmh.txt
          cat object-cursor-jmh.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: object-cursor-jmh-jdk17
          path: object-cursor-jmh.txt
