name: Temporary Creek Schema A/B JMH
on:
  push:
    branches: [refactor/schema-node-frame-fastfail]
    paths:
      - .github/workflows/creek-schema-ab-temp.yml

permissions:
  contents: read

jobs:
  creek:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch with baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build baseline and PR JMH jars
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/sjf4j-baseline" 41070c488151baf831ecf53beeb3beea92cad2d5
          cd "$RUNNER_TEMP/sjf4j-baseline"
          ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
          cd "$GITHUB_WORKSPACE"
          ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
      - name: Compare baseline and PR benchmark on same runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/creek-ab-results"
          regex='.*CreekSchemaBenchmark\.(schema_validate_map|schema_validate_pojo|jackson_round_trip|round_trip_validate)'
          for variant in baseline pr; do
            if [ "$variant" = baseline ]; then
              root="$RUNNER_TEMP/sjf4j-baseline"
            else
              root="$GITHUB_WORKSPACE"
            fi
            jar=$(find "$root/sjf4j-testbench/build/libs" -maxdepth 1 -type f -name '*jmh*.jar' | head -n 1)
            echo "VARIANT=$variant JAR=$jar"
            java -jar "$jar" "$regex" -f 2 -wi 15 -i 5 -w 400ms -r 400ms -prof gc \
              -rf json -rff "$GITHUB_WORKSPACE/creek-ab-results/$variant.json" \
              | tee "$GITHUB_WORKSPACE/creek-ab-results/$variant.txt"
          done
          python3 - <<'PY'
          import json
          for variant in ["baseline", "pr"]:
              data=json.load(open(f"creek-ab-results/{variant}.json"))
              print(f"=== {variant} ===")
              for item in data:
                  name=item["benchmark"].rsplit(".",1)[-1]
                  primary=item["primaryMetric"]
                  gc=item["secondaryMetrics"].get("·gc.alloc.rate.norm",{})
                  print(f"{name}: {primary['score']:.4f} us/op, error={primary['scoreError']:.4f}, B/op={gc.get('score','NA')}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creek-schema-ab-jmh
          path: creek-ab-results/
