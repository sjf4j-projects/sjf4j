name: Jackson3 Generated Native vs Handwritten (JDK 25)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build generated-native JMH and run correctness smoke
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/performance/jackson3-generated-vs-hand
          mkdir -p "$OUT"
          java -version 2> "$OUT/java.txt"
          lscpu > "$OUT/cpu.txt"
          ./gradlew :sjf4j-testbench:jmhJar \
            -Psjf4jJackson3NativePojo=true > "$OUT/build.log" 2>&1 || {
              tail -n 120 "$OUT/build.log"; exit 1
            }
          JAR="$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)"
          test -s "$JAR"
          java -cp "$JAR" \
            org.sjf4j.testbench.binding.fabien.FabienHandwrittenJackson3 \
            | tee "$OUT/hand-smoke.log"
          java -cp "$JAR" \
            org.sjf4j.testbench.binding.fabien.FabienJackson3NativeSmoke \
            | tee "$OUT/generated-smoke.log"
          GENERATED="$(find sjf4j-testbench/build/generated -type f \
            -name 'FabienBindings$Jackson3_Impl.java' -print -quit)"
          test -n "$GENERATED" && test -s "$GENERATED"
          grep -n -m 8 -F 'nextNameMatchAndToken(' "$GENERATED" > "$OUT/generated-native.txt"
          grep -Eq 'Native\([[:alnum:]_]+\.nativeParser\(\)\)' "$GENERATED"
      - name: Same-runner JMH Users POJO read
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/performance/jackson3-generated-vs-hand
          JAR="$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)"
          java -jar "$JAR" org.sjf4j.testbench.binding.fabien.FabienReadBenchmark.read \
            -p backend=jackson3 -p model=users -p shape=pojo \
            -p implementation=compiled,handwritten,blackbird,native \
            -p sizeKb=1,10,100 -p seed=12345,324 \
            -t 1 -f 3 -wi 3 -i 5 -w 400ms -r 400ms \
            -prof gc -rf json -rff "$OUT/raw.json" \
            > "$OUT/jmh.log" 2>&1 || { tail -n 120 "$OUT/jmh.log"; exit 1; }
          python3 - "$OUT" <<'PY'
          import csv, json, statistics, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          entries = json.loads((root / "raw.json").read_text())
          impls = ("compiled", "handwritten", "blackbird", "native")
          sizes = ("1", "10", "100")
          seeds = ("12345", "324")
          scores, means3, allocs = {}, {}, {}
          for entry in entries:
              p = entry["params"]
              key = (p["sizeKb"], p["seed"], p["implementation"])
              forks = [statistics.mean(f) for f in entry["primaryMetric"]["rawData"]]
              if len(forks) != 3:
                  raise SystemExit(f"Expected 3 forks for {key}, found {len(forks)}")
              scores[key] = statistics.mean(sorted(forks)[:2])
              means3[key] = statistics.mean(forks)
              allocs[key] = entry["secondaryMetrics"]["gc.alloc.rate.norm"]["score"]
          expected = {(size, seed, impl) for size in sizes for seed in seeds for impl in impls}
          if set(scores) != expected:
              raise SystemExit(f"Unexpected cases; missing={expected - set(scores)} extra={set(scores) - expected}")
          def geo(values):
              return statistics.geometric_mean(values)
          def score(size, impl):
              return geo(scores[(size, seed, impl)] for seed in seeds)
          def mean3(size, impl):
              return geo(means3[(size, seed, impl)] for seed in seeds)
          def alloc(size, impl):
              return statistics.mean(allocs[(size, seed, impl)] for seed in seeds)
          report = [
              "# Jackson3 Generated Native vs Handwritten (Users POJO Read)", "",
              "Jackson 3.3.0, JDK 25, byte[] input, same runner, identical test fixture and seed.",
              "Native Compiled enabled; standalone generated+handwritten correctness smoke passed.",
              "2 seeds x 3 forks; 3 x 400ms warmup, 5 x 400ms measurement; Best 2 Fork Mean.",
              "Ratios > 1 indicate faster denominator implementation.", "",
              "| Size | Generated µs/op | Handwritten µs/op | Blackbird µs/op | Native µs/op |",
              "| --- | ---: | ---: | ---: | ---: |",
          ]
          rows = []
          for size in sizes:
              g, h, b, n = (score(size, impl) for impl in impls)
              report.append(f"| {size}KB | {g:.3f} | {h:.3f} | {b:.3f} | {n:.3f} |")
              rows.append((size, g, h, b, n))
          report += [
              "", "## Best 2 Fork ratios", "",
              "| Size | Handwritten / Generated | Blackbird / Generated | Native / Generated |",
              "| --- | ---: | ---: | ---: |",
          ]
          for size, g, h, b, n in rows:
              report.append(f"| {size}KB | {h/g:.3f}x | {b/g:.3f}x | {n/g:.3f}x |")
          report += [
              "", "## Mean of all three forks: sensitivity check", "",
              "| Size | Handwritten / Generated | Blackbird / Generated |",
              "| --- | ---: | ---: |",
          ]
          for size in sizes:
              g = mean3(size, "compiled")
              report.append(f"| {size}KB | {mean3(size,'handwritten')/g:.3f}x | {mean3(size,'blackbird')/g:.3f}x |")
          report += [
              "", "## Normalized allocation (B/op)", "",
              "| Size | Generated | Handwritten | Blackbird | Native |",
              "| --- | ---: | ---: | ---: | ---: |",
          ]
          for size in sizes:
              values = [alloc(size, impl) for impl in impls]
              report.append(f"| {size}KB | {values[0]:.0f} | {values[1]:.0f} | {values[2]:.0f} | {values[3]:.0f} |")
          report += [
              "", "## Per-seed ratios", "",
              "| Size | Seed | Handwritten / Generated | Blackbird / Generated |",
              "| --- | --- | ---: | ---: |",
          ]
          for size in sizes:
              for seed in seeds:
                  g = scores[(size, seed, "compiled")]
                  h = scores[(size, seed, "handwritten")]
                  b = scores[(size, seed, "blackbird")]
                  report.append(f"| {size}KB | {seed} | {h/g:.3f}x | {b/g:.3f}x |")
          with (root / "comparison.csv").open("w", newline="") as f:
              writer = csv.writer(f)
              writer.writerow(["sizeKb", "generated_us", "handwritten_us", "blackbird_us", "native_us",
                               "hand_over_generated", "blackbird_over_generated", "native_over_generated",
                               "generated_alloc_B", "hand_alloc_B", "blackbird_alloc_B", "native_alloc_B"])
              for size, g, h, b, n in rows:
                  writer.writerow([size, g, h, b, n, h/g, b/g, n/g,
                                   *[alloc(size, impl) for impl in impls]])
          (root / "comparison.md").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PY
      - name: Publish summary
        if: always()
        run: |
          REPORT=build/performance/jackson3-generated-vs-hand/comparison.md
          if test -s "$REPORT"; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-generated-vs-hand
          path: build/performance/jackson3-generated-vs-hand/
          if-no-files-found: warn
          retention-days: 30
