name: Inspect compiled write codegen

on:
  push:
    branches:
      - perf/write-direct-wrapped-diagnostics

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate JMH binding classes
        run: ./gradlew :sjf4j-testbench:compileJmhJava --no-daemon
      - name: Print generated Jackson write implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('sjf4j-testbench/build').rglob('*CompiledWriteBenchmark*Impl.java'))
          print('Generated candidates:', [str(p) for p in files])
          if not files:
              files = [p for p in Path('sjf4j-testbench/build/generated').rglob('*.java') if 'CompiledWriteBenchmark' in str(p)]
          for p in files:
              content = p.read_text()
              print(f'===== {p} ({len(content)} bytes) =====')
              lines = content.splitlines()
              for idx, line in enumerate(lines):
                  if 'writePojo(' in line or 'writePojoUtf8(' in line or 'void _writeUser(' in line or 'void _writeAddress(' in line or 'void _writeFriend(' in line or 'void _writeList' in line or 'private static void _writeString' in line:
                      a=max(0,idx-3); b=min(len(lines),idx+110)
                      print(f'----- excerpt {a+1}..{b} -----')
                      print('\\n'.join(f'{k+1:05d} {lines[k]}' for k in range(a,b)))
          if not files: raise SystemExit('No generated benchmark sources found')
          PY
