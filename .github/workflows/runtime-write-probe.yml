name: Runtime write probe (one-off)

on:
  push:
    branches: [bench/runtime-write-diagnosis-20261010]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Build benchmark
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Measure write paths
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$JAR"
          java -jar "$JAR" '.*RuntimeWriteProbeBenchmark.*' -f 2 -wi 3 -i 5 -w 250ms -r 250ms -prof gc -rf json -rff write-probe.json 2>&1 | tee write-probe.log
      - name: Summary
        if: success()
        run: |
          python3 - <<'PY'
          import json
          with open("write-probe.json") as f:
              records=json.load(f)
          print("PROBE_WRITE_RESULTS,method,us/op,B/op")
          for x in sorted(records,key=lambda x:x["benchmark"]):
              name=x["benchmark"].rsplit(".",1)[-1]
              value=x["primaryMetric"]["score"]
              alloc=x.get("secondaryMetrics",{}).get("gc.alloc.rate.norm",{}).get("score",float("nan"))
              print(f"PROBE_WRITE_RESULTS,{name},{value:.4f},{alloc:.1f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-write-probe-results
          path: |
            write-probe.json
            write-probe.log
          if-no-files-found: warn
