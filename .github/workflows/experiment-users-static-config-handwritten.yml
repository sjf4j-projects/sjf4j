name: Experiment / Users handwritten compile-time NodeConfig removal A/B

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-users-static-config-handwritten.yml'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/FabienManualUsersWriter.java'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/FabienManualUsersBenchmark.java'

permissions:
  contents: read

jobs:
  benchmark:
    name: JDK25 / Users handwritten dynamic vs static vs fixed
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Measure Users POJO only on same runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { lscpu; java -version 2>&1; git rev-parse HEAD; } > results/environment.txt
          jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$jar"
          sha256sum "$jar" > results/jar.sha256
          common=( 'org.sjf4j.testbench.binding.fabien.FabienManualUsersBenchmark.write'
            -p sizeKb=1,10,100 -p seed=12345,324
            -t 1 -f 2 -wi 3 -i 4 -w 350ms -r 350ms -prof gc -rf json )
          # Jackson3 matches SJF4J's already-selected String-member helper mode.
          java -jar "$jar" "${common[@]}" -p backend=jackson3 \
            -p implementation=blackbird,compiled,manual-member-runtime,manual-member-static-config,manual-member-fixed \
            -rff results/jackson3.json > results/jackson3.log 2>&1
          # Fastjson2 retains the already-selected inline String field mode.
          java -jar "$jar" "${common[@]}" -p backend=fastjson2 \
            -p implementation=native,compiled,manual-runtime,manual-static-config,manual-fixed \
            -rff results/fastjson2.json > results/fastjson2.log 2>&1
      - name: Summarize performance ratios
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("## Users POJO Write only — handwritten runtime injection vs compile-time fixed")
          print("JDK25 same host, 2 forks, 3x350ms warmup, 4x350ms measurement per fork, 2 seeds. JMH setup checks JSON equivalence for all variants.")
          print("All variants use includeNulls=true. Dynamic=volatile NodeConfig; static=static final NodeConfig via same helper graph; fixed=no config parameter and no nullable-property branch.")
          print("Ratios are dynamic mean latency / candidate mean latency: >1 means candidate faster. Allocations are fixed-vs-dynamic byte/op.")
          print()
          print("| Backend | KB | Seed | Native/BB vs Compiled | Dynamic µs/op | Static µs/op | Fixed µs/op | Dynamic/Static | Dynamic/Fixed | Fixed−Dynamic B/op |")
          print("| --- | --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |")
          for backend in ("jackson3", "fastjson2"):
              rows=json.loads(Path(f"results/{backend}.json").read_text())
              assert len(rows)==30, (backend,len(rows))
              dynamic="manual-member-runtime" if backend=="jackson3" else "manual-runtime"
              static="manual-member-static-config" if backend=="jackson3" else "manual-static-config"
              fixed="manual-member-fixed" if backend=="jackson3" else "manual-fixed"
              native="blackbird" if backend=="jackson3" else "native"
              for kb in ("1","10","100"):
                  for seed in ("12345","324"):
                      d={r["params"]["implementation"]:r for r in rows if r["params"]["sizeKb"]==kb and r["params"]["seed"]==seed}
                      assert len(d)==5,(backend,kb,seed,len(d))
                      score=lambda k:d[k]["primaryMetric"]["score"]
                      mem=lambda k:d[k]["secondaryMetrics"]["gc.alloc.rate.norm"]["score"]
                      print(f"| {backend} | {kb} | {seed} | {score(native)/score('compiled'):.3f}x | {score(dynamic):.3f} | {score(static):.3f} | {score(fixed):.3f} | {score(dynamic)/score(static):.3f}x | {score(dynamic)/score(fixed):.3f}x | {mem(fixed)-mem(dynamic):+.0f} |")
          PY
      - name: Upload data and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-handwritten-static-config-ab
          path: results/
          retention-days: 7
          if-no-files-found: warn
