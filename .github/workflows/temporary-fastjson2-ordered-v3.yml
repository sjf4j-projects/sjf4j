name: Temporary Fastjson2 Matcher Raw Ordered Retest V3
on:
  push:
    branches:
      - perf/fastjson2-matcher-raw-all-fields
    paths:
      - .github/workflows/temporary-fastjson2-ordered-v3.yml
permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Test candidate
        run: ./gradlew :sjf4j-backend-fastjson2:test :sjf4j-processor:test :sjf4j-testbench:test --no-daemon --console=plain
      - name: Build paired identical JMH harnesses
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/fj2-base 8ca7088acb90606c0218a2c78ebc5b8319c29a06
          git worktree add --detach /tmp/fj2-candidate HEAD
          cp sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/compiled/CompiledReadBenchmark.java /tmp/fj2-base/sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/compiled/CompiledReadBenchmark.java
          (cd /tmp/fj2-base && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
          (cd /tmp/fj2-candidate && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
      - name: Run A-B-B-A JMH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for tag in base-1 candidate-1 candidate-2 base-2; do
            rev="${tag%-*}"
            echo "::group::JMH ${tag}"
            java -jar /tmp/fj2-${rev}/sjf4j-testbench/build/libs/*-jmh.jar \
              '.*CompiledReadBenchmark[.]json_fastjson2_pojo_string_(compiled|runtime)$' \
              -f 1 -wi 6 -w 350ms -i 10 -r 400ms -t 1 \
              -rf json -rff results/${tag}.json | tee results/${tag}.txt
            echo "::endgroup::"
          done
      - name: Summarize results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          groups={}
          for tag in ['base-1','candidate-1','candidate-2','base-2']:
              data=json.loads(Path('results',tag+'.json').read_text())
              assert len(data)==2,(tag,len(data))
              for row in data:
                  key='runtime' if row['benchmark'].endswith('_runtime') else 'compiled'
                  groups.setdefault(key,{})[tag]=row['primaryMetric']['score']
          lines=['case,base-1,candidate-1,candidate-2,base-2,baseline_mean,candidate_mean,delta_pct']
          for key,s in sorted(groups.items()):
              baseline=(s['base-1']+s['base-2'])/2
              candidate=(s['candidate-1']+s['candidate-2'])/2
              delta=(candidate/baseline-1)*100
              line=f"{key},{s['base-1']:.6f},{s['candidate-1']:.6f},{s['candidate-2']:.6f},{s['base-2']:.6f},{baseline:.6f},{candidate:.6f},{delta:+.2f}"
              print(line)
              lines.append(line)
          Path('results/summary.csv').write_text('\n'.join(lines)+'\n')
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-ordered-retest
          path: results/
          if-no-files-found: ignore
