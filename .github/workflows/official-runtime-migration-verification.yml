name: Official Runtime Migration Verification

on:
  pull_request:
    paths:
      - 'sjf4j-testbench/build.gradle.kts'
      - 'sjf4j-testbench/src/test/java/org/sjf4j/testbench/schema/official/**'
      - '.github/workflows/official-runtime-migration-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify unified test layout and compatibility unit tests
        run: |
          ./gradlew :sjf4j-testbench:test \
            --tests org.sjf4j.testbench.schema.official.OfficialCompatibilityTest \
            --tests org.sjf4j.testbench.schema.official.OfficialRuntimeSuiteLayoutTest
      - name: Download upstream official test suites
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :sjf4j-testbench:downloadOfficialSchemaTests
      - name: Verify Runtime official validation suite
        run: ./gradlew :sjf4j-testbench:officialRuntimeTest
