name: Record and JOJO write validation (one-off)

on:
  push:
    branches: [fix/record-components-jojo-write-bench-20261010]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Test Record semantics and compile JMH
        run: ./gradlew :sjf4j-testbench:test --tests '*RecordPropertySerializationTest' :sjf4j-testbench:jmhJar --no-daemon
      - name: Run JOJO write smoke benchmark
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$JAR"
          java -jar "$JAR" '.*JojoWriteBenchmark.*' \
            -f 1 -wi 2 -i 3 -w 150ms -r 150ms \
            -prof gc -rf json -rff jojo-write-results.json \
            2>&1 | tee jojo-write-output.txt
      - name: Summarize
        if: success()
        run: |
          python3 - <<'PY'
          import json
          with open('jojo-write-results.json') as f:
              records=json.load(f)
          print('JOJO_WRITE_RESULTS,method,workload,us/op,B/op')
          for x in sorted(records, key=lambda z:(z['params']['workload'],z['benchmark'])):
              name=x['benchmark'].rsplit('.',1)[-1]
              score=x['primaryMetric']['score']
              alloc=x.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan'))
              print(f'JOJO_WRITE_RESULTS,{name},{x["params"]["workload"]},{score:.4f},{alloc:.1f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jojo-write-smoke-results
          path: |
            jojo-write-results.json
            jojo-write-output.txt
          if-no-files-found: warn
