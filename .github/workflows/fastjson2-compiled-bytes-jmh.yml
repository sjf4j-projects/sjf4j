name: Fastjson2 compiled bytes quick JMH
on:
  push:
    branches:
      - perf/compiled-fastjson2-write-bytes
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build benchmark
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Measure compiled native runtime
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledWriteBenchmark.json_fastjson2_(pojo|map)_utf8_(compiled|native|runtime|handwritten_streaming|handwritten_serialized)' \
            -wi 3 -i 5 -w 300ms -r 500ms -f 1 -prof gc \
            -rf json -rff fastjson2-bytes.json | tee fastjson2-bytes.log
      - name: Name dispatch A/B
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \\
            '.*Fastjson2NameDispatchBenchmark.*' \\
            -wi 3 -i 5 -w 300ms -r 500ms -f 1 -prof gc | tee fastjson2-name-dispatch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastjson2-bytes
          path: |
            fastjson2-bytes.json
            fastjson2-bytes.log
            fastjson2-name-dispatch.log
          if-no-files-found: ignore
