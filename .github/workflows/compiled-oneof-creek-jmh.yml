name: Compiled oneOf Creek JMH
on:
  push:
    branches: [feat/compiled-validator-direct-evaluation]
jobs:
  jmh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Build benchmark jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Benchmark full Creek model (3 forks)
        run: |
          JMH_JAR=$(find sjf4j-testbench/build/libs -name '*jmh*.jar' -print -quit)
          java -cp "$JMH_JAR" org.openjdk.jmh.Main 'org.sjf4j.testbench.schema.CreekSchemaBenchmark\\.(compiled_schema_is_valid_pojo|schema_is_valid_pojo|schema_is_valid_map)$' \
            -f 3 -wi 3 -i 5 -w 300ms -r 300ms -bm avgt -tu us -prof gc
