name: Direct parity JMH verification

on:
  push:
    branches:
      - perf/direct-field-order-null-policy-parity

permissions:
  contents: read

jobs:
  direct-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH and verify annotation processor
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Run aligned Direct and Compiled comparisons
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*CompiledWriteBenchmark\.json_jackson[23]_pojo_(string|utf8)_(compiled|direct|direct_wrapped)' \
            -bm avgt -tu us -t 1 -f 3 -wi 5 -w 250ms -i 5 -r 250ms \
            -prof gc -rf json -rff direct-parity-results.json | tee direct-parity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-parity-jmh
          path: |
            direct-parity-results.json
            direct-parity.log
          if-no-files-found: warn
