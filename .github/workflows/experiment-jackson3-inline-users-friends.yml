name: Experiment / Jackson3 inline Users friends list

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-jackson3-inline-users-friends.yml'
      - 'sjf4j-processor/src/main/java/org/sjf4j/processor/binding/StructuralWriteEmitter.java'
      - 'sjf4j-processor/src/main/java/org/sjf4j/processor/binding/JacksonWriteEmitter.java'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/**'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build generated compiled binder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/generated
          { git rev-parse HEAD; java -version 2>&1; lscpu; } > results/environment.txt
          ./gradlew --no-daemon :sjf4j-testbench:jmhJar
          jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -s "$jar"
          echo "$jar" > results/jar-path.txt
          find sjf4j-testbench/build/generated -name '*IncrementalUsersWriteBenchmark*Compiled_Impl.java' -exec cp {} results/generated/ \;
          grep -R -q 'inlineList' results/generated/
          grep -R -q '_writeFriend' results/generated/
      - name: Stage08 versus Stage09
        shell: bash
        run: |
          set -euo pipefail
          jar=$(cat results/jar-path.txt)
          java -jar "$jar" 'org.sjf4j.testbench.binding.fabien.IncrementalUsersWriteBenchmark.write' \
            -p stage=8,9 -p implementation=native,blackbird,compiled \
            -p sizeKb=1 -p seed=12345,324 \
            -f 3 -t 1 -wi 4 -i 5 -w 500ms -r 500ms -prof gc \
            -rf json -rff results/stage08-09.json > results/stage08-09.log 2>&1 || {
              tail -100 results/stage08-09.log; exit 1;
            }
      - name: Original Users Write full size control
        shell: bash
        run: |
          set -euo pipefail
          jar=$(cat results/jar-path.txt)
          java -jar "$jar" 'org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write' \
            -p backend=jackson3 -p model=users -p shape=pojo \
            -p implementation=native,blackbird,compiled \
            -p sizeKb=1,10,100 -p seed=12345,324 \
            -f 2 -t 1 -wi 3 -i 4 -w 500ms -r 500ms -prof gc \
            -rf json -rff results/original-users.json > results/original-users.log 2>&1 || {
              tail -100 results/original-users.log; exit 1;
            }
      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo '## Jackson3 inline List<Friend> experiment'
            echo
            echo 'Blackbird / Compiled > 1 favors Compiled. Compare to #391 baseline on same runner class.'
            python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (Path('results/stage08-09.json'),Path('results/original-users.json')):
              if not path.exists(): continue
              rows=json.loads(path.read_text())
              print('### '+path.name)
              print('| Stage | KB | Seed | Native / Compiled | Blackbird / Compiled | Compiled B/op | Blackbird B/op |')
              print('| --- | ---: | ---: | ---: | ---: | ---: | ---: |')
              keys=sorted(set((r['params'].get('stage','original'),r['params']['sizeKb'],r['params']['seed']) for r in rows),
                          key=lambda k:(k[0],int(k[1]),k[2]))
              for stage,size,seed in keys:
                  s={r['params']['implementation']:r for r in rows
                     if r['params'].get('stage','original')==stage and r['params']['sizeKb']==size and r['params']['seed']==seed}
                  if len(s)!=3: raise SystemExit('Missing '+str((stage,size,seed,s)))
                  score={k:v['primaryMetric']['score'] for k,v in s.items()}
                  alloc={k:v['secondaryMetrics']['gc.alloc.rate.norm']['score'] for k,v in s.items()}
                  print(f"| {stage} | {size} | {seed} | {score['native']/score['compiled']:.3f}x | {score['blackbird']/score['compiled']:.3f}x | {alloc['compiled']:.0f} | {alloc['blackbird']:.0f} |")
              print()
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive raw results and APT code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-inline-friends-${{ github.run_id }}
          path: results/
          retention-days: 14
          if-no-files-found: warn
