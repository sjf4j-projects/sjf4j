name: Experiment / cross-backend handwritten String member helper shapes

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-dual-backend-string-member-helpers.yml'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/FabienManualUsersWriter.java'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/FabienManualUsersBenchmark.java'

permissions:
  contents: read

jobs:
  benchmark:
    name: Common String member helper A/B, Jackson3 and Fastjson2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Compile handwritten JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Compare both backends on the same JDK and runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { echo "Head: $GITHUB_SHA"; lscpu; java -version 2>&1; } > results/environment.txt
          jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$jar"
          common=( 'org.sjf4j.testbench.binding.fabien.FabienManualUsersBenchmark.write' \
            -p sizeKb=1,10,100 -p seed=12345,324 -t 1 -f 2 \
            -wi 2 -i 3 -w 300ms -r 300ms -prof gc -rf json )
          for backend in fastjson2 jackson3; do
            if [ "$backend" = jackson3 ]; then
              impls='native,blackbird,compiled,manual-runtime,manual-fixed,manual-member-runtime,manual-member-fixed'
            else
              impls='native,compiled,manual-runtime,manual-fixed,manual-member-runtime,manual-member-fixed'
            fi
            java -jar "$jar" "${common[@]}" -p backend="$backend" -p implementation="$impls" \
              -rff "results/$backend.json" 2>&1 | tee "results/$backend.log"
          done
      - name: Summarize paired String member helper strategies
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## Handwritten String member helper patterns: Fastjson2 and Jackson3')
          print()
          print('All variants on one JDK25 runner. Full JSON equivalence is checked by every JMH trial. Each backend uses its own native name/write methods and matching output lifecycle.')
          print('2x2 factor: inline per-field nullable String logic vs separate String member helpers; runtime NodeConfig.includeNulls vs compile-time fixed true. Both backends share method-organization pattern but use native prepared-name APIs. Lower latency is better.')
          print()
          print('| Backend | Size | Seed | Native | Blackbird | Compiled | Manual runtime | Manual fixed | Member runtime | Member fixed | Compiled / fastest manual | Fastest manual |')
          print('|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---|')
          for backend in ['fastjson2','jackson3']:
              rows=json.loads(Path(f'results/{backend}.json').read_text())
              expected=36 if backend=='fastjson2' else 42
              assert len(rows)==expected,(backend,len(rows),expected)
              for size in ['1','10','100']:
                  for seed in ['12345','324']:
                      d={r['params']['implementation']:r['primaryMetric']['score'] for r in rows if r['params']['sizeKb']==size and r['params']['seed']==seed}
                      m=['manual-runtime','manual-fixed','manual-member-runtime','manual-member-fixed']
                      best=min(m,key=lambda x:d[x])
                      fmt=lambda x:f'{d[x]:.3f}' if x in d else '—'
                      print(f"| {backend} | {size}KB | {seed} | {fmt('native')} | {fmt('blackbird')} | {fmt('compiled')} | {fmt('manual-runtime')} | {fmt('manual-fixed')} | {fmt('manual-member-runtime')} | {fmt('manual-member-fixed')} | {d['compiled']/d[best]:.3f}x | {best} |")
          print()
          print('**A/B interpretation**: compare manual-runtime vs manual-member-runtime to isolate the String-member helper boundary, and manual-fixed vs manual-member-fixed for compile-time fixed null policy. Backend-specific name/value emission remains native.')
          PY
      - name: Upload raw benchmark/GC and validated output logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-backend-string-member-helpers-ab
          path: results/
          if-no-files-found: warn
          retention-days: 7
