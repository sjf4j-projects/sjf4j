name: Temporary ref-inline JMH A/B
on:
  push:
    branches: [refactor/schema-node-frame-fastfail]
    paths:
      - .github/workflows/schema-ref-ab-temp.yml
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build scoped-only and ref-inline versions with identical benchmark
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/sjf4j-scoped" c7fcbb0af12b7cbbb50d348e73d1685cea9c3513
          file="sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/schema/CreekSchemaBenchmark.java"
          cp "$GITHUB_WORKSPACE/$file" "$RUNNER_TEMP/sjf4j-scoped/$file"
          (cd "$RUNNER_TEMP/sjf4j-scoped" && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
          ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
      - name: Compare Creek paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p schema-ref-results
          regex='.*CreekSchemaBenchmark\.(schema_validate_map|schema_validate_pojo|schema_is_valid_map|schema_is_valid_pojo|round_trip_validate|round_trip_is_valid)'
          for variant in scoped ref-inline; do
            if [ "$variant" = scoped ]; then root="$RUNNER_TEMP/sjf4j-scoped"; else root="$GITHUB_WORKSPACE"; fi
            jar=$(find "$root/sjf4j-testbench/build/libs" -maxdepth 1 -type f -name '*jmh*.jar' | head -n 1)
            java -jar "$jar" "$regex" -f 2 -wi 15 -i 5 -w 300ms -r 300ms -prof gc \
              -rf json -rff "$GITHUB_WORKSPACE/schema-ref-results/$variant.json" \
              | tee "$GITHUB_WORKSPACE/schema-ref-results/$variant.txt"
          done
          python3 - <<'PY'
          import json
          for variant in ("scoped","ref-inline"):
              records=json.load(open(f"schema-ref-results/{variant}.json"))
              print(f"=== {variant} ===")
              for r in records:
                  name=r["benchmark"].rsplit(".",1)[-1]
                  p=r["primaryMetric"]
                  alloc=next((v["score"] for k,v in r["secondaryMetrics"].items() if k.endswith("gc.alloc.rate.norm")),None)
                  print(f"{name}: {p['score']:.5f} +/- {p['scoreError']:.5f} us/op, {alloc:.2f} B/op")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-ref-ab-jmh
          path: schema-ref-results/
