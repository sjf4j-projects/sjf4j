          for name in missing_a[:10]: print(f'  added {name}')
          for name in missing_b[:10]: print(f'  removed {name}')
          for name in changed[:5]:
              print(f'  changed {name}')
              d = difflib.unified_diff(a[name].decode('utf-8').splitlines(),
                                       b[name].decode('utf-8').splitlines(),
                                       fromfile='main/'+name, tofile='refactor/'+name, lineterm='')
              for i, line in enumerate(d):
                  if i == 100: break
                  print(line)
          if not a or missing_a or missing_b or changed: sys.exit(1)
          print('PASS: all generated Java sources are byte-identical')
          PY
