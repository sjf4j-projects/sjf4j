name: Jackson2 ReadEmitter Generated Source Parity
on:
  push:
    branches:
      - experiment/jackson2-read-emitter-parity-20261102
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      BASE_SHA: bfceecd099de2eb3d70e69beca93d73e7ed7b226
      VARIANT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile baseline generated sources
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          ./gradlew :sjf4j-processor:clean :sjf4j-testbench:clean :sjf4j-testbench:compileTestJava :sjf4j-testbench:compileJmhJava --no-daemon
          mkdir -p "$RUNNER_TEMP/parity/base"
          cp -a sjf4j-testbench/build/generated/. "$RUNNER_TEMP/parity/base/"
          echo "Baseline sources: $(find "$RUNNER_TEMP/parity/base" -name '*.java' | wc -l)"
      - name: Compile refactored generated sources
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$VARIANT_SHA"
          ./gradlew :sjf4j-processor:clean :sjf4j-testbench:clean :sjf4j-testbench:compileTestJava :sjf4j-testbench:compileJmhJava --no-daemon
          mkdir -p "$RUNNER_TEMP/parity/variant"
          cp -a sjf4j-testbench/build/generated/. "$RUNNER_TEMP/parity/variant/"
          echo "Refactor sources: $(find "$RUNNER_TEMP/parity/variant" -name '*.java' | wc -l)"
      - name: Compare generated Java sources (ignore MapStruct build timestamps)
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'parity'
          def load(name):
              folder = root / name
              return {p.relative_to(folder).as_posix(): p.read_bytes() for p in folder.rglob('*.java')}
          def normalized(path, data):
              # Only MapStruct @Generated date= is intentionally nondeterministic.
              if path.endswith('$MapStructMapperImpl.java'):
                  return bytes(10).join(line for line in data.splitlines()
                                        if not line.strip().startswith(b'date = '))
              return data
          base, variant = load('base'), load('variant')
          missing = sorted(base.keys() ^ variant.keys())
          changed = [p for p in sorted(base.keys() & variant.keys())
                     if normalized(p, base[p]) != normalized(p, variant[p])]
          print('Baseline files:', len(base))
          print('Refactor files:', len(variant))
          print('Missing / added:', missing[:15])
          print('Changed:', changed[:15])
          if not base or missing or changed:
              sys.exit(1)
          print('PASS: all generated Java outputs are identical except MapStruct generation dates')
          PY
