name: Fastjson2 runtime dispatch probe

on:
  push:
    branches: [bench/diagnose-fastjson2-runtime-20261010]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Build JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Measure identical 16-field JSON pathways
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$JAR"
          java -jar "$JAR" '.*Fastjson2RuntimeProbeBenchmark.*' \
            -f 2 -wi 4 -i 5 -w 300ms -r 300ms \
            -prof gc -rf json -rff fastjson2-dispatch-probe.json \
            2>&1 | tee fastjson2-dispatch-probe.txt
      - name: Summary
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open('fastjson2-dispatch-probe.json') as f:
              records=json.load(f)
          print('PROBE_RESULTS method,us/op,B/op')
          for item in sorted(records,key=lambda x:x['benchmark']):
              metric=item['primaryMetric']
              alloc=item.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan'))
              print('%s,%.4f,%.1f' %(item['benchmark'].rsplit('.',1)[-1], metric['score'], alloc))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastjson2-runtime-dispatch-probe
          path: |
            fastjson2-dispatch-probe.json
            fastjson2-dispatch-probe.txt
          if-no-files-found: warn
