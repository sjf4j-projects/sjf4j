name: Creek Runtime Diagnosis

on:
  pull_request:
    branches: [main]
    paths:
      - 'sjf4j-core/src/main/**'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/runtime/CreekRuntimeDiagnosisBenchmark.java'
      - '.github/workflows/creek-runtime-diagnosis.yml'

jobs:
  runtime-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Measure full Creek runtime versus Jackson with varying OneOf counts
        run: |
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CreekRuntimeDiagnosisBenchmark[.]creek_.*' \
            -p polyCount=0,1,4,8 -f 1 -wi 4 -w 300ms -i 6 -r 300ms -t 1 \
            -prof gc -rf json -rff creek-runtime-counts.json | tee creek-runtime-counts.txt
      - name: Measure isolated Runtime OneOf overhead vs same concrete subtype
        run: |
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CreekRuntimeDiagnosisBenchmark[.]subtype_.*' \
            -p polyCount=0 -f 1 -wi 5 -w 300ms -i 8 -r 300ms -t 1 \
            -prof gc -rf json -rff creek-runtime-subtypes.json | tee creek-runtime-subtypes.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creek-runtime-diagnosis
          path: |
            creek-runtime-counts.json
            creek-runtime-counts.txt
            creek-runtime-subtypes.json
            creek-runtime-subtypes.txt
          if-no-files-found: warn
