name: Creek JMH smoke (temporary)

on:
  push:
    branches: ["bench/creek-fastjson2-comparison"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Compile benchmark and annotation-processed binders
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Validate Creek JMH trial
        run: java -jar sjf4j-testbench/build/libs/*-jmh.jar 'CreekModelBenchmark.read_fastjson2_compiled' -wi 0 -i 1 -r 100ms -f 0 -t 1 -foe true
