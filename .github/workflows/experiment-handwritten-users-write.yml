name: Experiment / Fastjson2 handwritten native String List

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-handwritten-users-write.yml'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/FabienManualUsersWriter.java'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/FabienManualUsersBenchmark.java'

permissions:
  contents: read

jobs:
  benchmark:
    name: Fastjson2 handwritten String List A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build hand-written JMH experiment
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Benchmark Fastjson2 native String List API and null specialization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { echo "Commit: $GITHUB_SHA"; lscpu; java -version 2>&1; } > results/environment.txt
          jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$jar"
          common=( 'org.sjf4j.testbench.binding.fabien.FabienManualUsersBenchmark.write' \
            -p sizeKb=1,10,100 -p seed=12345,324 -t 1 -f 2 -wi 3 -i 3 -w 400ms -r 400ms \
            -prof gc -rf json )
          java -jar "$jar" "${common[@]}" \
            -p backend=fastjson2 -p implementation=native,compiled,manual-runtime,manual-fixed,manual-fixed-native-list \
            -rff results/fastjson2.json 2>&1 | tee results/fastjson2.log
      - name: Report comparison and overhead
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## Fastjson2 Users POJO Write — native String List optimization')
          print()
          print('Same JDK25 Runner, 2 forks, both seeds. JSON output equivalence checked in JMH Setup.')
          print('Manual fixed vs manual fixed native List differ only in `tags` serialization: explicit loop vs JSONWriterUTF8.writeString(List<String>).')
          print('Lower µs/op is better.')
          print()
          print('| KB | Seed | Native | Compiled | Hand runtime | Hand fixed loop | Hand fixed native List | List speedup | Native/native List | Compiled/native List |')
          print('|---:|---|---:|---:|---:|---:|---:|---:|---:|')
          rows=json.loads(Path('results/fastjson2.json').read_text())
          for size in ['1','10','100']:
              for seed in ['12345','324']:
                  d={r['params']['implementation']:r['primaryMetric']['score'] for r in rows if r['params']['sizeKb']==size and r['params']['seed']==seed}
                  assert len(d)==5,(size,seed,d)
                  n,c,hr,h,hl=(d[x] for x in ['native','compiled','manual-runtime','manual-fixed','manual-fixed-native-list'])
                  print(f'| {size} | {seed} | {n:.3f} | {c:.3f} | {hr:.3f} | {h:.3f} | {hl:.3f} | {h/hl:.3f}x | {n/hl:.3f}x | {c/hl:.3f}x |')
          PY
      - name: Upload benchmark JSON, logs and runner information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-manual-native-list-ab
          path: results/
          retention-days: 7
          if-no-files-found: warn
