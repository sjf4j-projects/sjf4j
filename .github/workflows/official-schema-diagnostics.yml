name: Official schema diagnostics

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/official-schema-diagnostics.yml']

permissions:
  contents: read

jobs:
  schema:
    name: Official ${{ matrix.suite }} (JDK 25)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [Runtime, Compiled]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Download official JSON Schema tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :sjf4j-testbench:downloadOfficialSchemaTests
      - name: Run official suite
        run: ./gradlew :sjf4j-testbench:official${{ matrix.suite }}Test
      - name: Upload compiled report
        if: ${{ always() && matrix.suite == 'Compiled' }}
        uses: actions/upload-artifact@v4
        with:
          name: official-compiled-diagnostics
          path: sjf4j-testbench/build/reports/officialCompiled/
          if-no-files-found: warn
