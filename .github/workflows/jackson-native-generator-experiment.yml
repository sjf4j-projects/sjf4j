name: Compiled native writer experiment
on:
  push:
    branches:
      - perf/jackson-native-generator-experiment
  workflow_dispatch:
jobs:
  native-write:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and regression
        run: ./gradlew :sjf4j-core:test :sjf4j-backend-jackson2:test :sjf4j-backend-jackson3:test :sjf4j-backend-fastjson2:test :sjf4j-backend-gson:test :sjf4j-backend-jsonp:test :sjf4j-backend-snake:test :sjf4j-processor:test :sjf4j-testbench:jmhJar --no-daemon
      - name: Compare native JSON backends
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledWriteBenchmark.json_(jackson[23]|gson|jsonp|fastjson2|simple)_pojo_(string|utf8)_(compiled|native|blackbird|runtime)' \
            -wi 5 -i 7 -w 250ms -r 300ms -f 1 -prof gc | tee native-write.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-native-write
          path: native-write.log
          if-no-files-found: ignore
