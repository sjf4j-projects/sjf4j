name: Jackson3 Input Source Compile-time Selection Paired A/B

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/jackson3-input-source-ab.yml'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/FabienJackson3InputBenchmark.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compare wrapper and input-selected Native on one runner
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/performance/jackson3-input-source
          mkdir -p "$OUT"
          java -version 2> "$OUT/jdk.txt"
          lscpu > "$OUT/cpu.txt"
          for enabled in false true; do
            label=wrapper
            if [[ "$enabled" == true ]]; then label=native; fi
            ./gradlew :sjf4j-testbench:jmhJar --rerun-tasks \
              "-Psjf4jJackson3NativePojo=$enabled" \
              -Psjf4jJackson3HybridPojo=false \
              > "$OUT/build-$label.log" 2>&1 || {
                tail -n 120 "$OUT/build-$label.log"; exit 1;
              }
            JAR="$(find sjf4j-testbench/build/libs -maxdepth 1 \
              -name '*-jmh.jar' -print -quit)"
            test -s "$JAR"
            GENERATED="$(find sjf4j-testbench/build/generated -type f \
              -name 'FabienJackson3InputBenchmark$CompiledJackson3_Impl.java' -print -quit)"
            test -n "$GENERATED" && test -s "$GENERATED"
            if [[ "$enabled" == true ]]; then
              grep -qF 'nextNameMatchAndToken(' "$GENERATED" || {
                echo "Native source was not emitted" >&2; exit 1;
              }
              python3 - "$GENERATED" <<'PY'
          import sys
          from pathlib import Path
          source=Path(sys.argv[1]).read_text()
          for method in ("fromBytes", "fromString", "fromReader"):
              start=source.find(" " + method + "(")
              end=source.find("catch (BindingException", start) if start >= 0 else -1
              if start < 0 or end < 0: raise SystemExit(f"Cannot locate {method} generated body")
              selected="Native(parser.nativeParser()" in source[start:end]
              if selected != (method == "fromBytes"):
                  raise SystemExit(f"{method} incorrect native selection: {selected}")
          PY
            elif grep -qF 'nextNameMatchAndToken(' "$GENERATED"; then
              echo "Control contains native source" >&2; exit 1
            fi
            cp "$GENERATED" "$OUT/generated-$label.java"
            java -jar "$JAR" \
              'org.sjf4j.testbench.binding.fabien.FabienJackson3InputBenchmark.read' \
              -p source=bytes,string,reader \
              -p implementation=compiled,native,blackbird \
              -p sizeKb=10 -p seed=12345,324 \
              -t 1 -f 2 -wi 2 -i 4 -w 250ms -r 250ms \
              -prof gc -rf json -rff "$OUT/raw-$label.json" \
              > "$OUT/jmh-$label.log" 2>&1 || {
                tail -n 120 "$OUT/jmh-$label.log"; exit 1;
              }
          done
      - name: Report paired ratios and allocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - build/performance/jackson3-input-source <<'PY'
          import json, statistics, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          sources=("bytes","string","reader")
          seeds=("12345","324")
          implementations=("compiled","native","blackbird")
          results={}
          for mode in ("wrapper","native"):
              rows=json.loads((root/f"raw-{mode}.json").read_text())
              perf={}
              alloc={}
              for row in rows:
                  p=row["params"]
                  key=(p["source"],p["seed"],p["implementation"])
                  forks=[statistics.mean(fork) for fork in row["primaryMetric"]["rawData"]]
                  if len(forks)!=2: raise ValueError(f"Unexpected forks: {mode} {key}")
                  perf[key]=statistics.mean(forks)
                  alloc[key]=row["secondaryMetrics"]["gc.alloc.rate.norm"]["score"]
              expected={(src,seed,impl) for src in sources for seed in seeds for impl in implementations}
              if set(perf)!=expected: raise ValueError(f"Unexpected JMH cases: {mode}, {expected-set(perf)}")
              results[mode]=(perf,alloc)
          def metric(mode,source,implementation):
              perf=results[mode][0]
              return statistics.geometric_mean(perf[(source,seed,implementation)] for seed in seeds)
          lines=["# Jackson3 Input Source Native selection vs wrapper A/B", "",
                 "Same runner, Jackson 3.3.0, JDK 25, Users POJO 10KB.",
                 "Two seeds, two forks, 2x250ms warmup + 4x250ms measurement.",
                 "Native is selected for byte[]; String/Reader use the original compiled wrapper.", 
                 "Gain normalized by within-mode Blackbird; >1 favors input-selected Compiled.",
                 "",
                 "| Source | Wrapper Compiled µs | Native Compiled µs | Native gain | Blackbird / Native Compiled | Jackson Native / Native Compiled |",
                 "| --- | ---: | ---: | ---: | ---: | ---: |"]
          for src in sources:
              wc=metric("wrapper",src,"compiled")
              nc=metric("native",src,"compiled")
              bw=metric("wrapper",src,"blackbird")
              bn=metric("native",src,"blackbird")
              gain=(bn/nc)/(bw/wc)
              native=metric("native",src,"native")
              lines.append(f"| {src} | {wc:.3f} | {nc:.3f} | {gain:.3f}x | {bn/nc:.3f}x | {native/nc:.3f}x |")
          lines.extend(["", "## Per-seed normalized native gain", "",
              "| Source | Seed | Gain |", "| --- | --- | ---: |"])
          for src in sources:
              for seed in seeds:
                  w=results["wrapper"][0]
                  n=results["native"][0]
                  bw=w[(src,seed,"blackbird")]/w[(src,seed,"compiled")]
                  bn=n[(src,seed,"blackbird")]/n[(src,seed,"compiled")]
                  lines.append(f"| {src} | {seed} | {bn/bw:.3f}x |")
          lines.extend(["", "## Allocation B/op (JMH GC profiler)", "",
              "| Source | Wrapper Compiled | Native Compiled | Native Blackbird |",
              "| --- | ---: | ---: | ---: |"])
          for src in sources:
              av=lambda mode,impl:statistics.mean(results[mode][1][(src,seed,impl)] for seed in seeds)
              lines.append(f"| {src} | {av('wrapper','compiled'):.0f} | {av('native','compiled'):.0f} | {av('native','blackbird'):.0f} |")
          (root/"comparison.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - name: Publish summary
        if: always()
        run: |
          FILE=build/performance/jackson3-input-source/comparison.md
          if test -s "$FILE"; then cat "$FILE" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload generated source and JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-input-source-paired
          path: build/performance/jackson3-input-source/
          retention-days: 30
          if-no-files-found: warn
