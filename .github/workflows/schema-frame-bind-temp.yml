name: Temporary Frame bind A/B
on:
  push:
    branches: [refactor/schema-node-frame-fastfail]
    paths:
      - .github/workflows/schema-frame-bind-temp.yml
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build two versions
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/sjf4j-prior" a9c41174f239a965ff358ce5bf36741a49456633
          (cd "$RUNNER_TEMP/sjf4j-prior" && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
          ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
      - name: JMH
        run: |
          set -euo pipefail
          mkdir -p frame-bind-results
          regex='.*CreekSchemaBenchmark\.(schema_validate_map|schema_validate_pojo|schema_is_valid_map|schema_is_valid_pojo)'
          for variant in prior binding; do
            if [ "$variant" = prior ]; then root="$RUNNER_TEMP/sjf4j-prior"; else root="$GITHUB_WORKSPACE"; fi
            jar=$(find "$root/sjf4j-testbench/build/libs" -maxdepth 1 -name '*jmh*.jar' -type f | head -n1)
            java -jar "$jar" "$regex" -f 2 -wi 15 -i 5 -w 300ms -r 300ms -prof gc \
              -rf json -rff "$GITHUB_WORKSPACE/frame-bind-results/$variant.json" \
              | tee "$GITHUB_WORKSPACE/frame-bind-results/$variant.txt"
          done
          python3 - <<'PY'
          import json
          for variant in ('prior','binding'):
              print("==",variant,"==")
              for row in json.load(open('frame-bind-results/'+variant+'.json')):
                  p=row['primaryMetric']
                  alloc=next((v['score'] for k,v in row['secondaryMetrics'].items() if k.endswith('gc.alloc.rate.norm')),None)
                  print(row['benchmark'].rsplit('.',1)[-1],round(p['score'],5),'+/-',round(p['scoreError'],5),'us/op',round(alloc,2),'B/op')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-frame-bind-jmh
          path: frame-bind-results/
