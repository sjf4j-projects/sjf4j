name: Experiment / cross-backend captured includeNulls boolean in manual Write

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-dual-backend-include-nulls-boolean.yml'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/FabienManualUsersWriter.java'
      - 'sjf4j-testbench/src/jmh/java/org/sjf4j/testbench/binding/fabien/FabienManualUsersBenchmark.java'

permissions:
  contents: read

jobs:
  benchmark:
    name: Handwritten NodeConfig vs primitive boolean, both backends
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build JMH
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Benchmark runtime config object against captured boolean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { echo "SHA: $GITHUB_SHA"; lscpu; java -version 2>&1; } > results/environment.txt
          jar=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$jar"
          common=( 'org.sjf4j.testbench.binding.fabien.FabienManualUsersBenchmark.write' \
            -p seed=12345,324 -p sizeKb=1,10,100 -t 1 -f 2 -wi 3 -i 4 -w 350ms -r 350ms -prof gc -rf json )
          java -jar "$jar" "${common[@]}" -p backend=jackson3 \
            -p implementation=blackbird,compiled,manual-member-runtime,manual-bool-runtime \
            -rff results/jackson3.json 2>&1 | tee results/jackson3.log
          java -jar "$jar" "${common[@]}" -p backend=fastjson2 \
            -p implementation=native,compiled,manual-runtime,manual-bool-runtime \
            -rff results/fastjson2.json 2>&1 | tee results/fastjson2.log
      - name: Summarize changes
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## Runtime NodeConfig vs root-captured primitive boolean includeNulls')
          print('All comparisons on the same JDK25 runner; 2 forks, 3x350ms warmup, 4x350ms measurement. Each case validates JSON output in setup.')
          print('Both use runtime null semantics, not compile-time fixed includeNulls. The scalar strategy remains Jackson3 native String-member helper vs Fastjson2 inline UTF8 String field code.')
          print()
          print('| Backend | KB | Seed | Native / Blackbird | Compiled | Hand config | Hand boolean | Config/boolean | Compiled/boolean | Bool B/op |')
          print('|---|---|---|---:|---:|---:|---:|---:|---:|---:|')
          for backend in ('jackson3','fastjson2'):
              rows=json.loads(Path(f'results/{backend}.json').read_text())
              assert len(rows)==24,(backend,len(rows))
              for size in ('1','10','100'):
                  for seed in ('12345','324'):
                      d={r['params']['implementation']:r for r in rows if r['params']['sizeKb']==size and r['params']['seed']==seed}
                      orig='manual-member-runtime' if backend=='jackson3' else 'manual-runtime'
                      baseline='blackbird' if backend=='jackson3' else 'native'
                      score=lambda k:d[k]['primaryMetric']['score']
                      mem=d['manual-bool-runtime']['secondaryMetrics']['gc.alloc.rate.norm']['score']
                      print(f'| {backend} | {size}KB | {seed} | {score(baseline):.3f} | {score("compiled"):.3f} | {score(orig):.3f} | {score("manual-bool-runtime"):.3f} | {score(orig)/score("manual-bool-runtime"):.3f}x | {score("compiled")/score("manual-bool-runtime"):.3f}x | {mem:.0f} |')
          PY
      - name: Upload all JMH data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-backend-include-nulls-bool-ab
          path: results/
          retention-days: 7
          if-no-files-found: warn
