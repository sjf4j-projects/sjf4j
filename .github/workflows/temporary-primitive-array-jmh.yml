name: Temporary Primitive Array JMH

on:
  push:
    branches:
      - perf/nodemapper-primitive-array-fastpath

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Build and benchmark
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*jmh.jar' -print -quit)
          test -n "$JAR"
          java -jar "$JAR" 'org.sjf4j.testbench.mapping.PrimitiveArrayMappingExperimentBenchmark.*' -f 1 -t 1 -wi 4 -i 6 -w 200ms -r 300ms -prof gc -rf json -rff "$RUNNER_TEMP/primitive-jmh.json"
          python3 - <<'PY'
          import json,os
          results=json.load(open(os.environ["RUNNER_TEMP"]+"/primitive-jmh.json"))
          assert len(results)==14, f"Expected 14 benchmark results but got {len(results)}"
          print("=== PRIMITIVE ARRAY JMH RESULTS ===")
          print(f'{"start":>5} {"method":>21} {"ns/op":>12} {"error":>12} {"B/op":>12}')
          for r in sorted(results,key=lambda x:(int(x["params"]["start"]),x["benchmark"])):
              m=r["benchmark"].split(".")[-1]
              p=r["primaryMetric"]
              a=r.get("secondaryMetrics",{}).get("gc.alloc.rate.norm",{}).get("score",float("nan"))
              print(f'{r["params"]["start"]:>5} {m:>21} {p["score"]:12.2f} {p["scoreError"]:12.2f} {a:12.2f}')
          PY
      - name: Upload JMH data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primitive-array-jmh
          path: ${{ runner.temp }}/primitive-jmh.json
          if-no-files-found: ignore
