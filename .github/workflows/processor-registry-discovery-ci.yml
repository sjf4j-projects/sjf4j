name: Processor Registry Discovery Validation
on:
  push:
    branches: [test/processor-registry-discovery-ci]
  workflow_dispatch:
jobs:
  processor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sjf4j-processor:test --no-daemon
      - name: Failure diagnostics
        if: failure()
        run: |
          grep -R -A 25 '<failure' sjf4j-processor/build/test-results/test/*.xml | head -n 220 || true
