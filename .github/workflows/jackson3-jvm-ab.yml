name: Jackson3 JVM A/B (experimental)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/jackson3-jvm-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jackson3-jvm-ab:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'perf/jackson3-native-cursor-ab-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Compare Native and Blackbird ratios across Jackson versions
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/performance/binding/jackson3-jvm-ab
          mkdir -p "$OUT"
          java -version 2> "$OUT/jdk.txt"
          lscpu > "$OUT/cpu.txt"
          for version in 3.2.3 3.3.0; do
            echo "Building Jackson $version"
            ./gradlew :sjf4j-testbench:jmhJar --rerun-tasks \
              "-PbindingJackson3Version=$version" -PbindingJackson3Cursor=native \
              > "$OUT/$version-build.log" 2>&1 || {
                tail -n 100 "$OUT/$version-build.log"
                exit 1
              }
            JAR="$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)"
            test -f "$JAR"
            echo "Benchmarking Jackson $version"
            java -jar "$JAR" 'org.sjf4j.testbench.binding.fabien.FabienReadBenchmark.read' \
              -p backend=jackson3 -p model=users,clients -p shape=pojo \
              -p implementation=native,blackbird,runtime,compiled -p sizeKb=1,10,100 \
              -p seed=12345,324 -t 1 -f 3 -wi 3 -i 5 -w 400ms -r 400ms \
              -rf json -rff "$OUT/$version.json" \
              > "$OUT/$version-jmh.log" 2>&1 || {
                tail -n 100 "$OUT/$version-jmh.log"
                exit 1
              }
          done

          python3 - "$OUT" <<'PY'
          import csv
          import json
          import statistics
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          versions = ("3.2.3", "3.3.0")
          models = ("clients", "users")
          sizes = ("1", "10", "100")
          seeds = ("12345", "324")
          implementations = ("native", "blackbird", "runtime", "compiled")
          # One best-two-of-three fork mean per exact case (no averaging seeds first).
          scores = {}
          for version in versions:
              raw = json.loads((root / f"{version}.json").read_text())
              for entry in raw:
                  p = entry["params"]
                  key = (version, p["model"], p["sizeKb"], p["seed"], p["implementation"])
                  forks = [statistics.mean(fork) for fork in entry["primaryMetric"]["rawData"]]
                  if len(forks) != 3:
                      raise SystemExit(f"Expected three forks: {key}; got {len(forks)}")
                  scores[key] = statistics.mean(sorted(forks)[:2])
          expected = {(v, m, size, seed, impl) for v in versions
                      for m in models for size in sizes for seed in seeds
                      for impl in implementations}
          if set(scores) != expected:
              raise SystemExit(f"Invalid JMH matrix: missing={expected-set(scores)} "
                               f"extra={set(scores)-expected}")

          def ratio(version, model, size, seed, baseline):
              return (scores[(version, model, size, seed, baseline)] /
                      scores[(version, model, size, seed, "compiled")])

          with (root / "comparison.csv").open("w", newline="") as f:
              writer = csv.writer(f)
              writer.writerow(["model", "sizeKb", "seed", "baseline",
                               "ratio_3.2.3", "ratio_3.3.0", "delta_pct"])
              for model in models:
                  for size in sizes:
                      for seed in seeds:
                          for baseline in ("native", "blackbird", "runtime"):
                              a = ratio("3.2.3", model, size, seed, baseline)
                              b = ratio("3.3.0", model, size, seed, baseline)
                              writer.writerow([model, size, seed, baseline, a, b,
                                               100*(b/a-1)])

          report = [
              "# Jackson 3 JVM Read A/B (JDK 25)",
              "",
              "Same GitHub Runner, same SJF4J native cursor; only Jackson version differs.",
              "JMH 3 forks; 3 × 400ms warmup; 5 × 400ms measurement; two seeds.",
              "Best 2 Fork Mean per exact case. Ratios are geometric means across both seeds.",
              "Higher ratios favor Compiled. Diagnostic, not the official Full baseline.",
              "",
              "| Model | Size | Native/Compiled 3.2.3 → 3.3.0 | Δ | Blackbird/Compiled 3.2.3 → 3.3.0 | Δ |",
              "| --- | --- | ---: | ---: | ---: | ---: |"
          ]
          changes = {"native": [], "blackbird": [], "runtime": []}
          for model in models:
              for size in sizes:
                  pairs = {}
                  for impl in changes:
                      a = statistics.geometric_mean(
                          ratio("3.2.3", model, size, seed, impl) for seed in seeds)
                      b = statistics.geometric_mean(
                          ratio("3.3.0", model, size, seed, impl) for seed in seeds)
                      pairs[impl] = a, b
                      changes[impl].append(b/a)
                  n0, n1 = pairs["native"]
                  b0, b1 = pairs["blackbird"]
                  report.append(f"| {model} | {size}KB | {n0:.3f}× → {n1:.3f}× | "
                                f"{100*(n1/n0-1):+.1f}% | {b0:.3f}× → {b1:.3f}× | "
                                f"{100*(b1/b0-1):+.1f}% |")
          report += [
              "",
              "## Overall geometric mean of ratio changes",
              "",
              "| Native/Compiled | Blackbird/Compiled | Runtime/Compiled |",
              "| ---: | ---: | ---: |",
              "| " + " | ".join(f"{100*(statistics.geometric_mean(changes[x])-1):+.1f}%"
                               for x in ("native", "blackbird", "runtime")) + " |",
              "",
              "## Per-seed ratios",
              "",
              "See comparison.csv for each seed's exact ratios and version deltas."
          ]
          (root / "comparison.md").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PY

      - name: Publish JVM ratios
        if: always()
        run: |
          test ! -f build/performance/binding/jackson3-jvm-ab/comparison.md || \
            cat build/performance/binding/jackson3-jvm-ab/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JVM measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-jvm-ab-${{ github.run_id }}
          path: build/performance/binding/jackson3-jvm-ab/
          if-no-files-found: warn
          retention-days: 30
