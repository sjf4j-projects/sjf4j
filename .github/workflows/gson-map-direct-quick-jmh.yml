name: Gson Map direct-path quick JMH
on:
  push:
    branches:
      - perf/gson-map-direct-jmh
  workflow_dispatch:
jobs:
  gson-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Quick JMH
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledReadBenchmark.gson_map_(direct_(raw|runtime)_(string|utf8)|(string|utf8)_(compiled|runtime))' \
            -wi 3 -i 5 -w 300ms -r 500ms -f 1 -prof gc \
            -rf json -rff gson-map-direct.json | tee gson-map-direct.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gson-map-direct
          path: |
            gson-map-direct.json
            gson-map-direct.log
          if-no-files-found: ignore
