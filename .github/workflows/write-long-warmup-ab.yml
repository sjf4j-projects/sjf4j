name: Long warmup write and Codec A/B
on:
  push:
    branches: [perf/write-long-warmup-codec-ab]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Run same-run structural and Codec comparison
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*CompiledWriteBenchmark\.(json_jackson[23]_pojo_(string|utf8)_(compiled|direct|direct_wrapped)|json_jackson[23]_uri_(stream_wrapped|codec_wrapped|native_wrapped))' \
            -bm avgt -tu us -t 1 -f 3 -wi 15 -w 400ms -i 10 -r 400ms \
            -prof gc -rf json -rff long-warmup-results.json | tee long-warmup.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: write-codec-ab-trial-${{ matrix.trial }}
          path: |
            long-warmup-results.json
            long-warmup.log
          if-no-files-found: warn
