name: Experiment / Fastjson2 Users Write JFR hotspots

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-fastjson2-users-write-jfr.yml'

permissions:
  contents: read
  actions: read

jobs:
  profile:
    name: JDK25 JFR / Fastjson2 Users POJO Write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore unchanged main Full JMH jar
        uses: actions/download-artifact@v8
        with:
          name: binding-full-jmh-jar
          run-id: 44917024751
          github-token: ${{ github.token }}
          path: jmh
      - name: Profile ONLY Fastjson2 Users native and compiled
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { echo 'JMH source commit: 501caabe3a197e37498b0854d3dbf98c24ce2790'; lscpu; java -version 2>&1; } > results/environment.txt
          jar=$(find jmh -name '*-jmh.jar' -print -quit)
          test -n "$jar"
          sha256sum "$jar" > results/jar.sha256
          for kb in 1 100; do
            for seed in 12345 324; do
              for implementation in native compiled; do
                output="results/${kb}kb-${seed}-${implementation}"
                mkdir -p "$output"
                java -jar "$jar" 'org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write' \
                  -p backend=fastjson2 -p implementation="$implementation" \
                  -p model=users -p shape=pojo -p sizeKb="$kb" -p seed="$seed" \
                  -t 1 -f 1 -wi 3 -i 6 -w 1s -r 1s \
                  -prof "jfr:dir=$output,configName=profile" \
                  -rf json -rff "$output/jmh.json" > "$output/jmh.log" 2>&1
                find "$output" -name '*.jfr' -type f -print | sort > "$output/recordings.txt"
                test -s "$output/recordings.txt"
                while IFS= read -r recording; do
                  jfr summary "$recording" > "${recording%.jfr}.summary.txt"
                  # Java's JFR CLI renders actual stack frames, no sampling in source code.
                  jfr print --events jdk.ExecutionSample "$recording" > "${recording%.jfr}.samples.txt"
                done < "$output/recordings.txt"
              done
            done
          done
      - name: Publish recording inventory
        if: success()
        shell: bash
        run: |
          {
            echo '## Fastjson2 Users POJO Write native vs compiled — JFR profiling'
            echo 'Unmodified Full JMH jar, same JDK25 runner; 1KB/100KB, seeds 12345/324; one fork per profile.'
            echo 'All JMH trials validate JSON on setup. JFR runs are for CPU stack attribution, **not** precise performance comparison.'
            echo
            echo '| Size | Seed | Implementation | JFR recordings |'
            echo '| --- | --- | --- | ---: |'
            for kb in 1 100; do
              for seed in 12345 324; do
                for impl in native compiled; do
                  file="results/${kb}kb-${seed}-${impl}/recordings.txt"
                  echo "| ${kb} KB | $seed | $impl | $(wc -l < "$file") |"
                done
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JFR CPU profiles and raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-users-only-jfr
          path: results/
          retention-days: 7
          if-no-files-found: warn
