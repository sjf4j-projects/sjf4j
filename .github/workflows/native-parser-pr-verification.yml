name: Native parser PR verification

on:
  push:
    branches:
      - refactor/fastjson2-native-parser-read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test native parser changes
        run: |
          ./gradlew :sjf4j-processor:test --tests org.sjf4j.processor.CompiledBinderConformanceTest \
            :sjf4j-testbench:test --tests org.sjf4j.testbench.processor.binding.Fastjson2NativeStringContainersTest
