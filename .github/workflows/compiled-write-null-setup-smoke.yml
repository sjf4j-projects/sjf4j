name: CompiledWrite null policy setup smoke

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/compiled-write-null-setup-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 107
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Check compiled includeNulls true/false JMH setup
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*CompiledWriteBenchmark\.json_jackson2_pojo_string_compiled$' \
            -bm avgt -tu us -t 1 -f 1 -wi 1 -w 200ms -i 1 -r 200ms
