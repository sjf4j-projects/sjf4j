name: Recyclable output buffer microbenchmark

# Small, branch-only screening run. Full Java CI runs separately.
on:
  push:
    branches:
      - perf/recyclable-memory-output-bench
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Compare output sinks and allocation
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*OutputBufferBenchmark\.(charsPooled|charsJdk|charsJackson|charsChunksPooled|bytesPooled|bytesJdk|bytesJackson|bytesChunksPooled)$' \
            -bm avgt -tu us -t 1 -f 1 -wi 1 -w 100ms -i 2 -r 120ms -p payloadLength=307200,1048576 -p alphabet=ASCII,UNICODE \
            -prof gc -rf json -rff output-buffer-jmh.json \
            | tee output-buffer-jmh.log
      - name: Compare paired sinks
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee output-buffer-summary.md
          import json
          results=json.load(open('output-buffer-jmh.json'))
          if not results: raise SystemExit('JMH produced no results')
          rows={}
          for r in results:
              key=(r['params']['payloadLength'],r['params']['alphabet'])
              rows.setdefault(key,{})[r['benchmark'].split('.')[-1]]=r
          pairs=[
              ('charsPooled','charsJdk'),('charsPooled','charsJackson'),
              ('bytesPooled','bytesJdk'),('bytesPooled','bytesJackson')
          ]
          print('# Adaptive buffer growth: focused screening (300K, 1MB)')
          print('JDK 25; single fork; 1 warmup, 2 measurements, GC allocations included.')
          print('| Size | Alphabet | Pooled | Baseline | Pooled us/op | Baseline us/op | Speedup | Pooled B/op | Baseline B/op |')
          print('|---:|---|---|---|---:|---:|---:|---:|---:|')
          for (size,alphabet),items in sorted(rows.items()):
              for a,b in pairs:
                  if a not in items or b not in items: continue
                  x,y=items[a],items[b]
                  xv,yv=x['primaryMetric']['score'],y['primaryMetric']['score']
                  alloc=lambda r:r.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan'))
                  print(f'| {size} | {alphabet} | {a} | {b} | {xv:.3f} | {yv:.3f} | {yv/xv:.2f}x | {alloc(x):.0f} | {alloc(y):.0f} |')
          PY
          cat output-buffer-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-buffer-jmh
          path: |
            output-buffer-jmh.json
            output-buffer-jmh.log
            output-buffer-summary.md
          if-no-files-found: warn
