name: Recyclable output buffer microbenchmark

# Branch-only benchmark experiment. Full Java CI runs separately.
on:
  push:
    branches:
      - perf/recyclable-memory-output-bench
  workflow_dispatch:

concurrency:
  group: recyclable-output-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Compare output sinks and allocation
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*SegmentedOutputBenchmark\.(currentPooled|chunksCurrentPooled|jacksonUnlimited|chunksJacksonUnlimited|jacksonCapped|chunksJacksonCapped)$' \
            -bm avgt -tu us -t 1 -f 2 -wi 10 -w 150ms -i 3 -r 150ms \
            -p payloadLength=1024,4096,16384,65536,131072,262144,307200,1048576 -p alphabet=ASCII,UNICODE -p segmentSize=131072 \
            -prof gc -rf json -rff output-buffer-jmh.json \
            | tee output-buffer-jmh.log
      - name: Compare paired sinks
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee output-buffer-summary.md
          import json
          results=json.load(open('output-buffer-jmh.json'))
          if not results: raise SystemExit('JMH produced no results')
          rows={}
          for r in results:
              key=(int(r['params']['payloadLength']),r['params']['alphabet'])
              rows.setdefault(key,{})[r['benchmark'].split('.')[-1]]=r
          print('# Production char writer versus Jackson2 segmented')
          print('JDK 25, 2 forks, 10 warmups, 3 measures, 150ms; us/op, B/op.')
          for name,methods in [('bulk',['currentPooled','jacksonUnlimited','jacksonCapped']),('chunks256',['chunksCurrentPooled','chunksJacksonUnlimited','chunksJacksonCapped'])]:
              print('\\n## '+name)
              print('| Size | Alphabet | SJF us/op | Jackson native us/op | Jackson capped us/op | SJF B/op | Jackson native B/op | Jackson capped B/op |')
              print('|---:|---|---:|---:|---:|---:|---:|---:|')
              for (size,alphabet),items in sorted(rows.items()):
                  if any(n not in items for n in methods): raise SystemExit(f'Missing {name} {size} {alphabet}')
                  scores=[items[n]['primaryMetric']['score'] for n in methods]
                  allocs=[items[n].get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan')) for n in methods]
                  print(f'| {size} | {alphabet} | '+' | '.join(f'{v:.3f}' for v in scores)+' | '+' | '.join(f'{v:.0f}' for v in allocs)+' |')
          PY
          cat output-buffer-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-buffer-jmh
          path: |
            output-buffer-jmh.json
            output-buffer-jmh.log
            output-buffer-summary.md
          if-no-files-found: warn
