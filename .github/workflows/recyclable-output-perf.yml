name: Recyclable output buffer microbenchmark

# Branch-only benchmark experiment. Full Java CI runs separately.
on:
  push:
    branches:
      - perf/recyclable-memory-output-bench
  workflow_dispatch:

concurrency:
  group: recyclable-output-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Compare output sinks and allocation
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*SoftCacheSmallOutputBenchmark\.(pooledBytes|pooledChars|jacksonChars)$' \
            -bm avgt -tu us -t 1 -f 2 -wi 10 -w 200ms -i 3 -r 200ms \
            -prof gc -rf json -rff output-buffer-jmh.json \
            | tee output-buffer-jmh.log
      - name: Compare paired sinks
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee output-buffer-summary.md
          import json
          results=json.load(open('output-buffer-jmh.json'))
          if not results: raise SystemExit('JMH produced no results')
          rows={}
          for r in results:
              key=(r['params']['cacheKind'],r['params']['alphabet'])
              rows.setdefault(key,{})[r['benchmark'].split('.')[-1]]=r
          print('# 1K output on 1K strong vs 1M soft caches')
          print('2 forks, 10 warmups, 3 measurements, JDK 25; GC allocation measured.')
          print('| Cache | Alphabet | SJF char us/op | Jackson2 char us/op | SJF byte us/op | SJF char B/op | Jackson char B/op | SJF byte B/op |')
          print('|---|---|---:|---:|---:|---:|---:|')
          for (cache,alphabet),items in sorted(rows.items()):
              required=['pooledChars','jacksonChars','pooledBytes']
              if any(name not in items for name in required):
                  raise SystemExit(f'Missing benchmark {cache} {alphabet}')
              scores=[items[name]['primaryMetric']['score'] for name in required]
              allocs=[items[name].get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan')) for name in required]
              print(f'| {cache} | {alphabet} | '+ ' | '.join(f'{x:.4f}' for x in scores) +' | '+ ' | '.join(f'{x:.0f}' for x in allocs) +' |')
          PY
          cat output-buffer-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-buffer-jmh
          path: |
            output-buffer-jmh.json
            output-buffer-jmh.log
            output-buffer-summary.md
          if-no-files-found: warn
