name: Recyclable output buffer microbenchmark

# Branch-only benchmark experiment. Full Java CI runs separately.
on:
  push:
    branches:
      - perf/recyclable-memory-output-bench
  workflow_dispatch:

concurrency:
  group: recyclable-output-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Compare output sinks and allocation
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*StrongCacheCapBenchmark\.(charsWithEviction|bytesWithEviction)$' \
            -bm avgt -tu us -t 1 -f 2 -wi 5 -w 120ms -i 4 -r 120ms \
            -p strongLimit=65536,262144 -p payloadLength=131072,262144,307200,1048576 -p alphabet=ASCII,UNICODE \
            -prof gc -rf json -rff output-buffer-jmh.json \
            | tee output-buffer-jmh.log
      - name: Compare paired sinks
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee output-buffer-summary.md
          import json
          results=json.load(open('output-buffer-jmh.json'))
          if not results: raise SystemExit('JMH produced no results')
          rows={}
          for r in results:
              key=(int(r['params']['payloadLength']),r['params']['alphabet'],r['benchmark'].split('.')[-1])
              rows.setdefault(key,{})[int(r['params']['strongLimit'])]=r
          print('# 64K vs 256K after simulated soft cache clearance every 32 writes')
          print('JDK 25, 2 forks, 5 warmups + 4 measurements, 120ms each; 256-char chunks.')
          print('Value measures both write and finalized return. Unicode byte payload is UTF-8 encoded.')
          for method in ['charsWithEviction','bytesWithEviction']:
              print('\\n## '+method)
              print('| Size | Alphabet | 64K us/op | 256K us/op | 64K / 256K | 64K B/op | 256K B/op |')
              print('|---:|---|---:|---:|---:|---:|---:|')
              for (size,alphabet,m),limits in sorted(rows.items()):
                  if m != method: continue
                  if 65536 not in limits or 262144 not in limits: raise SystemExit(f'Missing {size} {alphabet} {method}')
                  lo=limits[65536]; hi=limits[262144]
                  lt=lo['primaryMetric']['score']; ht=hi['primaryMetric']['score']
                  alloc=lambda v:v.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan'))
                  print(f'| {size} | {alphabet} | {lt:.4f} | {ht:.4f} | {lt/ht:.3f}x | {alloc(lo):.0f} | {alloc(hi):.0f} |')
          PY
          cat output-buffer-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-buffer-jmh
          path: |
            output-buffer-jmh.json
            output-buffer-jmh.log
            output-buffer-summary.md
          if-no-files-found: warn
