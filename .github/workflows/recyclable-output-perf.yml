name: Recyclable output buffer microbenchmark

# Deliberately restricted to this experiment branch; never run full JMH for
# unrelated pull requests or the main branch.
on:
  push:
    branches:
      - perf/recyclable-memory-output-bench
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :sjf4j-core:test --no-daemon
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Compare native output sinks and allocation
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*OutputBufferBenchmark\.(charsPooled|charsHandwrittenPooled|charsJackson|charsLargeExact|charsLargeDouble|gsonPooled|gsonPooledRef|gsonNoRetain|gsonRefRetain|gsonLargeDouble|gsonHandwrittenPooled|jackson2StringPooled|jackson2StringSegmented|jackson2StringLargeDouble)' \
            -bm avgt -tu us -t 1 -f 2 -wi 5 -w 250ms -i 7 -r 250ms -p payloadLength=20480,131072 -p alphabet=ASCII,UNICODE \
            -prof gc -rf json -rff output-buffer-jmh.json \
            | tee output-buffer-jmh.log
      - name: Compare paired sinks
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee output-buffer-summary.md
          import json
          results=json.load(open('output-buffer-jmh.json'))
          rows={}
          for r in results:
              name=r['benchmark'].split('.')[-1]
              args=r['params']
              key=(args['payloadLength'],args['alphabet'])
              rows.setdefault(key,{})[name]=r
          if not results: raise SystemExit('JMH produced no valid results')
          pairs=[
              ('charsDirectResult','charsPooled'),('gsonDirectResult','gsonPooled'),('jackson2StringDirectResult','jackson2StringPooled'),('charsStringChecks','charsPooled'),('gsonStringChecks','gsonPooled'),('jackson2StringStringChecks','jackson2StringPooled'),('charsCharChecks','charsPooled'),('gsonCharChecks','gsonPooled'),('jackson2StringCharChecks','jackson2StringPooled'),('charsFactory','charsPooled'),('gsonFactory','gsonPooled'),('jackson2StringFactory','jackson2StringPooled'),
              ('charsPooledRef','charsPooled'),('gsonPooledRef','gsonPooled'),('jackson2StringPooledRef','jackson2StringPooled'),('charsChunksPooled','charsChunksHandwritten'),('charsArrayChunksPooled','charsArrayChunksHandwritten'),('charsPooled','charsJdk'),('charsPooled','charsFast'),('charsPooled','charsHandwrittenPooled'),('charsPooled','charsJackson'),
              ('bytesPooled','bytesJdk'),('bytesPooled','bytesJackson'),
              ('gsonPooled','gsonJdk'),('gsonPooled','gsonFast'),('gsonPooled','gsonHandwrittenPooled'),
              ('jackson2StringPooled','jackson2StringJdk'),
              ('jackson2StringPooled','jackson2StringHandwrittenPooled'),
              ('jackson2StringPooled','jackson2StringSegmented'),
              ('jackson2BytesPooled','jackson2BytesJdk'),
              ('jackson2BytesPooled','jackson2BytesSegmented')]
          pairs = [
              ('gsonNoRetain','gsonPooled'),('gsonRefRetain','gsonPooled'),('gsonPooledRef','gsonPooled'),
              ('gsonLargeExact','gsonPooled'),('gsonLargeDouble','gsonPooled'),('gsonHandwrittenPooled','gsonPooled'),
              ('charsLargeExact','charsPooled'),('charsLargeDouble','charsPooled'),('charsJackson','charsPooled'),
              ('jackson2StringLargeExact','jackson2StringPooled'),('jackson2StringLargeDouble','jackson2StringPooled'),
              ('jackson2StringSegmented','jackson2StringPooled')]
          print('# Gson ASCII regression and 128K output growth A/B')
          print()
          print('JDK 25; each operation includes creating sink, writing, result materialization and recycling.')
          print('Speedup = baseline / pooled, so >1 means pooled is faster.')
          print()
          print('| Size | Alphabet | Pooled | Baseline | Pooled (us/op) | Baseline | Speedup | Pooled B/op | Baseline B/op |')
          print('|---:|---|---|---|---:|---:|---:|---:|---:|')
          for (size,alphabet),items in sorted(rows.items()):
              for a,b in pairs:
                  if a not in items or b not in items: continue
                  x=items[a];y=items[b]
                  av=x['primaryMetric']['score'];bv=y['primaryMetric']['score']
                  alloc=lambda r:r.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan'))
                  print(f'| {size} | {alphabet} | {a} | {b} | {av:.3f} | {bv:.3f} | {bv/av:.2f}x | {alloc(x):.0f} | {alloc(y):.0f} |')
          PY
          cat output-buffer-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-buffer-jmh
          path: |
            output-buffer-jmh.json
            output-buffer-jmh.log
            output-buffer-summary.md
          if-no-files-found: warn
