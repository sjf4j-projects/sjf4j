name: Recyclable output buffer microbenchmark

# Branch-only benchmark experiment. Full Java CI runs separately.
on:
  push:
    branches:
      - perf/recyclable-memory-output-bench
  workflow_dispatch:

concurrency:
  group: recyclable-output-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Compare output sinks and allocation
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*SegmentedOutputBenchmark\.(chunksCurrentPooled|chunksSoftContiguous|chunksJacksonUnlimited)$' \
            -bm avgt -tu us -t 1 -f 2 -wi 10 -w 200ms -i 3 -r 200ms -p payloadLength=307200,1048576 -p alphabet=ASCII,UNICODE -p segmentSize=131072 \
            -prof gc -rf json -rff output-buffer-jmh.json \
            | tee output-buffer-jmh.log
      - name: Compare paired sinks
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee output-buffer-summary.md
          import json
          results=json.load(open('output-buffer-jmh.json'))
          if not results: raise SystemExit('JMH produced no results')
          rows={}
          for r in results:
              key=(r['params']['payloadLength'],r['params']['alphabet'],r['params']['segmentSize'])
              rows.setdefault(key,{})[r['benchmark'].split('.')[-1]]=r
          print('# Contiguous large soft char array vs Jackson2')
          print('| Size | Alphabet | Method | us/op | B/op |')
          print('|---:|---|---|---:|---:|')
          for (size,alphabet,segment),items in sorted(rows.items()):
              for name in ['chunksCurrentPooled','chunksSoftContiguous','chunksJacksonUnlimited']:
                  if name not in items: raise SystemExit(f'Missing {size} {alphabet} {segment} {name}')
                  row=items[name]
                  score=row['primaryMetric']['score']
                  alloc=row.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score',float('nan'))
                  print(f'| {size} | {alphabet} | {name} | {score:.3f} | {alloc:.0f} |')
          PY
          cat output-buffer-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-buffer-jmh
          path: |
            output-buffer-jmh.json
            output-buffer-jmh.log
            output-buffer-summary.md
          if-no-files-found: warn
