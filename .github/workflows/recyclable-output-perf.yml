name: Output buffer comparison (SJF4J / JDK / Jackson2)

# Manual JMH run only. Unit tests are covered by the normal Java CI.
on:
  workflow_dispatch:

concurrency:
  group: output-buffer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Compare production output buffers
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" '.*AdaptiveOutputBenchmark\..*$' \
            -bm avgt -tu us -t 1 -f 2 -wi 5 -w 150ms -i 5 -r 150ms \
            -p payloadLength=1024,65536,65537,131072,262144,307200,1048576 -p alphabet=ASCII,UNICODE \
            -prof gc -rf json -rff output-buffer-jmh.json \
            | tee output-buffer-jmh.log
      - name: Summarize comparative results
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee output-buffer-summary.md
          import json
          results = json.load(open('output-buffer-jmh.json'))
          if not results:
              raise SystemExit('JMH produced no results')
          rows = {}
          for result in results:
              key = (int(result['params']['payloadLength']), result['params']['alphabet'])
              rows.setdefault(key, {})[result['benchmark'].split('.')[-1]] = result
          groups = [
              ('String full', ('charsPooled', 'charsJdk', 'charsJackson2')),
              ('String chunks256', ('charsChunksPooled', 'charsChunksJdk', 'charsChunksJackson2')),
              ('byte[] full', ('bytesPooled', 'bytesJdk', 'bytesJackson2')),
              ('byte[] chunks256', ('bytesChunksPooled', 'bytesChunksJdk', 'bytesChunksJackson2')),
          ]
          print('# Output buffer comparison: SJF4J vs JDK vs Jackson2')
          print('JDK 25; 2 forks; 5 warmups and 5 measurements; units us/op and B/op (lower is better).')
          print('SJF4J full large String can return the input unchanged; its zero-copy path is not equivalent to copying sinks.')
          for group_name, methods in groups:
              print('\n## ' + group_name)
              print('| Size | Alphabet | SJF4J us/op | JDK us/op | Jackson2 us/op | SJF4J B/op | JDK B/op | Jackson2 B/op |')
              print('|---:|---|---:|---:|---:|---:|---:|---:|')
              for (size, alphabet), items in sorted(rows.items()):
                  if any(method not in items for method in methods):
                      raise SystemExit(f'Missing {group_name} {size} {alphabet}')
                  measures = [items[method] for method in methods]
                  times = [result['primaryMetric']['score'] for result in measures]
                  allocations = [result.get('secondaryMetrics', {}).get('gc.alloc.rate.norm', {}).get('score', float('nan')) for result in measures]
                  print(f'| {size} | {alphabet} | ' + ' | '.join(f'{value:.4f}' for value in times) + ' | ' + ' | '.join(f'{value:.0f}' for value in allocations) + ' |')
          PY
          cat output-buffer-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-buffer-jmh
          path: |
            output-buffer-jmh.json
            output-buffer-jmh.log
            output-buffer-summary.md
          if-no-files-found: warn
