name: Experiment / Jackson3 ThreadLocal Recycler A/B

on:
  pull_request:
    paths:
      - 'sjf4j-backend-jackson3/src/main/java/org/sjf4j/backend/jackson3/binding/Jackson3Binder.java'
      - '.github/workflows/experiment-jackson3-threadlocal-recycler-ab.yml'

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: Jackson3 Users Write recycler pool A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download untouched main JMH jar
        uses: actions/download-artifact@v8
        with:
          name: binding-full-jmh-jar
          run-id: 44917024751
          github-token: ${{ github.token }}
          path: baseline-jar
      - name: Build candidate JMH jar from PR
        run: ./gradlew :sjf4j-testbench:jmhJar
      - name: Run baseline and threadlocal-recycler candidate on same runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          { echo 'Baseline commit: 501caabe3a197e37498b0854d3dbf98c24ce2790'; echo "Candidate: $GITHUB_SHA"; lscpu; java -version 2>&1; } > results/environment.txt
          base=$(find baseline-jar -name '*-jmh.jar' -print -quit)
          candidate=$(find sjf4j-testbench/build/libs -name '*-jmh.jar' -print -quit)
          test -n "$base" && test -n "$candidate"
          sha256sum "$base" "$candidate" > results/jars.sha256
          common=( 'org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write' -p backend=jackson3 -p model=users -p shape=pojo -p sizeKb=1,10,100 -p seed=12345,324 -t 1 -f 2 -wi 3 -i 3 -w 350ms -r 350ms -prof gc -rf json )
          java -jar "$base" "${common[@]}" -p implementation=native,blackbird,compiled \
            -rff results/baseline.json 2>&1 | tee results/baseline.log
          java -jar "$candidate" "${common[@]}" -p implementation=compiled \
            -rff results/candidate.json 2>&1 | tee results/candidate.log
      - name: Summarize threadlocal recycler pool comparison
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          base = json.loads(Path('results/baseline.json').read_text())
          cand = json.loads(Path('results/candidate.json').read_text())
          assert len(base) == 18 and len(cand) == 6, (len(base),len(cand))
          def val(rows,size,seed,impl):
              x=[r for r in rows if r['params']['sizeKb']==size and r['params']['seed']==seed and r['params']['implementation']==impl]
              assert len(x)==1, (size,seed,impl,len(x))
              return x[0]['primaryMetric']['score']
          print('## Jackson3 Users Write: default deque recycler vs threadlocal recycler')
          print()
          print('JDK25 same runner, original main JMH jar vs PR JMH jar; JMH 2 forks, 3x350ms warmup and 3x350ms measurement.')
          print('Raw gc, output correctness validation and fork data included.')
          print()
          print('| Size | Seed | Native | BB | Original Compiled | Candidate Compiled | Improvement | New Native/Compiled | New BB/Compiled |')
          print('|---|---|---:|---:|---:|---:|---:|---:|---:|')
          for size in ['1','10','100']:
              for seed in ['12345','324']:
                  n,b,o=(val(base,size,seed,x) for x in ['native','blackbird','compiled'])
                  c=val(cand,size,seed,'compiled')
                  print(f'| {size}KB | {seed} | {n:.3f} | {b:.3f} | {o:.3f} | {c:.3f} | {o/c:.3f}x | {n/c:.3f}x | {b/c:.3f}x |')
          PY
      - name: Upload raw JMH output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-threadlocal-recycler-ab
          path: results/
          retention-days: 7
          if-no-files-found: warn
