name: Jackson Codec leaf helper A/B
on:
  push:
    branches: [perf/jackson-codec-leaf-helper]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Exact parity plus aligned JMH
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          java -jar "$jar" '.*CompiledWriteBenchmark\.json_jackson[23]_pojo_(string|utf8)_(compiled|direct_wrapped)' \
            -bm avgt -tu us -t 1 -f 3 -wi 15 -w 400ms -i 10 -r 400ms \
            -prof gc -rf json -rff codec-leaf-results.json | tee codec-leaf.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codec-leaf-trial-${{ matrix.trial }}
          path: |
            codec-leaf-results.json
            codec-leaf.log
          if-no-files-found: warn
