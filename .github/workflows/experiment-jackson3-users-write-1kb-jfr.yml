name: Experiment / Jackson3 Users Write 1KB JFR hotspots

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-jackson3-users-write-1kb-jfr.yml'

permissions:
  contents: read
  actions: read

jobs:
  profile:
    name: JDK25 JFR / Jackson3 Users 1KB POJO Write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Download exact main Full JMH jar
        uses: actions/download-artifact@v8
        with:
          name: binding-full-jmh-jar
          run-id: 44917024751
          github-token: ${{ github.token }}
          path: jmh
      - name: Profile Jackson3 Users Write using JFR execution samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/jfr
          { echo 'JMH source commit: 501caabe3a197e37498b0854d3dbf98c24ce2790'; lscpu; java -version 2>&1; } > results/environment.txt
          jar=$(find jmh -name '*-jmh.jar' -print -quit)
          test -n "$jar"
          java -jar "$jar" 'org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write' \
            -p backend=jackson3 -p implementation=native,blackbird,compiled \
            -p model=users -p shape=pojo -p sizeKb=1 -p seed=12345,324 \
            -t 1 -f 1 -wi 3 -i 8 -w 1s -r 1s \
            -prof jfr:dir=results/jfr,configName=profile \
            -rf json -rff results/jmh.json 2>&1 | tee results/jmh.log
          echo 'JFR files:' | tee results/recordings.txt
          find results/jfr -name '*.jfr' -type f -print | sort | tee -a results/recordings.txt
      - name: Upload CPU profiles and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-users-write-1kb-jfr-profiles
          path: results/
          if-no-files-found: warn
          retention-days: 7
