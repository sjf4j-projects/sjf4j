name: Compiled OBNT and Codec Testbench
on:
  push:
    branches: [test/compiled-obnt-codec-testbench-ci]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run standalone testbench conformance
        run: ./gradlew :sjf4j-testbench:test --tests '*CompiledObntCodecTest' --no-daemon
      - name: Build standalone JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Smoke JMH on Fastjson2 compiled codec read
        run: |
          java -jar sjf4j-testbench/build/libs/*-jmh.jar             '.*CompiledObntCodecBenchmark.codec_read_compiled'             -p backend=fastjson2 -wi 0 -i 1 -r 1s -f 1
      - name: Print test failures
        if: failure()
        run: |
          grep -A 25 '<failure' sjf4j-testbench/build/test-results/test/TEST-org.sjf4j.testbench.binding.CompiledObntCodecTest.xml | head -n 100 || true
