name: Fastjson2 packed-name write probe (one-off)

on:
  push:
    branches: [bench/fastjson2-write-intrinsics-20261010]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Compile JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Run packed field-name experiment
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
          test -n "$JAR"
          java -jar "$JAR" '.*Fastjson2WriteIntrinsicProbeBenchmark.*' \
            -f 2 -wi 3 -i 5 -w 200ms -r 200ms \
            -foe true -prof gc -rf json -rff intrinsic-results.json 2>&1 | tee intrinsic-output.txt
      - name: Print results
        if: success()
        run: |
          python3 - <<'PY'
          import json
          with open('intrinsic-results.json') as f: r=json.load(f)
          assert len(r)==6, len(r)
          for x in sorted(r,key=lambda z:z['benchmark']):
              n=x['benchmark'].rsplit('.',1)[-1]
              b=x['secondaryMetrics']['gc.alloc.rate.norm']['score']
              print(f'FASTJSON2_INTRINSIC,{n},{x["primaryMetric"]["score"]:.4f},{b:.1f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastjson2-write-intrinsics
          path: |
            intrinsic-results.json
            intrinsic-output.txt
          if-no-files-found: warn
