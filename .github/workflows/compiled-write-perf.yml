name: Compiled Write performance (focused)

# Run only for the current Write-optimization branch; do not restore the
# former expensive Creek benchmark as a general pull-request check.
on:
  push:
    branches:
      - perf/jackson-compiled-string-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build JMH benchmark jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Run paired Jackson2/3 POJO and Creek write benchmarks
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" \
            '.*(CompiledWriteBenchmark\\.json_jackson[23]_pojo_(string|utf8)_(compiled|native|blackbird|direct)|CreekModelBenchmark\\.write_(compiled|native|blackbird))' \
            -bm avgt -tu us -t 1 -f 3 -wi 4 -w 250ms -i 7 -r 250ms \
            -prof gc -rf json -rff write-perf-results.json \
            | tee write-perf.log
      - name: Summarize comparable pairs and allocations
        if: success()
        run: |
          python3 - <<'PY' | tee write-perf-summary.md
          import json
          runs=json.load(open('write-perf-results.json'))
          items={r['benchmark'].split('.')[-1]:r for r in runs}
          print("# Compiled Write / Creek JMH")
          print()
          print("One hosted runner, same JVM/JMH settings; these results are diagnostic, not a cross-machine guarantee.")
          print()
          print("| Case | Compiled (us/op) | Native | Blackbird | Direct | Native/Compiled | Blackbird/Compiled | Alloc Compiled (B/op) |")
          print("|---|---:|---:|---:|---:|---:|---:|---:|")
          for name in sorted(n for n in items if n.endswith('_compiled')):
              prefix=name.removesuffix('_compiled')
              get=lambda suffix:items.get(prefix+'_'+suffix)
              c=get('compiled')
              n=get('native')
              b=get('blackbird')
              d=get('direct')
              if not n or not b:
                  print(f"**MISSING comparator for {prefix}**")
                  continue
              score=lambda v:v['primaryMetric']['score'] if v else None
              fmt=lambda v:f"{score(v):.3f}" if v else "—"
              alloc=c.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score')
              a=f"{alloc:.1f}" if alloc is not None else "—"
              print(f"| {prefix} | {fmt(c)} | {fmt(n)} | {fmt(b)} | {fmt(d)} | {score(n)/score(c):.3f}x | {score(b)/score(c):.3f}x | {a} |")
          print()
          print("Blackbird/Compiled >1 means compiled is faster; check error bars and repeat on fixed hardware before declaring a stable advantage.")
          PY
          cat write-perf-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-write-jmh
          path: |
            write-perf-results.json
            write-perf.log
            write-perf-summary.md
          if-no-files-found: warn
