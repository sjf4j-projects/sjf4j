name: Compiled Write performance (focused)

# Kept on demand after the optimization branch is merged.
# Do not re-enable expensive JMH as a general PR or push check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build JMH benchmark jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Run paired Jackson2/3 POJO and Creek write benchmarks
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" \
            '.*(CompiledWriteBenchmark\.json_jackson[23]_pojo_(string|utf8)_(compiled|native|blackbird|direct|direct_wrapped)|CreekModelBenchmark\.write_(compiled|native|blackbird)|CompiledWriteBenchmark\.json_jackson[23]_uri_(compiled|runtime|direct))' \
            -bm avgt -tu us -t 1 -f 3 -wi 15 -w 400ms -i 10 -r 400ms \
            -prof gc -rf json -rff write-perf-results.json \
            | tee write-perf.log
      - name: Summarize comparable pairs and allocations
        if: success()
        run: |
          python3 - <<'PY' | tee write-perf-summary.md
          import json
          runs=json.load(open('write-perf-results.json'))
          items={r['benchmark'].split('.')[-1]:r for r in runs}
          print("# Compiled Write / Creek JMH")
          print()
          print("JDK17; three forks, six seconds warmup per fork; interpret within-run gaps and JMH uncertainty.")
          print()
          print("| Case | Compiled (us/op) | Native | Blackbird | Direct | Direct+Wrapper | Native/Compiled | Blackbird/Compiled | Alloc Compiled (B/op) |")
          print("|---|---:|---:|---:|---:|---:|---:|---:|---:|")
          for name in sorted(n for n in items if n.endswith('_compiled')):
              prefix=name.removesuffix('_compiled')
              if prefix.endswith('_uri'): continue
              get=lambda suffix:items.get(prefix+'_'+suffix)
              c=get('compiled')
              n=get('native')
              b=get('blackbird')
              d=get('direct')
              dw=get('direct_wrapped')
              if not n or not b:
                  print(f"**MISSING comparator for {prefix}**")
                  continue
              score=lambda v:v['primaryMetric']['score'] if v else None
              fmt=lambda v:f"{score(v):.3f}" if v else "—"
              alloc=c.get('secondaryMetrics',{}).get('gc.alloc.rate.norm',{}).get('score')
              a=f"{alloc:.1f}" if alloc is not None else "—"
              print(f"| {prefix} | {fmt(c)} | {fmt(n)} | {fmt(b)} | {fmt(d)} | {fmt(dw)} | {score(n)/score(c):.3f}x | {score(b)/score(c):.3f}x | {a} |")
          print()
          print()
          print("## Isolated URI Codec (us/op)")
          print("| Backend | Compiled | Runtime | Direct |")
          print("|---|---:|---:|---:|")
          for backend in ('jackson2','jackson3'):
              key='json_'+backend+'_uri'
              print(f"| {backend} | {fmt(items.get(key+'_compiled'))} | {fmt(items.get(key+'_runtime'))} | {fmt(items.get(key+'_direct'))} |")
          print()
          print("Blackbird/Compiled >1 means compiled is faster; check error bars and repeat on fixed hardware before declaring a stable advantage.")
          PY
          cat write-perf-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-write-jmh
          path: |
            write-perf-results.json
            write-perf.log
            write-perf-summary.md
          if-no-files-found: warn
