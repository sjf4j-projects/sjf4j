name: Binding Write Repeatability (JDK 25)

on:
  pull_request:
    paths:
      - ".github/workflows/binding-write-repeatability.yml"
      - "scripts/analyze-binding-write-retest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeatability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile JMH benchmark jar
        run: ./gradlew :sjf4j-testbench:jmhJar

      - name: Re-measure Jackson POJO Write
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -type f -name '*-jmh.jar' | sort | head -n 1)
          test -n "$JAR"
          mkdir -p build/performance/binding/write-retest
          for backend in jackson2 jackson3; do
            result="build/performance/binding/write-retest/$backend.json"
            log="build/performance/binding/write-retest/$backend.log"
            if ! java -jar "$JAR" \
                'org.sjf4j.testbench.binding.fabien.FabienWriteBenchmark.write' \
                -p "backend=$backend" \
                -p implementation=runtime,compiled \
                -p model=users,clients -p shape=pojo \
                -p sizeKb=10,100 -p seed=12345,324 \
                -t 1 -f 5 -wi 3 -i 5 -w 200ms -r 300ms \
                -prof gc -rf json -rff "$result" >"$log" 2>&1; then
              tail -100 "$log"
              exit 1
            fi
            echo "Finished $backend. Results: $result"
          done

      - name: Analyze independent forks and paired seed results
        run: |
          python3 scripts/analyze-binding-write-retest.py \
            build/performance/binding/write-retest/jackson2.json \
            build/performance/binding/write-retest/jackson3.json \
            --output build/performance/binding/write-retest/report.md

      - name: Upload independent-fork JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-write-repeatability-jdk25
          path: build/performance/binding/write-retest/
          retention-days: 14
          if-no-files-found: warn
