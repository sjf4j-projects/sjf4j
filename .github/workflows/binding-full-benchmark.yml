name: Binding Full Benchmark (JDK 25)

# Expensive and noisy shared-runner measurements: manual invocation only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binding-full-jdk25-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-jmh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile JMH jar once
        run: ./gradlew :sjf4j-testbench:jmhJar

      - name: Upload JMH jar for backend jobs
        uses: actions/upload-artifact@v4
        with:
          name: binding-full-jmh-jar
          path: sjf4j-testbench/build/libs/*-jmh.jar
          if-no-files-found: error
          retention-days: 7

  benchmark:
    name: Full / ${{ matrix.backend }}
    needs: build-jmh
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        backend: [jackson2, jackson3, fastjson2, gson, jsonp, simple, snake]
    env:
      BINDING_BACKEND: ${{ matrix.backend }}
      BINDING_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download prebuilt JMH jar
        uses: actions/download-artifact@v4
        with:
          name: binding-full-jmh-jar
          path: sjf4j-testbench/build/libs

      - name: Record runner hardware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/performance/binding
          {
            echo "Backend: $BINDING_BACKEND"
            echo "Runner: $RUNNER_NAME"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner arch: $RUNNER_ARCH"
            echo "GitHub run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "CPU:"
            lscpu
            echo
            echo "Memory:"
            free -h
            echo
            echo "JDK:"
            java -version 2>&1
          } > "build/performance/binding/runner-$BINDING_BACKEND.txt"

      - name: Run Full JMH for ${{ matrix.backend }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/benchmark-binding.sh full build/performance/binding \
            2>&1 | tee build/performance/binding/benchmark.log

      - name: Summarize representative results
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          from statistics import mean

          backend = os.environ["BINDING_BACKEND"]
          paths = list(Path("build/performance/binding").glob(f"binding-*-full-jdk25-{backend}.json"))
          if len(paths) != 1:
              raise SystemExit(f"Expected one JMH JSON for {backend}, found {len(paths)}")
          rows = json.loads(paths[0].read_text(encoding="utf-8"))
          print(f"## Binding Full — {backend}")
          print()
          print(f"Completed **{len(rows)}** JMH cases. Raw fork/iteration results and GC metrics are in the artifact.")
          print()
          print("Users / POJO / 100KB / seed 12345 (µs/op; lower is better).")
          print("**Best 2 Mean:** separately for each implementation, average each fork's 5 iterations, drop the slowest fork, and average the remaining two.")
          print("The original JMH Score uses all 3 forks; JMH scoreError does **not** apply to Best 2.")
          print()
          print("| Operation | Implementation | Best 2 Mean | JMH 3-Fork Mean | Individual fork means |")
          print("| --- | --- | ---: | ---: | --- |")
          examples = [
              row for row in rows
              if row["params"]["model"] == "users"
              and row["params"]["shape"] == "pojo"
              and row["params"]["sizeKb"] == "100"
              and row["params"]["seed"] == "12345"
          ]
          operation_order = ("Read", "Write")
          implementation_order = ("native", "blackbird", "runtime", "compiled")
          for operation in operation_order:
              for implementation in implementation_order:
                  matched = [
                      row for row in examples
                      if ("ReadBenchmark" in row["benchmark"]) == (operation == "Read")
                      and row["params"]["implementation"] == implementation
                  ]
                  for row in matched:
                      metric = row["primaryMetric"]
                      forks = metric["rawData"]
                      if len(forks) != 3 or any(not fork for fork in forks):
                          raise SystemExit(f"Expected 3 non-empty JMH forks for {operation}/{implementation}")
                      fork_means = [mean(fork) for fork in forks]
                      best2 = mean(sorted(fork_means)[:2])
                      labels = " / ".join(f"{score:.3f}" for score in fork_means)
                      print(f"| {operation} | {implementation.capitalize()} | {best2:.3f} | "
                            f"{metric['score']:.3f} | {labels} |")
          PY

      - name: Upload per-backend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-full-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/performance/binding/
          if-no-files-found: warn
          retention-days: 30

  collect-results:
    name: Bundle all backend artifacts
    needs: [build-jmh, benchmark]
    if: ${{ always() && needs.build-jmh.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download per-backend artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binding-full-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: results
          merge-multiple: false

      - name: Upload one combined archive for analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-full-combined-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
