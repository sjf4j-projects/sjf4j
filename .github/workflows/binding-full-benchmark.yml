name: Binding Full Benchmark (JDK 25)

# Expensive and noisy shared-runner measurements: manual invocation only.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: binding-full-jdk25-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-jmh:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile JMH jar once
        run: ./gradlew :sjf4j-testbench:jmhJar

      - name: Upload JMH jar for backend jobs
        uses: actions/upload-artifact@v4
        with:
          name: binding-full-jmh-jar
          path: sjf4j-testbench/build/libs/*-jmh.jar
          if-no-files-found: error
          retention-days: 7

  benchmark:
    name: Full / ${{ matrix.backend }}
    needs: build-jmh
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        backend: [jackson2, jackson3, fastjson2, gson, jsonp, simple, snake]
    env:
      BINDING_BACKEND: ${{ matrix.backend }}
      BINDING_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download prebuilt JMH jar
        uses: actions/download-artifact@v4
        with:
          name: binding-full-jmh-jar
          path: sjf4j-testbench/build/libs

      - name: Record runner hardware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/performance/binding
          {
            echo "Backend: $BINDING_BACKEND"
            echo "Runner: $RUNNER_NAME"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner arch: $RUNNER_ARCH"
            echo "GitHub run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "CPU:"
            lscpu
            echo
            echo "Memory:"
            free -h
            echo
            echo "JDK:"
            java -version 2>&1
          } > "build/performance/binding/runner-$BINDING_BACKEND.txt"

      - name: Run Full JMH for ${{ matrix.backend }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/benchmark-binding.sh full build/performance/binding \
            2>&1 | tee build/performance/binding/benchmark.log

      - name: Summarize representative results
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          from statistics import mean

          backend = os.environ["BINDING_BACKEND"]
          paths = list(Path("build/performance/binding").glob(f"binding-*-full-jdk25-{backend}.json"))
          if len(paths) != 1:
              raise SystemExit(f"Expected one JMH JSON for {backend}, found {len(paths)}")
          rows = json.loads(paths[0].read_text(encoding="utf-8"))
          print(f"## Binding Full — {backend}")
          print()
          print(f"Completed **{len(rows)}** JMH cases. Raw fork/iteration results and GC metrics are in the artifact.")
          print()
          print("Users / POJO / 100KB / seed 12345 (µs/op; lower is better).")
          print("**Best 2 Mean:** separately for each implementation, average each fork's 5 iterations, drop the slowest fork, and average the remaining two.")
          print("The original JMH Score uses all 3 forks; JMH scoreError does **not** apply to Best 2.")
          print()
          print("| Operation | Implementation | Best 2 Mean | JMH 3-Fork Mean | Individual fork means |")
          print("| --- | --- | ---: | ---: | --- |")
          examples = [
              row for row in rows
              if row["params"]["model"] == "users"
              and row["params"]["shape"] == "pojo"
              and row["params"]["sizeKb"] == "100"
              and row["params"]["seed"] == "12345"
          ]
          operation_order = ("Read", "Write")
          implementation_order = ("native", "blackbird", "runtime", "compiled")
          for operation in operation_order:
              for implementation in implementation_order:
                  matched = [
                      row for row in examples
                      if ("ReadBenchmark" in row["benchmark"]) == (operation == "Read")
                      and row["params"]["implementation"] == implementation
                  ]
                  for row in matched:
                      metric = row["primaryMetric"]
                      forks = metric["rawData"]
                      if len(forks) != 3 or any(not fork for fork in forks):
                          raise SystemExit(f"Expected 3 non-empty JMH forks for {operation}/{implementation}")
                      fork_means = [mean(fork) for fork in forks]
                      best2 = mean(sorted(fork_means)[:2])
                      labels = " / ".join(f"{score:.3f}" for score in fork_means)
                      print(f"| {operation} | {implementation.capitalize()} | {best2:.3f} | "
                            f"{metric['score']:.3f} | {labels} |")
          PY

      - name: Upload per-backend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-full-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/performance/binding/
          if-no-files-found: warn
          retention-days: 30

  collect-results:
    name: Bundle all backend artifacts
    needs: [build-jmh, benchmark]
    if: ${{ always() && needs.build-jmh.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download per-backend artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binding-full-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: results
          merge-multiple: false

      - name: Upload one combined archive for analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-full-combined-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

  uuid-write-compare:
    name: Targeted Jackson2 UUID Write (A/B/B/A)
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'bench/jackson2-uuid-write-20261117' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar

      - name: Record runner environment and run targeted A/B/B/A
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/performance/uuid-write
          {
            echo "Runner: $RUNNER_NAME; OS: $RUNNER_OS; arch: $RUNNER_ARCH"
            lscpu
            java -version 2>&1
          } > build/performance/uuid-write/runner.txt

          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*-jmh.jar' -type f | head -n 1)
          test -n "$JAR"
          run() {
            local method="$1"
            local tag="$2"
            java -jar "$JAR" \
              "org.sjf4j.testbench.binding.uuid.Jackson2UuidWriteBenchmark.$method" \
              -p count=1,64,512 -t 1 -f 3 \
              -wi 4 -i 4 -w 500ms -r 1s \
              -prof gc -rf json \
              -rff "build/performance/uuid-write/$tag.json" \
              2>&1 | tee "build/performance/uuid-write/$tag.log"
          }
          run jacksonSerializer S1
          run fastUuid F1
          run fastUuid F2
          run jacksonSerializer S2

      - name: Summarize JMH performance
        shell: bash
        run: |
          python3 - <<'PY' | tee build/performance/uuid-write/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          from statistics import mean
          directory = Path('build/performance/uuid-write')
          data = {tag: {int(row['params']['count']): row for row in json.loads((directory / (tag + '.json')).read_text())}
                  for tag in ('S1','F1','F2','S2')}
          for tag, rows in data.items():
              assert set(rows) == {1,64,512}, f'Incomplete results for {tag}: {rows.keys()}'
          print('## Jackson2 UUIDSerializer vs FastUuid')
          print('JDK 25, same runner, 3 forks per case, 4×500ms warmup, 4×1s measurements, -prof gc.')
          print('S1/F1/F2/S2 sequence; below numbers are means of two JMH 3-fork mean scores per implementation.')
          print('Positive speedup = current Jackson2 UUIDSerializer faster than FastUuid.toString + writeString.')
          print()
          print('| UUIDs/op | Serializer (µs/op) | FastUuid (µs/op) | Serializer speedup | Serializer B/op | FastUuid B/op |')
          print('| ---: | ---: | ---: | ---: | ---: | ---: |')
          for count in (1,64,512):
              ser = mean(data[t][count]['primaryMetric']['score'] for t in ('S1','S2'))
              fast = mean(data[t][count]['primaryMetric']['score'] for t in ('F1','F2'))
              def alloc(tag):
                  return data[tag][count].get('secondaryMetrics', {}).get('gc.alloc.rate.norm', {}).get('score', float('nan'))
              print(f'| {count} | {ser:.3f} | {fast:.3f} | {(fast/ser-1)*100:+.1f}% | '
                    f'{mean(alloc(t) for t in ("S1","S2")):.0f} | {mean(alloc(t) for t in ("F1","F2")):.0f} |')
          print()
          print('Per-run JMH score and individual fork data are available in the artifact JSON.')
          PY

      - name: Upload UUID write benchmark data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson2-uuid-write-${{ github.run_id }}
          path: build/performance/uuid-write/
          if-no-files-found: warn
          retention-days: 30
