name: Binding Full Benchmark (JDK 25)

# Full suite remains manual; PR job temporarily compares Jackson3 read A/B.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sjf4j-backend-jackson3/**'
      - 'sjf4j-processor/**'
      - '.github/workflows/binding-full-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: binding-full-jdk25-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-jmh:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile JMH jar once
        run: ./gradlew :sjf4j-testbench:jmhJar

      - name: Upload JMH jar for backend jobs
        uses: actions/upload-artifact@v4
        with:
          name: binding-full-jmh-jar
          path: sjf4j-testbench/build/libs/*-jmh.jar
          if-no-files-found: error
          retention-days: 7

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    name: Full / ${{ matrix.backend }}
    needs: build-jmh
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        backend: [jackson2, jackson3, fastjson2, gson, jsonp, simple, snake]
    env:
      BINDING_BACKEND: ${{ matrix.backend }}
      BINDING_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download prebuilt JMH jar
        uses: actions/download-artifact@v4
        with:
          name: binding-full-jmh-jar
          path: sjf4j-testbench/build/libs

      - name: Record runner hardware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/performance/binding
          {
            echo "Backend: $BINDING_BACKEND"
            echo "Runner: $RUNNER_NAME"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner arch: $RUNNER_ARCH"
            echo "GitHub run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "CPU:"
            lscpu
            echo
            echo "Memory:"
            free -h
            echo
            echo "JDK:"
            java -version 2>&1
          } > "build/performance/binding/runner-$BINDING_BACKEND.txt"

      - name: Run Full JMH for ${{ matrix.backend }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/benchmark-binding.sh full build/performance/binding \
            2>&1 | tee build/performance/binding/benchmark.log

      - name: Summarize representative results
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          from statistics import mean

          backend = os.environ["BINDING_BACKEND"]
          paths = list(Path("build/performance/binding").glob(f"binding-*-full-jdk25-{backend}.json"))
          if len(paths) != 1:
              raise SystemExit(f"Expected one JMH JSON for {backend}, found {len(paths)}")
          rows = json.loads(paths[0].read_text(encoding="utf-8"))
          print(f"## Binding Full — {backend}")
          print()
          print(f"Completed **{len(rows)}** JMH cases. Raw fork/iteration results and GC metrics are in the artifact.")
          print()
          print("Users / POJO / 100KB / seed 12345 (µs/op; lower is better).")
          print("**Best 2 Mean:** separately for each implementation, average each fork's 5 iterations, drop the slowest fork, and average the remaining two.")
          print("The original JMH Score uses all 3 forks; JMH scoreError does **not** apply to Best 2.")
          print()
          print("| Operation | Implementation | Best 2 Mean | JMH 3-Fork Mean | Individual fork means |")
          print("| --- | --- | ---: | ---: | --- |")
          examples = [
              row for row in rows
              if row["params"]["model"] == "users"
              and row["params"]["shape"] == "pojo"
              and row["params"]["sizeKb"] == "100"
              and row["params"]["seed"] == "12345"
          ]
          operation_order = ("Read", "Write")
          implementation_order = ("native", "blackbird", "runtime", "compiled")
          for operation in operation_order:
              for implementation in implementation_order:
                  matched = [
                      row for row in examples
                      if ("ReadBenchmark" in row["benchmark"]) == (operation == "Read")
                      and row["params"]["implementation"] == implementation
                  ]
                  for row in matched:
                      metric = row["primaryMetric"]
                      forks = metric["rawData"]
                      if len(forks) != 3 or any(not fork for fork in forks):
                          raise SystemExit(f"Expected 3 non-empty JMH forks for {operation}/{implementation}")
                      fork_means = [mean(fork) for fork in forks]
                      best2 = mean(sorted(fork_means)[:2])
                      labels = " / ".join(f"{score:.3f}" for score in fork_means)
                      print(f"| {operation} | {implementation.capitalize()} | {best2:.3f} | "
                            f"{metric['score']:.3f} | {labels} |")
          PY

      - name: Upload per-backend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-full-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/performance/binding/
          if-no-files-found: warn
          retention-days: 30

  collect-results:
    name: Bundle all backend artifacts
    needs: [build-jmh, benchmark]
    if: ${{ github.event_name == 'workflow_dispatch' && always() && needs.build-jmh.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download per-backend artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binding-full-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: results
          merge-multiple: false

      - name: Upload one combined archive for analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-full-combined-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

  jackson3-read-ab:
    name: Targeted Binding Full — Jackson3 Read A/B
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout base (before)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Checkout PR head (after)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build baseline and candidate JMH jars
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && ./gradlew :sjf4j-testbench:jmhJar)
          (cd candidate && ./gradlew :sjf4j-testbench:jmhJar)

      - name: Run targeted Binding Full JMH (Jackson3 Read / POJO)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for variant in baseline candidate; do
            jar=$(find "$variant/sjf4j-testbench/build/libs" -name '*-jmh.jar' -type f | head -n 1)
            test -n "$jar"
            echo "Running $variant on $(java -version 2>&1 | head -n 1)"
            java -jar "$jar" \
              'org.sjf4j.testbench.binding.fabien.FabienReadBenchmark.read' \
              -p backend=jackson3 \
              -p implementation=runtime,compiled,native,blackbird \
              -p model=users,clients -p shape=pojo \
              -p sizeKb=10,100 -p seed=12345,324 \
              -rf json -t 1 -f 3 -wi 5 -i 5 -w 1s -r 1s -prof gc \
              -rff "results/$variant.json" 2>&1 | tee "results/$variant.log"
          done

      - name: Compare Best 2 Mean across identical cases
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' | tee results/comparison.md >> "$GITHUB_STEP_SUMMARY"
          import json
          import statistics
          from pathlib import Path

          def collect(variant):
              rows = json.loads(Path(f"results/{variant}.json").read_text())
              if len(rows) != 32:
                  raise SystemExit(f"{variant}: expected 32 JMH cases, found {len(rows)}")
              measures = {}
              for row in rows:
                  p = row["params"]
                  key = (p["model"], p["sizeKb"], p["seed"], p["implementation"])
                  forks = row["primaryMetric"]["rawData"]
                  if len(forks) != 3 or any(not fork for fork in forks):
                      raise SystemExit(f"{variant} {key}: expected three complete forks")
                  measures[key] = statistics.mean(sorted(statistics.mean(f) for f in forks)[:2])
              return measures

          before, after = collect("baseline"), collect("candidate")
          if before.keys() != after.keys():
              raise SystemExit("Baseline/candidate JMH case mismatch")
          print("## Jackson3 Read / POJO, targeted Binding Full JMH")
          print("JDK 25, same runner, 3 forks × (5×1s warmup + 5×1s measurement), 2 seeds.")
          print("Best 2 fork means; lower µs/op is better. Shared-runner results are exploratory.")
          print()
          print("| Model | Size | Implementation | Before (µs) | After (µs) | Change |")
          print("| --- | --- | --- | ---: | ---: | ---: |")
          for model in ("users", "clients"):
              for size in ("10", "100"):
                  for impl in ("native", "blackbird", "runtime", "compiled"):
                      keys = [(model, size, seed, impl) for seed in ("12345", "324")]
                      b = statistics.mean(before[k] for k in keys)
                      a = statistics.mean(after[k] for k in keys)
                      print(f"| {model} | {size}KB | {impl} | {b:.3f} | {a:.3f} | {(b/a - 1)*100:+.1f}% faster |")
          PY

      - name: Upload raw JMH and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jackson3-native-read-ab-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
