name: Gson Simple UTF8 Transcode A/B
on:
  push:
    branches:
      - perf/gson-simple-utf8-transcode-ab
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Full affected module regression
        run: ./gradlew :sjf4j-core:test :sjf4j-backend-gson:test :sjf4j-backend-jsonp:test :sjf4j-backend-fastjson2:test :sjf4j-processor:test --no-daemon
      - name: Show processor test failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('sjf4j-processor/build/test-results/test/TEST-*.xml'):
              root = ET.parse(f).getroot()
              for case in root.findall('testcase'):
                  for failure in case.findall('failure'):
                      print('FAILED:', case.get('classname'), case.get('name'))
                      print((failure.get('message') or '')[:5000])
                      print((failure.text or '')[:2000])
          PY
      - name: Build JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Compare compiled String transcode versus byte stream
        shell: bash
        run: |
          set -o pipefail
          java -jar sjf4j-testbench/build/libs/*-jmh.jar \
            '.*CompiledWriteBenchmark.json_(gson|simple|jsonp)_(pojo|map)_utf8_(compiled|compiled_transcode|runtime|native_transcode)' \
            -wi 3 -i 5 -w 300ms -r 500ms -f 1 -prof gc | tee gson-simple-utf8-ab.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gson-simple-utf8-ab
          path: gson-simple-utf8-ab.log
          if-no-files-found: ignore
