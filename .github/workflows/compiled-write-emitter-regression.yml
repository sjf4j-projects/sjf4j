name: Compiled Write Emitter Regression

on:
  push:
    branches:
      - perf/compiled-write-emitter-ci
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run all binder regressions
        run: |
          ./gradlew \
            :sjf4j-processor:test \
            :sjf4j-backend-fastjson2:test \
            :sjf4j-backend-jackson2:test \
            :sjf4j-backend-jackson3:test \
            :sjf4j-backend-gson:test \
            :sjf4j-backend-jsonp:test \
            :sjf4j-backend-snake:test \
            :sjf4j-testbench:test \
            --no-daemon
      - name: Build JMH
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
