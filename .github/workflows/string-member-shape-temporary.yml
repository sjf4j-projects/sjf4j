name: Temporary StringMember Shape Benchmark
on:
  push:
    branches:
      - bench/string-member-null-branch-shape-20261028
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JMH jar
        run: ./gradlew :sjf4j-testbench:jmhJar --no-daemon
      - name: Compare string-member branch shapes
        run: |
          JAR=$(find sjf4j-testbench/build/libs -maxdepth 1 -name '*jmh.jar' -print -quit)
          test -n "$JAR"
          java -jar "$JAR" '.*StringMemberShapeBenchmark.*' -f 1 -wi 4 -i 5 -w 350ms -r 350ms -t 1 -rf json -rff /tmp/string-member-results.json
          echo 'JMH_JSON_RESULTS:'
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/string-member-results.json'))
          for row in data:
              params=row['params']
              print("%s includeNulls=%s nullPattern=%s %.3f ns/op" % (
                  row['benchmark'].split('.')[-1],params['includeNulls'],params['nullPattern'],row['primaryMetric']['score']))
          PY
