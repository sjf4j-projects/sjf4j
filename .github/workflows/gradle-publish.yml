name: Publish Release to Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Import signing key
        env:
          SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}
        run: printf '%s' "$SIGNING_SECRET_KEY" | base64 --decode > "$GITHUB_WORKSPACE/secring.gpg"

      - name: Configure Maven Central and signing credentials
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          {
            printf 'mavenCentralUsername=%s\n' "$OSSRH_USERNAME"
            printf 'mavenCentralPassword=%s\n' "$OSSRH_PASSWORD"
            printf 'signing.keyId=%s\n' "$SIGNING_KEY_ID"
            printf 'signing.password=%s\n' "$SIGNING_PASSWORD"
            printf 'signing.secretKeyRingFile=%s/secring.gpg\n' "$GITHUB_WORKSPACE"
          } >> gradle.properties

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-daemon
