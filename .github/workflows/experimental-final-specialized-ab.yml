name: Final Fastjson2 Specialized Matcher vs PR34
on:
  push:
    branches:
      - experiment/compiled-fastjson2-matcher-driven
    paths:
      - .github/workflows/experimental-final-specialized-ab.yml
permissions:
  contents: read
jobs:
  test-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Test generated matcher and backend conformance
        shell: bash
        run: |
          ./gradlew :sjf4j-backend-fastjson2:test :sjf4j-processor:test :sjf4j-testbench:test --no-daemon --console=plain && exit 0
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for f in Path('sjf4j-processor/build/test-results/test').glob('TEST-*.xml'):
              for tc in ET.parse(f).getroot().findall('.//testcase'):
                  for issue in list(tc.findall('failure'))+list(tc.findall('error')):
                      print(tc.attrib.get('name'), issue.attrib.get('message'))
          PY
          exit 1
      - name: Build baseline PR34 and specialized matcher
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/final-base 5349dc38982a47d35745842439443b9f2fb6093c
          git worktree add --detach /tmp/final-candidate HEAD
          (cd /tmp/final-base && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
          (cd /tmp/final-candidate && ./gradlew :sjf4j-testbench:jmhJar --no-daemon --console=plain)
      - name: Benchmark compiled String and UTF8 ordered/reversed A-B-B-A
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for tag in base-1 candidate-1 candidate-2 base-2; do
            kind="${tag%-*}"
            java -jar /tmp/final-${kind}/sjf4j-testbench/build/libs/*-jmh.jar \
              '.*CompiledReadBenchmark[.]json_fastjson2_pojo_(reversed_)?(string|utf8)_compiled$' \
              -f 1 -wi 5 -w 300ms -i 8 -r 350ms -t 1 \
              -rf json -rff results/${tag}.json | tee results/${tag}.txt
          done
      - name: Analyze paired results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          groups={}
          for tag in ['base-1','candidate-1','candidate-2','base-2']:
              data=json.loads(Path('results',tag+'.json').read_text())
              assert len(data)==4,(tag,len(data))
              for row in data:
                  case=('reversed' if '_reversed_' in row['benchmark'] else 'ordered')+'/'+('utf8' if '_utf8_' in row['benchmark'] else 'string')
                  groups.setdefault(case,{})[tag]=row['primaryMetric']['score']
          for key,s in sorted(groups.items()):
              old=(s['base-1']+s['base-2'])/2
              new=(s['candidate-1']+s['candidate-2'])/2
              print(f'{key}: PR34 {old:.6f}, specialized {new:.6f}, delta {(new/old-1)*100:+.2f}% ; {s}')
          PY
      - name: Inspect generated matcher code
        if: always()
        shell: bash
        run: |
          find /tmp/final-candidate/sjf4j-testbench/build -type f -name '*Fastjson2CompiledBinder_Impl.java' | head -10 || true
          grep -R -n -m 2 'extends.*Fastjson2NameMatcher\|\.nextNameMatch(reader)' /tmp/final-candidate/sjf4j-testbench/build/generated 2>/dev/null | head -25 || true
      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-compiled-specialized-final-ab
          path: results/
          if-no-files-found: ignore
